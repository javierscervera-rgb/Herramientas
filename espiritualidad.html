<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comentario del día</title>
<style>
  :root{
    --bg:#171310; --panel:#201D18; --accent:#CD8B75; --btn2:#292420;
    --text:#F0E8DC; --text2:#AA9D8F; --border:#37312B; --accent2:#D88972;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:Georgia,"Times New Roman",serif;line-height:1.6;
    display:flex;flex-direction:column;height:100dvh}

  /* Cabecera */
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;
    border-bottom:1px solid var(--border);flex:0 0 auto}
  .logo-btn{display:inline-flex;align-items:center;text-decoration:none}
  .logo{display:block;height:clamp(32px,5vw,48px);width:auto;max-width:200px}
  .day-label{margin-left:auto;text-align:right;font-family:system-ui,sans-serif;
    font-size:.85rem;color:var(--text2);line-height:1.3}
  .day-label b{display:block;color:var(--text);font-weight:600;text-transform:capitalize}

  /* Brillo del logo al cargar */
  a:has(> .logo){position:relative}
  a > .logo{position:relative;z-index:1}
  a:has(> .logo)::before{content:"";position:absolute;inset:-16px;border-radius:50%;
    background:radial-gradient(circle,rgba(216,137,114,.75) 0%,rgba(216,137,114,.3) 42%,rgba(216,137,114,0) 70%);
    opacity:0;pointer-events:none;animation:brillo-logo 1.8s ease-in-out .5s 1 both}
  @keyframes brillo-logo{0%{opacity:0;transform:scale(.6)}45%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}
  @media (prefers-reduced-motion: reduce){a:has(> .logo)::before{animation:none}}

  /* Pestañas de fuente */
  .tabs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;flex:0 0 auto;
    scrollbar-width:none;font-family:system-ui,sans-serif}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;background:var(--btn2);color:var(--text2);border:1px solid var(--border);
    border-radius:999px;padding:6px 14px;font-size:.85rem;cursor:pointer;white-space:nowrap}
  .tab.active{background:var(--accent2);color:#171310;border-color:var(--accent2);font-weight:600}

  /* Escenario: horizontal = fuentes, vertical = días */
  .stage{flex:1 1 auto;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;--colw:min(84%,760px);scrollbar-width:none;overscroll-behavior-x:contain}
  .stage::-webkit-scrollbar{display:none}
  .stage::before,.stage::after{content:"";flex:0 0 calc((100% - var(--colw)) / 2)}
  .column{flex:0 0 var(--colw);height:100%;overflow-y:auto;overflow-x:hidden;
    scroll-snap-align:center;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior-y:contain}
  .column::-webkit-scrollbar{display:none}
  .slot{height:100%;padding:6px 5px 14px;scroll-snap-align:start;scroll-snap-stop:always}

  /* Pastilla */
  .pill{height:100%;transition:opacity .3s,transform .3s;background:var(--panel);
    border:1px solid var(--border);border-radius:24px;overflow:hidden;
    display:flex;flex-direction:column}
  .column:not(.active) .pill{opacity:.6;transform:scale(.96)}
  .banner{flex:0 0 20%;min-height:0;background:var(--btn2)}
  .banner img{width:100%;height:100%;object-fit:cover;display:block}
  .pill-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 20px 22px;
    overscroll-behavior-y:auto}
  .meta{font-family:system-ui,sans-serif;font-size:.78rem;color:var(--text2);
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
  .pill h2{margin:0 0 12px;font-size:clamp(1.25rem,3.5vw,1.6rem);line-height:1.25;color:var(--accent2)}
  .pill h2 a{color:inherit;text-decoration:none}
  .sec{font-family:system-ui,sans-serif;font-size:.78rem;font-weight:600;color:var(--accent);
    text-transform:uppercase;letter-spacing:.08em;margin:18px 0 6px;
    padding-top:12px;border-top:1px solid var(--border)}
  .sec:first-of-type{border-top:0;padding-top:0;margin-top:4px}
  .txt p{margin:0 0 .85em}
  .txt h4{margin:1em 0 .4em;color:var(--accent2);font-size:1.02rem}
  .txt em{color:var(--accent)}
  .gospel p{color:var(--text2);font-style:italic}
  .foot{margin-top:16px;font-family:system-ui,sans-serif}
  .btn{display:inline-block;background:var(--btn2);color:var(--text);border:1px solid var(--border);
    padding:8px 14px;border-radius:999px;font-size:.85rem;text-decoration:none;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .status{color:var(--text2);font-family:system-ui,sans-serif;font-size:.95rem;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;height:100%;text-align:center;padding:20px}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);
    border-top-color:var(--accent2);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Pista de gestos */
  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;
    background:var(--btn2);border:1px solid var(--border);color:var(--text);
    font-family:system-ui,sans-serif;font-size:.82rem;padding:8px 14px;border-radius:999px;
    transition:opacity .6s;pointer-events:none;white-space:nowrap}
  .hint.hide{opacity:0}

  /* Flechas en escritorio */
  .nav{position:fixed;right:18px;bottom:50%;transform:translateY(50%);display:none;
    flex-direction:column;gap:8px;z-index:15}
  .nav button{width:40px;height:40px;border-radius:50%;background:var(--btn2);color:var(--text);
    border:1px solid var(--border);cursor:pointer;font-size:1rem}
  .nav button:hover{border-color:var(--accent)}
  @media (hover:hover) and (min-width:900px){.nav{display:flex}}
</style>
</head>
<body>
<header>
  <a class="logo-btn" href="https://javierscervera-rgb.github.io/Herramientas/index.html" target="_self" aria-label="Volver a Herramientas">
    <img class="logo" src="logo.svg" alt="Herramientas">
  </a>
  <div class="day-label"><span id="srcName">Comentario del día</span><b id="dayName"></b></div>
</header>

<nav class="tabs" id="tabs" aria-label="Fuentes"></nav>
<main class="stage" id="stage"></main>

<div class="nav" aria-hidden="true">
  <button id="prevSrc" title="Fuente anterior">←</button>
  <button id="prevDay" title="Día siguiente">↑</button>
  <button id="nextDay" title="Día anterior">↓</button>
  <button id="nextSrc" title="Fuente siguiente">→</button>
</div>
<div class="hint" id="hint">← → cambia de fuente · ↓ días anteriores</div>

<script>
/* ---------- utilidades de fecha ---------- */
const TODAY = new Date(); TODAY.setHours(12,0,0,0);
const dayDate = i => { const d = new Date(TODAY); d.setDate(d.getDate() - i); return d; };
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const longDate = d => d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
const relDay = i => i===0 ? "Hoy" : i===1 ? "Ayer" : longDate(dayDate(i));

/* ---------- red: directo y, si falla, por proxies CORS ---------- */
const PROXIES = [
  u => u,
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
let goodProxy = 0;
async function fetchText(url){
  const order = [goodProxy, ...PROXIES.keys()].filter((v,i,a)=>a.indexOf(v)===i);
  let last;
  for(const i of order){
    try{
      const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 12000);
      const r = await fetch(PROXIES[i](url), {signal:ctl.signal});
      clearTimeout(t);
      if(r.ok){ const txt = await r.text(); if(txt && txt.trim().length){ if(i) goodProxy = i; return txt; } }
      last = new Error("HTTP " + r.status);
    }catch(e){ last = e; }
  }
  throw last || new Error("Sin conexión");
}
const cacheGet = k => { try{ return JSON.parse(sessionStorage.getItem(k)); }catch(e){ return null; } };
const cacheSet = (k,v) => { try{ sessionStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

/* ---------- extracción de texto ---------- */
const STOP = /Otros eventos|Evangelio para niños|Comentario bíblico|Te puede interesar|Compartir|Suscr[ií]b|Pensamientos para|^Categor[ií]a$/i;
const parseHTML = h => new DOMParser().parseFromString(h, "text/html");
const level = h => +h.tagName[1];

// Devuelve los bloques de texto que siguen a un encabezado, hasta el siguiente del mismo nivel o superior
function section(doc, startRe){
  const hs = [...doc.querySelectorAll("h1,h2,h3,h4,h5")];
  const i = hs.findIndex(h => startRe.test(h.textContent.trim()));
  if(i < 0) return [];
  const h = hs[i];
  const end = hs.slice(i+1).find(x => !h.contains(x) && (level(x) <= level(h) || STOP.test(x.textContent)));
  return blocksBetween(doc, h, end);
}

// Bloques de texto entre dos elementos (end puede ser null = hasta el final)
function blocksBetween(doc, start, end){
  const range = doc.createRange();
  range.setStartAfter(start);
  if(end) range.setEndBefore(end); else range.setEndAfter(doc.body.lastChild);
  const frag = range.cloneContents();
  frag.querySelectorAll("script,style,nav,form,button,figure,aside,iframe").forEach(e=>e.remove());
  const out = [];
  frag.querySelectorAll("h3,h4,h5,h6,p,blockquote,li").forEach(el=>{
    if(el.closest("li") && el.tagName!=="LI") return;
    if(el.tagName==="BLOCKQUOTE" && el.querySelector("p")) return;
    const t = el.textContent.replace(/\s+/g," ").trim();
    if(t.length > 1) out.push({t, h: /^H\d$/.test(el.tagName)});
  });
  if(!out.length){
    frag.textContent.split(/\n\s*\n|\n/).map(s=>s.replace(/\s+/g," ").trim())
      .filter(s=>s.length>1).forEach(t=>out.push({t, h:false}));
  }
  return out;
}

/* ---------- fuentes ---------- */
const SOURCES = [
  {
    id:"ed", name:"Espiritualidad digital", site:"https://www.espiritualidaddigital.com",
    async load(i){
      const d = iso(dayDate(i));
      const api = `${this.site}/wp-json/wp/v2/posts?after=${d}T00:00:00&before=${d}T23:59:59&per_page=1&_embed=wp:featuredmedia`;
      let p;
      try{ p = JSON.parse(await fetchText(api))[0]; }
      catch(e){ p = await this.fromRss(d); }
      if(!p) return null;
      const doc = parseHTML(p.content.rendered);
      doc.querySelectorAll(".addtoany_share_save_container,.a2a_kit,.sharedaddy,script,style,iframe,img,figure").forEach(e=>e.remove());
      const media = p._embedded?.["wp:featuredmedia"]?.[0];
      return {
        title: parseHTML(p.title.rendered).body.textContent,
        link: p.link,
        img: media?.media_details?.sizes?.medium_large?.source_url || media?.source_url || null,
        sections: [{label:null, html: doc.body.innerHTML}]
      };
    },
    async fromRss(d){
      let items = this._rss;
      if(!items){
        const xml = new DOMParser().parseFromString(await fetchText(this.site + "/feed/"), "text/xml");
        items = this._rss = [...xml.querySelectorAll("item")].map(it=>({
          date: iso(new Date(it.querySelector("pubDate")?.textContent)),
          title:{rendered: it.querySelector("title")?.textContent || ""},
          link: it.querySelector("link")?.textContent,
          content:{rendered: it.getElementsByTagName("content:encoded")[0]?.textContent || it.querySelector("description")?.textContent || ""}
        }));
      }
      return items.find(x => x.date === d);
    }
  },
  {
    id:"vn", name:"Vatican News", site:"https://www.vaticannews.va/es/evangelio-de-hoy.html",
    async load(i){
      const d = dayDate(i);
      const url = `https://www.vaticannews.va/es/evangelio-de-hoy/${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}.html`;
      const doc = parseHTML(await fetchText(url));
      const gospel = section(doc, /^Evangelio del D[ií]a/i);
      const popes = section(doc, /palabras de los Papas/i);
      if(!gospel.length && !popes.length) return null;
      return {
        title: "Las palabras de los Papas", link: url, img: null,
        sections: [
          {label:"Evangelio del día", blocks:gospel, gospel:true},
          {label:"Comentario", blocks:popes}
        ]
      };
    }
  },
  {
    id:"op", name:"Dominicos", site:"https://www.dominicos.org/predicacion/evangelio-del-dia/hoy/",
    async load(i){
      const d = dayDate(i);
      const url = `https://www.dominicos.org/predicacion/evangelio-del-dia/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}/`;
      const doc = parseHTML(await fetchText(url));
      const gospel = section(doc, /^Evangelio del d[ií]a$/i);
      const refl = section(doc, /Reflexi[oó]n del Evangelio/i);
      if(!gospel.length && !refl.length) return null;
      const titleBlock = refl.find(b => b.h);
      const og = doc.querySelector('meta[property="og:image"]')?.content;
      return {
        title: titleBlock ? titleBlock.t : "Reflexión del Evangelio",
        link: url,
        img: og && !/logo/i.test(og) ? og : null,
        sections: [
          {label:"Evangelio del día", blocks:gospel, gospel:true},
          {label:"Reflexión", blocks: titleBlock ? refl.filter(b=>b!==titleBlock) : refl}
        ]
      };
    }
  },
  {
    id:"en", name:"evangeli.net", site:"https://evangeli.net/evangelio",
    async load(i){
      const url = `https://evangeli.net/evangelio/dia/${iso(dayDate(i))}`;
      const doc = parseHTML(await fetchText(url));
      const blocks = section(doc, /^Contemplar el Evangelio de hoy/i);
      const g = blocks.findIndex(b => /^Texto del Evangelio/i.test(b.t));
      if(g < 0) return null;
      let c = blocks.findIndex((b,k) => k > g && /^Hoy\b/.test(b.t));
      if(c < 0) c = blocks.findIndex((b,k) => k > g && /^(Rev\.|Mons\.|Fr\.|P\.|Card\.|Mn\.|Pbro)/.test(b.t));
      if(c < 0) return null;
      // Las líneas cortas justo antes del comentario son la firma del autor
      const titleLine = /^«/.test(blocks[c-1]?.t || "") && c-1 > g ? blocks[c-1].t : null;
      const authorEnd = titleLine ? c - 1 : c;
      let a = authorEnd;
      while(a - 1 > g && blocks[a-1].t.length < 90 && !/[.;:»"]$/.test(blocks[a-1].t)) a--;
      const author = blocks.slice(a, authorEnd).map(b=>b.t).join(" ");
      const m = blocks[g].t.match(/^Texto del Evangelio\s*(\([^)]*\))?\s*:?\s*(.*)$/i);
      const gospel = [{t: m[2], h:false}, ...blocks.slice(g+1, a)].filter(b=>b.t);
      const comment = blocks.slice(c);
      return {
        title: titleLine ? titleLine.replace(/^«|»$/g,"") : "Contemplar el Evangelio de hoy", link: url, img: null,
        sections: [
          {label: "Evangelio " + (m[1] || ""), blocks: gospel, gospel:true},
          {label: author ? "Comentario · " + author : "Comentario", blocks: comment}
        ]
      };
    }
  },
  {
    id:"od", name:"Opus Dei", site:"https://opusdei.org/es-es/page/evangelio-diario/",
    async load(i){
      const url = `https://opusdei.org/es-es/gospel/${iso(dayDate(i))}/`;
      const doc = parseHTML(await fetchText(url));
      const h1 = doc.querySelector("h1");
      const ch = [...doc.querySelectorAll("h2,h3,h4")].find(h => /^Comentario al Evangelio$/i.test(h.textContent.trim()));
      if(!h1 || !ch) return null;
      let pre = blocksBetween(doc, h1, ch);
      const g = pre.findIndex(b => /^Evangelio\s*\(/.test(b.t));
      const gospel = g >= 0 ? pre.slice(g) : pre.filter(b => b.t.length > 60);
      let ref = "";
      if(gospel[0] && /^Evangelio\s*\(/.test(gospel[0].t)){
        const m = gospel[0].t.match(/^Evangelio\s*(\([^)]*\))\s*(.*)$/);
        ref = m[1]; gospel[0] = {t: m[2], h:false};
      }
      const og = doc.querySelector('meta[property="og:image"]')?.content;
      return {
        title: h1.textContent.replace(/^Comentario al Evangelio:\s*/i,"").trim(),
        link: url, img: og || null,
        sections: [
          {label: "Evangelio " + ref, blocks: gospel.filter(b=>b.t), gospel:true},
          {label: "Comentario al Evangelio", blocks: section(doc, /^Comentario al Evangelio$/i)}
        ]
      };
    }
  },
  {
    id:"cr", name:"Ciudad Redonda", site:"https://www.ciudadredonda.org/comentario-hoy/",
    async load(i){
      const d = dayDate(i);
      const phrase = `Comentario al Evangelio del ${d.getDate()} de ${MONTHS[d.getMonth()]} de ${d.getFullYear()}`;
      let url = this.site;
      if(i > 0){
        const api = `https://www.ciudadredonda.org/wp-json/wp/v2/search?search=${encodeURIComponent(phrase)}&per_page=10`;
        const hits = JSON.parse(await fetchText(api));
        const hit = hits.find(h => parseHTML(h.title).body.textContent.toLowerCase().includes(phrase.toLowerCase()));
        if(!hit) return null;
        url = hit.url;
      }
      const doc = parseHTML(await fetchText(url));
      const blocks = section(doc, new RegExp("^" + phrase, "i"));
      if(!blocks.length) return null;
      const first = blocks[0].t.length < 140 ? blocks.shift() : null;
      return {
        title: first ? first.t.replace(/[,.]$/,"") : phrase,
        link: url, img: null,
        sections: [{label: phrase, blocks}]
      };
    }
  }
];
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

/* ---------- render ---------- */
const stage = document.getElementById("stage");
const tabs = document.getElementById("tabs");
const DAYS_STEP = 7;
let curSrc = 0, curDay = 0;

function blocksToHTML(blocks){
  const wrap = document.createElement("div");
  blocks.forEach(b=>{
    const el = document.createElement(b.h ? "h4" : "p");
    el.textContent = b.t; wrap.appendChild(el);
  });
  return wrap.innerHTML;
}

function fillPill(slot, src, data){
  const pill = slot.querySelector(".pill");
  if(!data){
    pill.innerHTML = `<div class="status">No hay entrada para este día.<a class="btn" target="_blank" rel="noopener"></a></div>`;
    const a = pill.querySelector("a"); a.href = src.site; a.textContent = "Abrir " + src.name;
    return;
  }
  pill.innerHTML = `
    ${data.img ? `<div class="banner"><img alt="" loading="lazy"></div>` : ""}
    <div class="pill-body">
      <div class="meta"></div>
      <h2><a target="_blank" rel="noopener"></a></h2>
      <div class="secs"></div>
      <div class="foot"><a class="btn" target="_blank" rel="noopener">Ver en ${src.name}</a></div>
    </div>`;
  if(data.img){ const img = pill.querySelector(".banner img"); img.src = data.img; img.onerror = () => img.parentElement.remove(); }
  pill.querySelector(".meta").textContent = `${src.name} · ${longDate(dayDate(+slot.dataset.day))}`;
  const h = pill.querySelector("h2 a"); h.textContent = data.title; h.href = data.link;
  pill.querySelector(".foot a").href = data.link;
  const secs = pill.querySelector(".secs");
  data.sections.forEach(s=>{
    if(s.blocks && !s.blocks.length) return;
    if(s.label){ const l = document.createElement("div"); l.className="sec"; l.textContent = s.label; secs.appendChild(l); }
    const t = document.createElement("div"); t.className = "txt" + (s.gospel ? " gospel" : "");
    t.innerHTML = s.html ?? blocksToHTML(s.blocks);
    t.querySelectorAll("a").forEach(a=>{ a.target="_blank"; a.rel="noopener"; });
    secs.appendChild(t);
  });
}

async function loadSlot(slot){
  if(slot.dataset.loaded) return; slot.dataset.loaded = "1";
  const src = SOURCES[+slot.dataset.src], day = +slot.dataset.day;
  const key = `cd:${src.id}:${iso(dayDate(day))}`;
  let data = cacheGet(key);
  if(data === null){
    try{ data = await src.load(day); if(data) cacheSet(key, data); }
    catch(e){
      console.error(src.id, day, e);
      const pill = slot.querySelector(".pill");
      pill.innerHTML = `<div class="status">No se pudo cargar.<button class="btn">Reintentar</button></div>`;
      pill.querySelector("button").onclick = () => { delete slot.dataset.loaded; pill.innerHTML = loadingHTML; loadSlot(slot); };
      return;
    }
  }
  fillPill(slot, src, data);
}

const loadingHTML = `<div class="status"><div class="spinner"></div>Cargando…</div>`;
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) loadSlot(e.target); }),
  {root: null, rootMargin: "100% 0px"});
const tailIO = new IntersectionObserver(es => es.forEach(e => {
  if(e.isIntersecting){ tailIO.unobserve(e.target); addDays(e.target.parentElement); }
}), {rootMargin: "200% 0px"});

function addDays(col){
  const s = +col.dataset.src, start = col.children.length;
  for(let d = start; d < start + DAYS_STEP; d++){
    const slot = document.createElement("section");
    slot.className = "slot"; slot.dataset.src = s; slot.dataset.day = d;
    slot.innerHTML = `<article class="pill">${loadingHTML}</article>`;
    col.appendChild(slot); io.observe(slot);
  }
  tailIO.observe(col.lastElementChild);
}

SOURCES.forEach((src, s)=>{
  const b = document.createElement("button");
  b.className = "tab"; b.textContent = src.name; b.onclick = () => goSrc(s);
  tabs.appendChild(b);
  const col = document.createElement("div");
  col.className = "column"; col.dataset.src = s;
  stage.appendChild(col); addDays(col);
  col.addEventListener("scroll", () => {
    if(s !== curSrc) return;
    const d = Math.round(col.scrollTop / col.clientHeight);
    if(d !== curDay){ curDay = d; updateLabels(); }
  }, {passive:true});
});

const colW = () => stage.children[0].getBoundingClientRect().width;
function updateLabels(){
  [...stage.children].forEach((c,i)=>c.classList.toggle("active", i===curSrc));
  [...tabs.children].forEach((t,i)=>t.classList.toggle("active", i===curSrc));
  tabs.children[curSrc].scrollIntoView({block:"nearest", inline:"nearest"});
  document.getElementById("srcName").textContent = SOURCES[curSrc].name;
  document.getElementById("dayName").textContent = relDay(curDay);
}

// Al cambiar de fuente se mantiene el mismo día
function syncColumn(s){
  const col = stage.children[s];
  while(col.children.length <= curDay) addDays(col);
  col.scrollTo({top: curDay * col.clientHeight, behavior: "instant"});
}

stage.addEventListener("scroll", () => {
  const s = Math.round(stage.scrollLeft / colW());
  if(s !== curSrc && s >= 0 && s < SOURCES.length){
    curSrc = s; updateLabels();
    SOURCES.forEach((_, i) => { if(i !== s) syncColumn(i); });
  }
}, {passive:true});

function goSrc(s){
  s = Math.max(0, Math.min(SOURCES.length-1, s));
  syncColumn(s);
  stage.scrollTo({left: s * colW(), behavior: "smooth"});
}
function goDay(d){
  d = Math.max(0, d);
  const col = stage.children[curSrc];
  while(col.children.length <= d) addDays(col);
  col.scrollTo({top: d * col.clientHeight, behavior: "smooth"});
}

document.getElementById("prevSrc").onclick = () => goSrc(curSrc-1);
document.getElementById("nextSrc").onclick = () => goSrc(curSrc+1);
document.getElementById("prevDay").onclick = () => goDay(curDay-1);
document.getElementById("nextDay").onclick = () => goDay(curDay+1);
document.addEventListener("keydown", e => {
  if(e.key==="ArrowLeft") goSrc(curSrc-1);
  else if(e.key==="ArrowRight") goSrc(curSrc+1);
  else if(e.key==="PageDown") { e.preventDefault(); goDay(curDay+1); }
  else if(e.key==="PageUp") { e.preventDefault(); goDay(curDay-1); }
});
window.addEventListener("resize", () => { syncColumn(curSrc); stage.scrollLeft = curSrc * colW(); });

updateLabels();
setTimeout(() => document.getElementById("hint").classList.add("hide"), 4000);
</script>
</body>
</html>
