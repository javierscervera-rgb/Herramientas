<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espiritualidad digital</title>
<style>
  :root{
    --bg:#171310; --panel:#201D18; --accent:#CD8B75; --btn2:#292420;
    --text:#F0E8DC; --text2:#AA9D8F; --border:#37312B; --accent2:#D88972;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:Georgia,"Times New Roman",serif;line-height:1.65}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;
    padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
  .logo-btn{display:inline-flex;align-items:center;text-decoration:none}
  .logo{display:block;height:clamp(32px,5vw,48px);width:auto;max-width:200px}
  .head-title{font-family:system-ui,sans-serif;font-size:.95rem;color:var(--text2);margin-left:auto}
  main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
  h1{color:var(--accent2);font-size:clamp(1.6rem,4vw,2.2rem);margin:.2em 0 .1em}
  .sub{color:var(--text2);margin:0 0 20px;font-family:system-ui,sans-serif;font-size:.95rem}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;font-family:system-ui,sans-serif}
  .btn{background:var(--btn2);color:var(--text);border:1px solid var(--border);
    padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.9rem;text-decoration:none}
  .btn:hover{border-color:var(--accent)}
  .btn.active{background:var(--accent2);color:#171310;border-color:var(--accent2)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    overflow:hidden;margin-bottom:20px}
  .card img.cover{width:100%;max-height:260px;object-fit:cover;display:block}
  .card-body{padding:18px 20px 20px}
  .meta{font-family:system-ui,sans-serif;font-size:.82rem;color:var(--text2);
    text-transform:capitalize;margin-bottom:4px}
  .card h2{margin:0 0 10px;font-size:1.35rem;line-height:1.3}
  .card h2 a{color:var(--accent2);text-decoration:none}
  .card h2 a:hover{text-decoration:underline}
  .content em{color:var(--accent)}
  .content p{margin:0 0 .9em}
  .content img{max-width:100%;height:auto;border-radius:8px}
  .content.collapsed{max-height:9.5em;overflow:hidden;
    -webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
  .actions{display:flex;gap:8px;margin-top:12px;font-family:system-ui,sans-serif}
  .status{color:var(--text2);text-align:center;padding:40px 0;font-family:system-ui,sans-serif}
  footer{color:var(--text2);font-size:.8rem;text-align:center;font-family:system-ui,sans-serif}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <a class="logo-btn" href="https://javierscervera-rgb.github.io/Herramientas/index.html" target="_self" aria-label="Volver a Herramientas">
    <img class="logo" src="logo.svg" alt="Herramientas">
  </a>
  <span class="head-title">Brevísima homilía diaria</span>
</header>

<main>
  <h1>Espiritualidad digital</h1>
  <p class="sub">Últimas entradas de José-Fernando Rey Ballesteros</p>

  <div class="toolbar">
    <button class="btn active" data-n="5">5 entradas</button>
    <button class="btn" data-n="10">10 entradas</button>
    <button class="btn" data-n="20">20 entradas</button>
    <button class="btn" id="toggleAll">Expandir todo</button>
  </div>

  <div id="posts"><p class="status">Cargando entradas…</p></div>

  <footer>Contenido de <a href="https://www.espiritualidaddigital.com" target="_blank" rel="noopener">espiritualidaddigital.com</a> · cada entrada enlaza al original</footer>
</main>

<script>
const SITE = "https://www.espiritualidaddigital.com";
const PROXY = "https://api.allorigins.win/raw?url=";
const box = document.getElementById("posts");
let expandedAll = false;

const fmtDate = d => new Date(d).toLocaleDateString("es-ES",
  {weekday:"long", day:"numeric", month:"long", year:"numeric"});

// Limpia el HTML del blog: quita scripts, iframes y botones de compartir
function clean(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script,style,iframe,form,.addtoany_share_save_container,.a2a_kit,.sharedaddy")
     .forEach(el => el.remove());
  doc.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  return doc.body.innerHTML;
}

// 1) API REST de WordPress (directa)
async function fromRest(n){
  const url = `${SITE}/wp-json/wp/v2/posts?per_page=${n}&_embed=wp:featuredmedia`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("REST " + r.status);
  const data = await r.json();
  return data.map(p => ({
    title: new DOMParser().parseFromString(p.title.rendered,"text/html").body.textContent,
    link: p.link,
    date: p.date,
    html: p.content.rendered,
    img: p._embedded?.["wp:featuredmedia"]?.[0]?.media_details?.sizes?.medium_large?.source_url
         || p._embedded?.["wp:featuredmedia"]?.[0]?.source_url || null
  }));
}

// 2) Respaldo: feed RSS a través de un proxy CORS
async function fromRss(n){
  const r = await fetch(PROXY + encodeURIComponent(SITE + "/feed/"));
  if(!r.ok) throw new Error("RSS " + r.status);
  const xml = new DOMParser().parseFromString(await r.text(), "text/xml");
  return [...xml.querySelectorAll("item")].slice(0, n).map(it => {
    const full = it.getElementsByTagName("content:encoded")[0]?.textContent
              || it.querySelector("description")?.textContent || "";
    return {
      title: it.querySelector("title")?.textContent || "",
      link: it.querySelector("link")?.textContent || SITE,
      date: it.querySelector("pubDate")?.textContent,
      html: full, img: null
    };
  });
}

function render(posts){
  if(!posts.length){ box.innerHTML = '<p class="status">No hay entradas.</p>'; return; }
  box.innerHTML = "";
  posts.forEach(p => {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      ${p.img ? `<img class="cover" src="${p.img}" alt="" loading="lazy">` : ""}
      <div class="card-body">
        <div class="meta">${p.date ? fmtDate(p.date) : ""}</div>
        <h2><a href="${p.link}" target="_blank" rel="noopener"></a></h2>
        <div class="content ${expandedAll ? "" : "collapsed"}">${clean(p.html)}</div>
        <div class="actions">
          <button class="btn more">${expandedAll ? "Leer menos" : "Leer más"}</button>
          <a class="btn" href="${p.link}" target="_blank" rel="noopener">Ver en el blog</a>
        </div>
      </div>`;
    card.querySelector("h2 a").textContent = p.title;
    const content = card.querySelector(".content"), more = card.querySelector(".more");
    more.onclick = () => {
      const c = content.classList.toggle("collapsed");
      more.textContent = c ? "Leer más" : "Leer menos";
    };
    box.appendChild(card);
  });
}

async function load(n){
  box.innerHTML = '<p class="status">Cargando entradas…</p>';
  try { render(await fromRest(n)); }
  catch(e1){
    try { render(await fromRss(n)); }
    catch(e2){
      box.innerHTML = `<p class="status">No se pudieron cargar las entradas.<br>
        <a class="btn" href="${SITE}" target="_blank" rel="noopener">Abrir el blog</a></p>`;
      console.error(e1, e2);
    }
  }
}

document.querySelectorAll(".btn[data-n]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".btn[data-n]").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  load(+b.dataset.n);
});

document.getElementById("toggleAll").onclick = e => {
  expandedAll = !expandedAll;
  e.target.textContent = expandedAll ? "Contraer todo" : "Expandir todo";
  e.target.classList.toggle("active", expandedAll);
  document.querySelectorAll(".content").forEach(c => c.classList.toggle("collapsed", !expandedAll));
  document.querySelectorAll(".more").forEach(m => m.textContent = expandedAll ? "Leer menos" : "Leer más");
};

load(5);
</script>
</body>
</html>
