<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catena Aurea · Evangelio según San Mateo</title>
<link rel="icon" href="logo.svg">
<style>
:root{--bg:#171310;--card:#201D18;--accent:#CD8B75;--btn2:#292420;--text:#F0E8DC;--muted:#AA9D8F;--border:#37312B;--salmon:#D88972;--fs:19px;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px 60px}
.logo{display:block;height:clamp(32px,5vw,48px);width:auto;max-width:200px}
.top{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:18px;position:sticky;top:0;background:var(--bg);z-index:5}
.sp{flex:1}
button,select{font:inherit;font-size:15px;color:var(--text);background:var(--btn2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;cursor:pointer}
select{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.hide{display:none!important}
h1{font-family:Georgia,serif;color:var(--salmon);text-align:center;font-size:clamp(34px,7vw,50px);margin:10px 0 4px}
.sub{font-family:Georgia,serif;font-style:italic;color:var(--muted);text-align:center;font-size:20px;margin:0 0 24px}
.tabs{display:flex;background:var(--btn2);border:1px solid var(--border);border-radius:18px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font-size:17px;padding:12px 6px;border-radius:14px}
.tabs button.on{background:var(--accent);color:var(--bg)}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 16px;margin-bottom:12px;font-family:Georgia,serif;font-size:22px}
.tag{font:600 14px system-ui;color:var(--muted);background:var(--btn2);border-radius:10px;padding:8px 14px;min-width:58px;text-align:center}
.row small{margin-left:auto;font:15px system-ui;color:var(--muted)}
.goto{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;display:grid;gap:12px}
.goto select,.goto button{width:100%}.goto .go{background:var(--accent);color:var(--bg);border:0;font-weight:600}
.kick{font:15px system-ui;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:26px 0 4px}
h2{font-family:Georgia,serif;color:var(--salmon);font-size:clamp(34px,7vw,46px);margin:0 0 18px}
.vsel{width:100%;margin-bottom:22px;background:var(--card);color:var(--muted);text-align:left;padding:14px 16px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top">
    <a href="https://javierscervera-rgb.github.io/Herramientas/herramientas.html" target="_self" aria-label="Herramientas"><img class="logo" src="logo.svg" alt="Herramientas"></a>
    <span id="nav" class="hide" style="display:contents">
      <button id="bIdx">≡ Índice</button>
      <select id="sCap" aria-label="Capítulo"></select>
      <span class="sp"></span>
      <button id="aMin" aria-label="Reducir letra">A−</button><button id="aMax" aria-label="Aumentar letra">A+</button>
    </span>
  </header>

  <main id="home">
    <h1>Catena Aurea</h1>
    <p class="sub">Santo Tomás de Aquino · Evangelio según San Mateo</p>
    <div class="tabs"><button id="t1" class="on">Capítulos</button><button id="t2">Ir a…</button></div>
    <div id="list"></div>
    <div id="goto" class="goto hide">
      <select id="gCap" aria-label="Capítulo"></select>
      <select id="gSec" aria-label="Sección"></select>
      <button class="go" id="go">Ir</button>
    </div>
  </main>

  <main id="read" class="hide">
    <div class="kick">Mateo</div>
    <h2 id="title"></h2>
    <select id="sSec" class="vsel" aria-label="Ir a sección"></select>
    <div id="text"></div>
    <div class="pager"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div>
  </main>
</div>

<script type="module">
import { Catena } from './catena.js';
const $ = (i) => document.getElementById(i), P = new URLSearchParams(location.search);
let IDX, cap = 0, fs = 19;
try { fs = +localStorage.getItem('cat-fs') || 19; } catch (e) {}
const setFs = (v) => { fs = Math.max(14, Math.min(34, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); try { localStorage.setItem('cat-fs', fs); } catch (e) {} };
setFs(fs); $('aMin').onclick = () => setFs(fs - 2); $('aMax').onclick = () => setFs(fs + 2);
const opt = (v, t) => Object.assign(document.createElement('option'), { value: v, textContent: t });
const capName = (n) => `Capítulo ${n}`;

async function boot() {
  IDX = await Catena.index();
  // Modo embebido: ?ref=5.3-12#... → solo el fragmento, sin navegación
  if (P.has('ref')) { document.body.innerHTML = '<div id="e" style="padding:12px"></div>'; document.body.style.background = P.get('bg') || 'transparent'; Catena.render(document.getElementById('e'), P.get('ref'), { ids: false, verse: P.get('verse') !== '0', notes: P.get('notes') !== '0' }); return; }
  $('list').replaceChildren(...IDX.chapters.map(c => { const b = document.createElement('button'); b.className = 'row'; b.innerHTML = `<span class="tag">CAP ${c.n}</span><span>${capName(c.n)}</span><small>${c.sections.length} sec. ▾</small>`; b.onclick = () => (location.hash = c.n); return b; }));
  for (const s of [$('sCap'), $('gCap')]) s.replaceChildren(...IDX.chapters.map(c => opt(c.n, 'Cap. ' + c.n)));
  $('t1').onclick = () => tab(1); $('t2').onclick = () => tab(2);
  $('gCap').onchange = () => fillSec($('gSec'), +$('gCap').value, 'Sección…'); fillSec($('gSec'), 1, 'Sección…');
  $('go').onclick = () => (location.hash = $('gCap').value + ($('gSec').value ? '.' + $('gSec').value : ''));
  $('bIdx').onclick = () => (location.hash = ''); $('sCap').onchange = () => (location.hash = $('sCap').value);
  $('prev').onclick = () => (location.hash = cap - 1); $('next').onclick = () => (location.hash = cap + 1);
  $('sSec').onchange = () => { const e = document.getElementById('s-' + cap + '_' + $('sSec').value.replace(/[^\w-]/g, '_')); e?.scrollIntoView({ behavior: 'smooth', block: 'start' }); $('sSec').selectedIndex = 0; };
  addEventListener('hashchange', route); route();
}
const tab = (n) => { $('t1').classList.toggle('on', n == 1); $('t2').classList.toggle('on', n == 2); $('list').classList.toggle('hide', n != 1); $('goto').classList.toggle('hide', n != 2); };
function fillSec(sel, n, first) { const c = IDX.chapters.find(c => c.n == n); sel.replaceChildren(opt('', first), ...c.sections.map(s => opt(s.ref, s.label))); }

async function route() {
  const m = location.hash.slice(1).match(/^(\d+)(?:\.(.+))?$/), home = !m || +m[1] < 1 || +m[1] > 28;
  $('home').classList.toggle('hide', !home); $('read').classList.toggle('hide', home); $('nav').classList.toggle('hide', home);
  $('nav').style.display = home ? 'none' : 'contents';
  if (home) { document.title = 'Catena Aurea · Evangelio según San Mateo'; return; }
  const n = +m[1];
  if (n !== cap) {
    cap = n; $('sCap').value = n; $('title').textContent = capName(n); document.title = `Mateo ${n} · Catena Aurea`;
    const c = IDX.chapters.find(c => c.n == n);
    $('sSec').replaceChildren(opt('', `Ir a sección (${c.sections.length})`), ...c.sections.map(s => opt(s.ref, s.label)));
    $('prev').classList.toggle('hide', n == 1); $('next').classList.toggle('hide', n == 28);
    await Catena.render($('text'), String(n), { ids: true }); scrollTo(0, 0);
  }
  if (m[2]) document.getElementById('s-' + n + '_' + m[2].replace(/[^\w-]/g, '_'))?.scrollIntoView({ block: 'start' });
}
boot();
</script>
</body>
</html>
