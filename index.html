<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calendario Litúrgico Pastoral 2025-2026</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <style>
    :root {
      --bg: #171310;
      --card: #201D18;
      --accent: #CD8B75;
      --accent-alt: #D88972;
      --btn2: #292420;
      --text: #F0E8DC;
      --muted: #AA9D8F;
      --border: #37312B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    .topbar {
      background: var(--card); border-bottom: 1px solid var(--border);
      color: var(--text); padding: 0.55rem 0.9rem;
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.2); flex-shrink: 0;
    }
    .topbar h1 { flex: 1; min-width: 0; color: var(--accent-alt); font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logo { display: block; height: clamp(32px, 5vw, 48px); width: auto; max-width: 200px; }
    .logo-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .logo-link { display: flex; align-items: center; flex-shrink: 0; border-radius: 8px; }
    .topbar .date-label { font-size: 0.82rem; opacity: .92; font-weight: 500; }

    #viewer {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      overflow: auto; padding: 0.4rem 0.2rem 5.2rem; -webkit-overflow-scrolling: touch;
    }
    .page-wrap {
      width: 100%; max-width: 920px; background: var(--card);
      border-radius: 10px; border: 1px solid var(--border); box-shadow: 0 4px 18px rgba(0,0,0,.4); overflow: hidden; margin-bottom: 0.6rem;
    }
    .page-wrap canvas { display: block; width: 100% !important; height: auto !important; }
    .status { padding: 3rem 1rem; text-align: center; color: var(--muted); font-size: 1rem; }
    .status.error { color: var(--accent-alt); }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(32,29,24,.97); backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.45rem 0.6rem; gap: 0.35rem; z-index: 100;
      box-shadow: 0 -2px 12px rgba(0,0,0,.4);
    }
    .nav-btn {
      width: 46px; height: 46px; border-radius: 50%; border: none;
      background: var(--btn2); color: var(--text); border: 1px solid var(--border); font-size: 1.35rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .12s, background .15s; flex-shrink: 0;
    }
    .nav-btn:active { transform: scale(0.9); }
    .nav-btn:disabled { background: var(--btn2); cursor: default; opacity: .35; }
    .nav-btn.calendar { background: var(--accent-alt); color: #171310; border-color: var(--accent-alt); width: 50px; height: 50px; font-size: 1.4rem; }
    .nav-btn.bible  { background: var(--accent-alt); color: #171310; border-color: var(--accent-alt); width: 50px; height: 50px; font-size: 1.25rem; }
    .page-info { flex: 1; text-align: center; font-size: 0.8rem; color: var(--muted); line-height: 1.25; }
    .page-info strong { color: var(--accent-alt); font-size: 0.9rem; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.48);
      display: none; align-items: flex-end; justify-content: center; z-index: 200;
      padding: 0;
    }
    @media (min-width: 520px) {
      .modal-overlay { align-items: center; padding: 1rem; }
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 1.1rem 1.15rem 1.4rem;
      width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 -8px 30px rgba(0,0,0,.5);
    }
    @media (min-width: 520px) { .modal { border-radius: 14px; } }
    .modal h2 { font-size: 1.05rem; margin-bottom: 0.7rem; color: var(--accent-alt); }
    .modal input[type="date"] {
      width: 100%; padding: 0.65rem; font-size: 1.05rem;
      border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.9rem;
      background: var(--btn2); color: var(--text); color-scheme: dark;
    }
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .modal-actions button {
      flex: 1; padding: 0.6rem; border: none; border-radius: 8px;
      font-size: 0.95rem; cursor: pointer;
    }
    .btn-go { background: var(--accent-alt); color: #171310; font-weight: 600; }
    .btn-cancel { background: var(--btn2); color: var(--text); border: 1px solid var(--border) !important; }

    .ref-list { list-style: none; margin: 0.4rem 0 0.8rem; }
    .ref-list li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--border); gap: 0.5rem;
    }
    .ref-list li:last-child { border-bottom: none; }
    .ref-list .ref-text { font-size: 0.95rem; font-weight: 500; color: var(--text); }
    .ref-list a {
      flex-shrink: 0; background: var(--accent-alt); color: #171310; text-decoration: none;
      padding: 0.35rem 0.7rem; border-radius: 6px; font-size: 0.82rem;
    }
    .no-refs { color: var(--muted); font-size: 0.92rem; padding: 0.8rem 0; text-align: center; }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.6rem; line-height: 1.35; }

        /* Full-screen Bible text reader */
    .bible-reader {
      position: fixed; inset: 0; background: rgba(0,0,0,.72);
      display: none; flex-direction: column; z-index: 300;
      padding: 0.5rem;
    }
    .bible-reader.open { display: flex; }
    .bible-reader-box {
      background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px;
      display: flex; flex-direction: column;
      flex: 1; max-width: 720px; width: 100%; margin: 0 auto;
      overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.3);
    }
    .bible-reader-header {
      background: var(--btn2); color: var(--accent-alt); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.65rem 0.9rem; flex-shrink: 0; gap: 0.5rem;
    }
    .bible-reader-header h3 {
      font-size: 1rem; font-weight: 600; margin: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    .bible-reader-close {
      background: var(--border); border: none; color: var(--text);
      width: 36px; height: 36px; border-radius: 50%; font-size: 1.35rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .bible-reader-close:active { background: rgba(255,255,255,.35); }
    .bible-reader-body {
      flex: 1; overflow-y: auto; padding: 1.1rem 1.2rem 1.4rem;
      -webkit-overflow-scrolling: touch; line-height: 1.65; font-size: 1.05rem;
      color: var(--text);
    }
    .bible-reader-body .verse {
      margin-bottom: 0.7rem;
    }
    .bible-reader-body .verse-num {
      font-weight: 700; color: var(--accent-alt); margin-right: 0.35rem;
      font-size: 0.9rem;
    }
    .bible-reader-body .loading {
      text-align: center; color: var(--muted); padding: 2.5rem 1rem;
    }
    .bible-reader-body .error {
      text-align: center; color: var(--accent-alt); padding: 1.5rem 1rem;
    }
    .bible-reader-footer {
      border-top: 1px solid var(--border); padding: 0.7rem 1rem;
      text-align: center; flex-shrink: 0; background: var(--btn2);
    }
    .bible-reader-footer a {
      color: var(--accent-alt); font-size: 0.9rem; text-decoration: none;
      font-weight: 500;
    }
    .bible-reader-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="logo-link" href="https://javierscervera-rgb.github.io/Herramientas/herramientas.html" target="_self" title="Herramientas" aria-label="Ir a Herramientas">
      <img class="logo" src="logo.svg" alt="Herramientas">
    </a>
    <h1>Calendario Litúrgico 2025-2026</h1>
    <div class="date-label" id="currentDateLabel">—</div>
  </div>

  <div id="viewer">
    <div class="status" id="status">Cargando…</div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" id="btnPrev" title="Día / página anterior" disabled>‹</button>
    <div class="page-info" id="pageInfo">—</div>
    <button class="nav-btn bible" id="btnBible" title="Lecturas bíblicas">📖</button>
    <button class="nav-btn calendar" id="btnCalendar" title="Buscar fecha">📅</button>
    <button class="nav-btn" id="btnNext" title="Día / página siguiente" disabled>›</button>
  </div>

  <div class="modal-overlay" id="dateModal">
    <div class="modal">
      <h2>Ir a una fecha</h2>
      <input type="date" id="dateInput" min="2025-11-29" max="2026-12-31">
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancelDate">Cancelar</button>
        <button class="btn-go" id="btnGoDate">Ir</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="bibleModal">
    <div class="modal">
      <h2>📖 Lecturas de la Misa</h2>
      <div id="bibleContent">
        <div class="no-refs">Buscando citas en la página…</div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCloseBible" style="flex:1">Cerrar</button>
      </div>
      <p class="hint">Las lecturas se abren en la <em>Biblia de Jerusalén</em>. Si alguna cita no se reconoce, búscala manualmente allí.</p>
    </div>
  </div>

  <!-- Full-screen Bible text reader -->
  <div class="bible-reader" id="bibleReader">
    <div class="bible-reader-box">
      <div class="bible-reader-header">
        <h3 id="bibleReaderTitle">Lectura</h3>
        <button class="bible-reader-close" id="btnCloseReader" title="Cerrar">×</button>
      </div>
      <div class="bible-reader-body" id="bibleReaderBody">
        <div class="loading">Cargando texto…</div>
      </div>
      <div class="bible-reader-footer">
        <a id="bibleExternalLink" href="https://javierscervera-rgb.github.io/Herramientas/Biblia.html" target="_blank" rel="noopener">
          Abrir en Biblia Interactiva ↗
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    const { pdfjsLib } = globalThis;
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const PDF_URL = './Calendario-Liturgico-CEE-2026.pdf';
    const BIBLIA_BASE = 'https://javierscervera-rgb.github.io/Herramientas/Biblia.html';

    const BOOK_MAP = {
      'gn':'GN','gén':'GN','genesis':'GN','génesis':'GN',
      'ex':'EX','éx':'EX','exodo':'EX','éxodo':'EX',
      'lv':'LV','lev':'LV','levítico':'LV','levitico':'LV',
      'nm':'NM','núm':'NM','num':'NM','números':'NM','numeros':'NM',
      'dt':'DT','deut':'DT','deuteronomio':'DT',
      'jos':'JOS','josué':'JOS','josue':'JOS',
      'jue':'JC','jc':'JC','jueces':'JC',
      'rut':'RT','rt':'RT',
      '1s':'1S','1sam':'1S','1samuel':'1S',
      '2s':'2S','2sam':'2S','2samuel':'2S',
      '1r':'1R','1re':'1R','1reyes':'1R',
      '2r':'2R','2re':'2R','2reyes':'2R',
      '1cr':'1CRO','1crón':'1CRO','1cron':'1CRO','1crónicas':'1CRO',
      '2cr':'2CRO','2crón':'2CRO','2cron':'2CRO',
      'esd':'ESD','esdras':'ESD',
      'ne':'NE','neh':'NE','nehemías':'NE','nehemias':'NE',
      'tob':'TB','tb':'TB','tobías':'TB','tobias':'TB',
      'jdt':'JDT','judit':'JDT',
      'est':'EST','ester':'EST',
      '1m':'1M','1mac':'1M','1macabeos':'1M',
      '2m':'2M','2mac':'2M','2macabeos':'2M',
      'job':'JB','jb':'JB',
      'sal':'SAL','salmo':'SAL','salmos':'SAL',
      'prov':'PR','pr':'PR','proverbios':'PR',
      'ecl':'QO','qo':'QO','eclesiastés':'QO','eclesiastes':'QO',
      'cant':'CT','ct':'CT','cantar':'CT',
      'sab':'SB','sb':'SB','sabiduría':'SB','sabiduria':'SB',
      'eclo':'SI','si':'SI','eclo':'SI','eclesiástico':'SI','eclesiastico':'SI',
      'is':'IS','is.':'IS','isaías':'IS','isaias':'IS',
      'jer':'JR','jr':'JR','jeremías':'JR','jeremias':'JR',
      'lam':'LM','lm':'LM','lamentaciones':'LM',
      'bar':'BA','ba':'BA','baruc':'BA',
      'ez':'EZ','ezeq':'EZ','ezequiel':'EZ',
      'dan':'DN','dn':'DN','daniel':'DN',
      'os':'OS','oseas':'OS',
      'jl':'JL','joel':'JL',
      'am':'AM','amós':'AM','amos':'AM',
      'abd':'AB','ab':'AB','abdías':'AB',
      'jon':'JON','jonás':'JON','jonas':'JON',
      'miq':'MI','mi':'MI','miqueas':'MI',
      'nah':'NA','na':'NA','nahúm':'NA','nahum':'NA',
      'hab':'HA','ha':'HA','habacuc':'HA',
      'sof':'SO','so':'SO','sofonías':'SO',
      'ag':'AG','ageo':'AG','hageo':'AG',
      'zac':'ZA','za':'ZA','zacarías':'ZA',
      'mal':'ML','ml':'ML','malaquías':'ML',
      'mt':'MT','mateo':'MT',
      'mc':'MC','marcos':'MC',
      'lc':'LC','lucas':'LC',
      'jn':'JN','juan':'JN',
      'hch':'HCH','hechos':'HCH',
      'rom':'RM','rm':'RM','romanos':'RM',
      '1cor':'1CO','1co':'1CO','1corintios':'1CO',
      '2cor':'2CO','2co':'2CO','2corintios':'2CO',
      'gal':'GA','ga':'GA','gál':'GA','gálatas':'GA','galatas':'GA',
      'ef':'EF','efesios':'EF',
      'flp':'FLP','fil':'FLP','filipenses':'FLP',
      'col':'COL','colosenses':'COL',
      '1tes':'1TS','1ts':'1TS','1tesalonicenses':'1TS',
      '2tes':'2TS','2ts':'2TS',
      '1tim':'1TM','1tm':'1TM','1timoteo':'1TM',
      '2tim':'2TM','2tm':'2TM',
      'tit':'TT','tt':'TT','tito':'TT',
      'flm':'FLM','filemón':'FLM','filemon':'FLM',
      'heb':'HB','hb':'HB','hebreos':'HB',
      'sant':'ST','st':'ST','santiago':'ST',
      '1pe':'1P','1p':'1P','1pedro':'1P',
      '2pe':'2P','2p':'2P','2pedro':'2P',
      '1jn':'1JN','1juan':'1JN',
      '2jn':'2JN','2juan':'2JN',
      '3jn':'3JN','3juan':'3JN',
      'jds':'JDS','judas':'JDS',
      'ap':'AP','apoc':'AP','apocalipsis':'AP'
    };

    let dateMap = {};
    let pdfDoc = null;
    let currentDate = null;
    let currentPages = [];
    let currentPageIdx = 0;
    let lastExtractedText = '';

    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');
    const pageInfo = document.getElementById('pageInfo');
    const currentDateLabel = document.getElementById('currentDateLabel');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnCalendar = document.getElementById('btnCalendar');
    const btnBible = document.getElementById('btnBible');
    const dateModal = document.getElementById('dateModal');
    const bibleModal = document.getElementById('bibleModal');
    const dateInput = document.getElementById('dateInput');
    const bibleContent = document.getElementById('bibleContent');

    async function init() {
      try {
        const res = await fetch('./date_to_page.json');
        dateMap = await res.json();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Error cargando mapa de fechas';
        return;
      }
      try {
        status.textContent = 'Cargando PDF…';
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
      } catch (e) {
        status.className = 'status error';
        status.innerHTML = 'No se pudo cargar el PDF.<br>' + e.message;
        return;
      }
      const today = new Date();
      const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
      if (dateMap[todayStr]) await goToDate(todayStr);
      else await goToDate('2025-11-30');
    }

    async function renderPage(pageNum) {
      const page = await pdfDoc.getPage(pageNum);
      const scale = Math.min(2.0, (window.innerWidth - 12) / page.getViewport({ scale: 1 }).width * 1.75);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      await page.render({ canvasContext: ctx, viewport }).promise;
      try {
        const tc = await page.getTextContent();
        lastExtractedText = tc.items.map(i => i.str).join(' ');
      } catch (_) { lastExtractedText = ''; }
      return canvas;
    }

    async function showCurrent() {
      if (!currentPages.length) return;
      const pageNum = currentPages[currentPageIdx];
      viewer.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      const loading = document.createElement('div');
      loading.className = 'status';
      loading.textContent = 'Renderizando p. ' + pageNum + '…';
      wrap.appendChild(loading);
      viewer.appendChild(wrap);
      try {
        const canvas = await renderPage(pageNum);
        wrap.innerHTML = '';
        wrap.appendChild(canvas);
      } catch (e) {
        loading.className = 'status error';
        loading.textContent = 'Error: ' + e.message;
      }
      currentDateLabel.textContent = formatDate(currentDate);
      // Otros días cuyo texto también está en esta misma página del PDF
      const months = ['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      const others = Object.keys(dateMap).sort()
        .filter(k => k !== currentDate && dateMap[k].includes(pageNum))
        .map(k => parseInt(k.slice(8)) + ' ' + months[parseInt(k.slice(5, 7))]);
      pageInfo.innerHTML = '<strong>' + currentDate + '</strong><br>Pág. ' + pageNum +
        (currentPages.length > 1 ? ' (' + (currentPageIdx+1) + '/' + currentPages.length + ')' : '') +
        (others.length ? '<br><span style="font-size:.72rem">También en esta página: ' + others.join(', ') + '</span>' : '');
      const keys = Object.keys(dateMap).sort();
      const idx = keys.indexOf(currentDate);
      btnPrev.disabled = idx <= 0 && currentPageIdx <= 0;
      btnNext.disabled = idx >= keys.length - 1 && currentPageIdx >= currentPages.length - 1;
    }

    function formatDate(iso) {
      const p = iso.split('-');
      const months = ['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      return parseInt(p[2]) + ' ' + months[parseInt(p[1])] + ' ' + p[0];
    }

    // atEnd = true cuando se llega retrocediendo: se aterriza en la última página de ese día
    async function goToDate(dateStr, atEnd) {
      const pages = dateMap[dateStr];
      if (!pages || !pages.length) { alert('No hay página para ' + dateStr); return; }
      currentDate = dateStr;
      currentPages = pages;
      currentPageIdx = atEnd ? pages.length - 1 : 0;
      await showCurrent();
    }

    function extractRefs(text) {
      if (!text) return [];
      const re = /\b((?:1|2|3)?\s*[A-Za-záéíóúÁÉÍÓÚñÑ.]{1,8})\s+(\d{1,3})(?:\s*[,:]\s*(\d{1,3}[a-z]?)(?:\s*[-–]\s*(\d{1,3}[a-z]?))?)?/gi;
      const found = [];
      const seen = new Set();
      let m;
      while ((m = re.exec(text)) !== null) {
        let bookRaw = m[1].replace(/\./g, '').trim().toLowerCase().replace(/\s+/g, '');
        if (bookRaw === '1cor' || bookRaw === '1co') bookRaw = '1cor';
        if (bookRaw === '2cor' || bookRaw === '2co') bookRaw = '2cor';
        if (bookRaw === 'salmo' || bookRaw === 'salmos') bookRaw = 'sal';
        if (bookRaw === 'romanos') bookRaw = 'rom';
        if (bookRaw === 'gálatas' || bookRaw === 'galatas') bookRaw = 'gal';
        const bookId = BOOK_MAP[bookRaw];
        if (!bookId) continue;
        const chap = m[2];
        let from = m[3] ? m[3].replace(/[a-z]/g, '') : null;
        let to   = m[4] ? m[4].replace(/[a-z]/g, '') : from;
        let display = bookRaw.toUpperCase();
        if (display === '1COR') display = '1 Cor';
        if (display === '2COR') display = '2 Cor';
        display += ' ' + chap;
        if (from) display += ',' + from + (to && to !== from ? '-' + to : '');
        const key = bookId + '|' + chap + '|' + (from||'') + '|' + (to||'');
        if (seen.has(key)) continue;
        seen.add(key);
        let url = BIBLIA_BASE + '#/' + bookId + '/' + chap;
        if (from) url += '/' + from;
        found.push({ display, url });
      }
      return found;
    }

    btnPrev.addEventListener('click', async () => {
      if (currentPageIdx > 0) { currentPageIdx--; await showCurrent(); return; }
      const keys = Object.keys(dateMap).sort();
      const idx = keys.indexOf(currentDate);
      if (idx > 0) await goToDate(keys[idx - 1], true);
    });
    btnNext.addEventListener('click', async () => {
      if (currentPageIdx < currentPages.length - 1) { currentPageIdx++; await showCurrent(); return; }
      const keys = Object.keys(dateMap).sort();
      const idx = keys.indexOf(currentDate);
      if (idx < keys.length - 1) await goToDate(keys[idx + 1]);
    });

    btnCalendar.addEventListener('click', () => {
      dateInput.value = currentDate || '2025-11-30';
      dateModal.classList.add('open');
    });
    document.getElementById('btnCancelDate').addEventListener('click', () => dateModal.classList.remove('open'));
    document.getElementById('btnGoDate').addEventListener('click', async () => {
      const v = dateInput.value;
      dateModal.classList.remove('open');
      if (v) await goToDate(v);
    });
    dateModal.addEventListener('click', e => { if (e.target === dateModal) dateModal.classList.remove('open'); });

    // Full-screen pure-text Bible reader
    const bibleReader = document.getElementById('bibleReader');
    const bibleReaderTitle = document.getElementById('bibleReaderTitle');
    const bibleReaderBody = document.getElementById('bibleReaderBody');
    const bibleExternalLink = document.getElementById('bibleExternalLink');

    // Hidden iframe used only to call Biblia.getPassage (same-origin when possible)
    let bibliaFrame = null;
    function ensureBibliaFrame() {
      if (bibliaFrame) return bibliaFrame;
      bibliaFrame = document.createElement('iframe');
      bibliaFrame.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
      bibliaFrame.src = 'https://javierscervera-rgb.github.io/Herramientas/Biblia.html';
      document.body.appendChild(bibliaFrame);
      return bibliaFrame;
    }

    async function fetchPassage(refDisplay) {
      // Try via hidden iframe (works when same-origin or relaxed)
      try {
        const frame = ensureBibliaFrame();
        // Wait a bit for load if needed
        for (let i = 0; i < 30; i++) {
          if (frame.contentWindow && frame.contentWindow.Biblia) break;
          await new Promise(r => setTimeout(r, 150));
        }
        if (frame.contentWindow && frame.contentWindow.Biblia) {
          const p = frame.contentWindow.Biblia.getPassage(refDisplay);
          if (p) return p;
        }
      } catch (e) { /* cross-origin or not ready */ }

      // Fallback: return null so UI shows link
      return null;
    }

    async function openReader(url, title) {
      bibleReaderTitle.textContent = title || 'Lectura';
      bibleReaderBody.innerHTML = '<div class="loading">Cargando texto…</div>';
      bibleExternalLink.href = url;
      bibleReader.classList.add('open');
      bibleModal.classList.remove('open');

      const passage = await fetchPassage(title);
      if (passage && passage.verses && passage.verses.length) {
        let html = '';
        for (const v of passage.verses) {
          html += '<div class="verse"><span class="verse-num">' + (v.label || v.n) + '</span>' +
                  (v.text || '') + '</div>';
        }
        bibleReaderBody.innerHTML = html;
      } else if (passage && passage.text) {
        bibleReaderBody.innerHTML = '<div class="verse">' + passage.text + '</div>';
      } else {
        bibleReaderBody.innerHTML =
          '<div class="error">No se pudo cargar el texto aquí.<br>' +
          'Pulsa el enlace de abajo para verlo en la Biblia Interactiva.</div>';
      }
    }

    document.getElementById('btnCloseReader').addEventListener('click', () => {
      bibleReader.classList.remove('open');
      bibleReaderBody.innerHTML = '';
    });
    // Close when clicking the dark backdrop
    bibleReader.addEventListener('click', e => {
      if (e.target === bibleReader) {
        bibleReader.classList.remove('open');
        bibleReaderBody.innerHTML = '';
      }
    });

    btnBible.addEventListener('click', () => {
      const refs = extractRefs(lastExtractedText);
      if (!refs.length) {
        bibleContent.innerHTML = '<div class="no-refs">No se detectaron citas bíblicas en esta página.<br>Prueba a pasar a la página anterior o siguiente del mismo día.</div>';
      } else {
        let html = '<ul class="ref-list">';
        for (const r of refs) {
          // Use button-like <a> that calls openReader instead of target=_blank
          html += '<li><span class="ref-text">' + r.display + '</span>' +
                  '<a href="#" data-url="' + r.url + '" data-title="' + r.display + '" class="open-reader">Leer</a></li>';
        }
        html += '</ul>';
        bibleContent.innerHTML = html;

        // Attach click handlers
        bibleContent.querySelectorAll('.open-reader').forEach(a => {
          a.addEventListener('click', ev => {
            ev.preventDefault();
            openReader(a.dataset.url, a.dataset.title);
          });
        });
      }
      bibleModal.classList.add('open');
    });
    document.getElementById('btnCloseBible').addEventListener('click', () => bibleModal.classList.remove('open'));
    bibleModal.addEventListener('click', e => { if (e.target === bibleModal) bibleModal.classList.remove('open'); });

    let touchStartX = 0;
    viewer.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    viewer.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(dx) > 70) (dx < 0 ? btnNext : btnPrev).click();
    }, { passive: true });

    init();
  </script>
</body>
</html>
