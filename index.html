<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calendario Litúrgico Pastoral 2025-2026</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <style>
    :root {
      --bg: #171310;
      --card: #201D18;
      --accent: #CD8B75;
      --accent-alt: #D88972;
      --btn2: #292420;
      --text: #F0E8DC;
      --muted: #AA9D8F;
      --border: #37312B;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    :root { --nav-h: 66px; }

    .logo { display: block; height: clamp(32px, 5vw, 48px); width: auto; max-width: 200px; }
    .logo-link { display: flex; align-items: center; flex-shrink: 0; border-radius: 8px; }
    .logo-link:focus-visible { outline: 2px solid var(--accent-alt); outline-offset: 3px; }

    .topbar {
      background: var(--card); color: var(--text);
      padding: 0.55rem 0.9rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 0.75rem;
      flex-shrink: 0;
    }
    .topbar h1 { flex: 1; min-width: 0; font-size: 0.95rem; font-weight: 600; color: var(--accent-alt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .date-label { font-size: 0.82rem; color: var(--muted); font-weight: 500; white-space: nowrap; }

    /* ---- Visor con zoom ---- */
    .viewer-area { flex: 1; position: relative; min-height: 0; }
    #viewer {
      position: absolute; inset: 0; overflow: auto;
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
      touch-action: pan-x pan-y; /* el pellizco lo gestionamos nosotros */
    }
    #viewer.can-pan { cursor: grab; }
    #viewer.dragging { cursor: grabbing; user-select: none; }
    .stage {
      display: flex; width: max-content; min-width: 100%; min-height: 100%;
      padding: 12px;
    }
    .page-wrap {
      margin: auto; flex-shrink: 0; background: var(--card);
      border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,.35);
    }
    .page-wrap canvas { display: block; transition: opacity .15s; }
    .page-wrap.loading canvas { opacity: .5; }
    .status { padding: 3rem 1rem; min-width: 260px; text-align: center; color: var(--muted); font-size: 1rem; }
    .status.error { color: var(--accent-alt); }

    .zoom-ctl {
      display: flex; align-items: center; gap: 2px; flex-shrink: 0;
      background: var(--btn2); border: 1px solid var(--border); border-radius: 999px; padding: 2px;
    }
    .zoom-ctl button {
      height: 32px; min-width: 32px; padding: 0 .45rem; border: 0; border-radius: 999px;
      background: transparent; color: var(--text); font-size: 1.05rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .zoom-ctl button:hover { background: var(--border); }
    .zoom-ctl .zoom-pct { font-size: .78rem; min-width: 3.3rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .zoom-ctl .crop[aria-pressed="true"] { background: var(--accent); color: var(--bg); }

    /* Móvil: ajustar al ancho, controles flotantes y sin bordes */
    @media (max-width: 699px), (max-height: 499px) and (pointer: coarse) {
      .stage { padding: 4px 4px 60px; }
      .page-wrap { border: none; border-radius: 3px; }
      .zoom-ctl {
        position: fixed; right: 10px; z-index: 90;
        bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));
        background: rgba(41,36,32,.92); box-shadow: 0 4px 16px rgba(0,0,0,.45);
      }
      .zoom-ctl .zin, .zoom-ctl .zout { display: none; }
    }

    .bottom-nav {
      flex-shrink: 0; min-height: var(--nav-h);
      background: rgba(32,29,24,.97);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.45rem 0.6rem calc(0.45rem + env(safe-area-inset-bottom)); gap: 0.35rem; z-index: 100;
    }
    .nav-btn {
      width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--btn2); color: var(--text); font-size: 1.35rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .12s, background .15s; flex-shrink: 0;
    }
    .nav-btn:active { transform: scale(0.9); }
    .nav-btn:disabled { background: var(--bg); color: var(--border); cursor: default; }
    .nav-btn.calendar, .nav-btn.bible {
      background: var(--accent); border-color: var(--accent); color: var(--bg);
      width: 50px; height: 50px; font-size: 1.3rem;
    }
    .page-info { flex: 1; text-align: center; font-size: 0.8rem; color: var(--muted); line-height: 1.25; }
    .page-info strong { color: var(--accent-alt); font-size: 0.9rem; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: none; align-items: flex-end; justify-content: center; z-index: 200;
      padding: 0;
    }
    @media (min-width: 520px) {
      .modal-overlay { align-items: center; padding: 1rem; }
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 16px 16px 0 0; padding: 1.1rem 1.15rem 1.4rem;
      width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 -8px 30px rgba(0,0,0,.5);
    }
    @media (min-width: 520px) { .modal { border-radius: 14px; } }
    .modal h2 { font-size: 1.05rem; margin-bottom: 0.7rem; color: var(--accent-alt); }
    .modal input[type="date"] {
      width: 100%; padding: 0.65rem; font-size: 1.05rem;
      background: var(--btn2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.9rem;
    }
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .modal-actions button {
      flex: 1; padding: 0.6rem; border-radius: 8px;
      font-size: 0.95rem; cursor: pointer;
    }
    .btn-go { background: var(--accent-alt); color: var(--bg); border: 1px solid var(--accent-alt); font-weight: 600; }
    .btn-cancel { background: var(--btn2); color: var(--text); border: 1px solid var(--border); }

    .ref-list { list-style: none; margin: 0.4rem 0 0.8rem; }
    .ref-list li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--border); gap: 0.5rem;
    }
    .ref-list li:last-child { border-bottom: none; }
    .ref-list .ref-text { font-size: 0.95rem; font-weight: 500; color: var(--text); }
    .ref-list a {
      flex-shrink: 0; background: var(--accent); color: var(--bg); text-decoration: none;
      padding: 0.35rem 0.7rem; border-radius: 6px; font-size: 0.82rem; font-weight: 600;
    }
    .no-refs { color: var(--muted); font-size: 0.92rem; padding: 0.8rem 0; text-align: center; }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.6rem; line-height: 1.35; }

    /* Full-screen Bible text reader */
    .bible-reader {
      position: fixed; inset: 0; background: rgba(0,0,0,.78);
      display: none; flex-direction: column; z-index: 300;
      padding: 0.5rem;
    }
    .bible-reader.open { display: flex; }
    .bible-reader-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      display: flex; flex-direction: column;
      flex: 1; max-width: 720px; width: 100%; margin: 0 auto;
      overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.5);
    }
    .bible-reader-header {
      background: var(--btn2); color: var(--text); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.65rem 0.9rem; flex-shrink: 0; gap: 0.5rem;
    }
    .bible-reader-header h3 {
      font-size: 1rem; font-weight: 600; margin: 0; color: var(--accent-alt);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    .bible-reader-close {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      width: 36px; height: 36px; border-radius: 50%; font-size: 1.35rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .bible-reader-close:active { background: var(--border); }
    .bible-reader-body {
      flex: 1; overflow-y: auto; padding: 1.1rem 1.2rem 1.4rem;
      -webkit-overflow-scrolling: touch; line-height: 1.65; font-size: 1.05rem;
      color: var(--text);
    }
    .bible-reader-body .verse { margin-bottom: 0.7rem; }
    .bible-reader-body .verse-num {
      font-weight: 700; color: var(--accent-alt); margin-right: 0.35rem;
      font-size: 0.9rem;
    }
    .bible-reader-body .loading { text-align: center; color: var(--muted); padding: 2.5rem 1rem; }
    .bible-reader-body .error { text-align: center; color: var(--accent-alt); padding: 1.5rem 1rem; }
    .bible-reader-footer {
      border-top: 1px solid var(--border); padding: 0.7rem 1rem;
      text-align: center; flex-shrink: 0; background: var(--card);
    }
    .bible-reader-footer a {
      color: var(--accent); font-size: 0.9rem; text-decoration: none; font-weight: 500;
    }
    .bible-reader-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="logo-link" href="https://javierscervera-rgb.github.io/Herramientas/herramientas.html" target="_self" aria-label="Ir a Herramientas" title="Herramientas">

          Abrir en Biblia Interactiva ↗
        </a>

  <script type="module">
    const { pdfjsLib } = globalThis;
    pdfjsLib.GlobalWorkerOptions.workerSrc =

    const PDF_URL = './Calendario-Liturgico-CEE-2026.pdf';
    const BIBLIA_BASE = 'https://javierscervera-rgb.github.io/Herramientas/Biblia.html';

    const BOOK_MAP = {
      'gn':'GN','gén':'GN','genesis':'GN','génesis':'GN',
      'ex':'EX','éx':'EX','exodo':'EX','éxodo':'EX',

      'rut':'RT','rt':'RT',
      '1s':'1S','1sam':'1S','1samuel':'1S',

      '1r':'1R','1re':'1R','1reyes':'1R',
      '2r':'2R','2re':'2R','2reyes':'2R',
      '1cr':'1CRO','1crón':'1CRO','1cron':'1CRO','1crónicas':'1CRO',
      '2cr':'2CRO','2crón':'2CRO','2cron':'2CRO',
      'esd':'ESD','esdras':'ESD',
      'ne':'NE','neh':'NE','nehemías':'NE','nehemias':'NE',
      'tob':'TB','tb':'TB','tobías':'TB','tobias':'TB',
      'jdt':'JDT','judit':'JDT',
      'est':'EST','ester':'EST',
      '1m':'1M','1mac':'1M','1macabeos':'1M',

      'job':'JB','jb':'JB',
      'sal':'SAL','salmo':'SAL','salmos':'SAL',
      'prov':'PR','pr':'PR','proverbios':'PR',
      'ecl':'QO','qo':'QO','eclesiastés':'QO','eclesiastes':'QO',
      'cant':'CT','ct':'CT','cantar':'CT',
      'sab':'SB','sb':'SB','sabiduría':'SB','sabiduria':'SB',
      'eclo':'SI','si':'SI','eclo':'SI','eclesiástico':'SI','eclesiastico':'SI',

      'bar':'BA','ba':'BA','baruc':'BA',

      'dan':'DN','dn':'DN','daniel':'DN',
      'os':'OS','oseas':'OS',
      'jl':'JL','joel':'JL',
      'am':'AM','amós':'AM','amos':'AM',
      'abd':'AB','ab':'AB','abdías':'AB',
      'jon':'JON','jonás':'JON','jonas':'JON',
      'miq':'MI','mi':'MI','miqueas':'MI',
      'nah':'NA','na':'NA','nahúm':'NA','nahum':'NA',
      'hab':'HA','ha':'HA','habacuc':'HA',
      'sof':'SO','so':'SO','sofonías':'SO',
      'ag':'AG','ageo':'AG','hageo':'AG',
      'zac':'ZA','za':'ZA','zacarías':'ZA',
      'mal':'ML','ml':'ML','malaquías':'ML',
      'mt':'MT','mateo':'MT',
      'mc':'MC','marcos':'MC',
      'lc':'LC','lucas':'LC',
      'jn':'JN','juan':'JN',
      'hch':'HCH','hechos':'HCH',
      'rom':'RM','rm':'RM','romanos':'RM',
      '1cor':'1CO','1co':'1CO','1corintios':'1CO',
      '2cor':'2CO','2co':'2CO','2corintios':'2CO',
      'gal':'GA','ga':'GA','gál':'GA','gálatas':'GA','galatas':'GA',
      'ef':'EF','efesios':'EF',

      'col':'COL','colosenses':'COL',
      '1tes':'1TS','1ts':'1TS','1tesalonicenses':'1TS',

      '1tim':'1TM','1tm':'1TM','1timoteo':'1TM',
      '2tim':'2TM','2tm':'2TM',
      'tit':'TT','tt':'TT','tito':'TT',
      'flm':'FLM','filemón':'FLM','filemon':'FLM',
      'heb':'HB','hb':'HB','hebreos':'HB',
      'sant':'ST','st':'ST','santiago':'ST',
      '1pe':'1P','1p':'1P','1pedro':'1P',
      '2pe':'2P','2p':'2P','2pedro':'2P',
      '1jn':'1JN','1juan':'1JN',
      '2jn':'2JN','2juan':'2JN',
      '3jn':'3JN','3juan':'3JN',
      'jds':'JDS','judas':'JDS',
      'ap':'AP','apoc':'AP','apocalipsis':'AP'
    };

    let dateMap = {};
    let pdfDoc = null;
    let currentDate = null;
    let currentPages = [];
    let currentPageIdx = 0;
    let lastExtractedText = '';

    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');
    const pageInfo = document.getElementById('pageInfo');
    const currentDateLabel = document.getElementById('currentDateLabel');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnCalendar = document.getElementById('btnCalendar');
    const btnBible = document.getElementById('btnBible');
    const dateModal = document.getElementById('dateModal');
    const bibleModal = document.getElementById('bibleModal');
    const dateInput = document.getElementById('dateInput');
    const bibleContent = document.getElementById('bibleContent');

    async function init() {
      try {
        const res = await fetch('./date_to_page.json');
        dateMap = await res.json();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Error cargando mapa de fechas';
        return;
      }
      try {
        status.textContent = 'Cargando PDF…';
        pdfDoc = await pdfjsLib.getDocument({ url: PDF_URL }).promise;
      } catch (e) {
        status.className = 'status error';
        status.innerHTML = 'No se pudo cargar el PDF.<br>' + e.message;
        return;
      }
      const today = new Date();
      const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
      if (dateMap[todayStr]) await goToDate(todayStr);
      else await goToDate('2025-11-30');
    }

    /* =========================================================
       VISOR: ajuste, recorte de márgenes, zoom y desplazamiento
       ========================================================= */
    const area = document.querySelector('.viewer-area');
    const stage = document.getElementById('stage');
    const wrap = document.getElementById('pageWrap');
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const btnZoomReset = document.getElementById('btnZoomReset');
    const btnCrop = document.getElementById('btnCrop');

    const MOBILE_MQ = window.matchMedia('(max-width: 699px), (max-height: 499px) and (pointer: coarse)');
    const isMobile = () => MOBILE_MQ.matches;
    const MAX_ZOOM = 6;
    const MAX_AREA = 12e6;   // píxeles máx. de canvas (límite seguro en iOS)
    const MAX_DIM = 8192;
    const SBW = (() => {     // ancho de la barra de scroll del sistema
      const d = document.createElement('div');
      d.style.cssText = 'position:absolute;top:-9999px;width:100px;height:100px;overflow:scroll';
      document.body.appendChild(d);
      const w = d.offsetWidth - d.clientWidth; d.remove(); return w;
    })();

    const view = { page: null, pageNum: null, full: null, crop: null, fit: 1, minZoom: 1, zoom: 1, canvas: null };
    const cropCache = new Map();
    const textCache = new Map();
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // Preferencia de recorte (por defecto: activado en móvil, desactivado en pantallas grandes)
    const cropKey = () => 'cl_crop_' + (isMobile() ? 'm' : 'd');
    function cropOn() {
      try { const v = localStorage.getItem(cropKey()); if (v !== null) return v === '1'; } catch (_) {}
      return isMobile();
    }
    function setCropPref(on) { try { localStorage.setItem(cropKey(), on ? '1' : '0'); } catch (_) {} }
    function region() { return (cropOn() && view.crop) ? view.crop : view.full; }
    function updateCropBtn() { btnCrop.setAttribute('aria-pressed', cropOn() ? 'true' : 'false'); }

    // Detecta el rectángulo con contenido (todo lo que no es blanco) de una página
    async function getCrop(num, page, vp1) {
      if (cropCache.has(num)) return cropCache.get(num);
      const s = Math.min(2, 600 / vp1.width);
      const vp = page.getViewport({ scale: s });
      const W = Math.ceil(vp.width), H = Math.ceil(vp.height);
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      await page.render({ canvas: c, canvasContext: ctx, viewport: vp }).promise;
      const data = ctx.getImageData(0, 0, W, H).data;
      const rows = new Uint32Array(H), cols = new Uint32Array(W);
      for (let y = 0, i = 0; y < H; y++) {
        for (let x = 0; x < W; x++, i += 4) {
          if (data[i] < 236 || data[i + 1] < 236 || data[i + 2] < 236) { rows[y]++; cols[x]++; }
        }
      }
      const first = a => { for (let k = 0; k < a.length; k++) if (a[k] >= 2) return k; return -1; };
      const last = a => { for (let k = a.length - 1; k >= 0; k--) if (a[k] >= 2) return k; return -1; };
      const x0 = first(cols), x1 = last(cols), y0 = first(rows), y1 = last(rows);
      let crop = { x: 0, y: 0, w: vp1.width, h: vp1.height };
      if (x0 >= 0 && y0 >= 0) {
        const pad = Math.round(Math.max(W, H) * 0.012);
        const ax = Math.max(0, x0 - pad), ay = Math.max(0, y0 - pad);
        const bx = Math.min(W, x1 + 1 + pad), by = Math.min(H, y1 + 1 + pad);
        crop = { x: ax / s, y: ay / s, w: Math.min(vp1.width, (bx - ax) / s), h: Math.min(vp1.height, (by - ay) / s) };
      }
      cropCache.set(num, crop);
      return crop;
    }

    async function getText(num, page) {
      if (textCache.has(num)) return textCache.get(num);
      let t = '';
      try { const tc = await page.getTextContent(); t = tc.items.map(i => i.str).join(' '); } catch (_) {}
      textCache.set(num, t);
      return t;
    }

    // Escala "ajustada": página completa en tablet/escritorio, ancho completo en móvil
    function computeFit(r) {
      const cs = getComputedStyle(stage);
      const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 2;
      const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + 2;
      let availW = area.clientWidth - padX;
      const availH = area.clientHeight - padY;
      const pageFit = Math.min(availW / r.w, availH / r.h);
      if (!isMobile()) return { fit: pageFit, pageFit };
      let fitW = availW / r.w;
      if (r.h * fitW > availH && SBW) { availW -= SBW; fitW = availW / r.w; }
      return { fit: fitW, pageFit };
    }

    function maxScaleFor(r) { return Math.min(Math.sqrt(MAX_AREA / (r.w * r.h)), MAX_DIM / r.w, MAX_DIM / r.h); }

    let renderTask = null;
    async function renderCanvas(page, r, cssW) {
      const dpr = window.devicePixelRatio || 1;
      const s = Math.min(cssW * dpr / r.w, maxScaleFor(r));
      const vp = page.getViewport({ scale: s, offsetX: -r.x * s, offsetY: -r.y * s });
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(r.w * s));
      canvas.height = Math.max(1, Math.round(r.h * s));
      if (renderTask) { try { renderTask.cancel(); } catch (_) {} }
      const task = page.render({ canvas, canvasContext: canvas.getContext('2d'), viewport: vp });
      renderTask = task;
      try { await task.promise; } finally { if (renderTask === task) renderTask = null; }
      canvas._scale = s; canvas._r = r;
      return canvas;
    }

    function applyLayout() {
      const c = view.canvas; if (!c || !c._r) return;
      const s = view.fit * view.zoom;
      c.style.width = Math.floor(c._r.w * s) + 'px';
      c.style.height = Math.floor(c._r.h * s) + 'px';
      viewer.classList.toggle('can-pan',
        viewer.scrollWidth > viewer.clientWidth + 1 || viewer.scrollHeight > viewer.clientHeight + 1);
    }

    function swapCanvas(c) {
      wrap.replaceChildren(c);
      view.canvas = c;
      applyLayout();
    }

    function updateZoomLabel() { btnZoomReset.textContent = Math.round(view.zoom * 100) + '%'; }

    // Vuelve a calcular ajuste y renderiza (cambio de página, giro de pantalla, recorte)
    async function rebuild() {
      if (!view.page) return;
      const page = view.page;
      const r = region();
      const f = computeFit(r);
      const c = await renderCanvas(page, r, r.w * f.fit);
      if (view.page !== page) return;
      view.fit = f.fit;
      view.minZoom = Math.min(1, f.pageFit / f.fit);
      view.zoom = 1;
      swapCanvas(c);
      viewer.scrollTo(0, 0);
      updateZoomLabel(); updateCropBtn();
    }

    // Re-render nítido tras terminar de hacer zoom
    let reRenderTimer = null;
    function scheduleRender(delay = 220) {
      clearTimeout(reRenderTimer);
      reRenderTimer = setTimeout(async () => {
        const c = view.canvas; if (!view.page || !c || !c._r) return;
        const r = c._r;
        const cssW = r.w * view.fit * view.zoom;
        const target = Math.min(cssW * (window.devicePixelRatio || 1) / r.w, maxScaleFor(r));
        if (c._scale >= target * 0.95) return;
        const page = view.page;
        try {
          const nc = await renderCanvas(page, r, cssW);
          if (view.page === page && view.canvas && view.canvas._r === r) swapCanvas(nc);
        } catch (e) { if (e && e.name !== 'RenderingCancelledException') console.warn(e); }
      }, delay);
    }

    // Zoom manteniendo fijo el punto (ax, ay) del visor
    function zoomTo(z, ax, ay) {
      if (!view.canvas) return;
      if (ax === undefined) { ax = viewer.clientWidth / 2; ay = viewer.clientHeight / 2; }
      z = clamp(z, view.minZoom, MAX_ZOOM);
      const px = viewer.scrollLeft + ax - wrap.offsetLeft;
      const py = viewer.scrollTop + ay - wrap.offsetTop;
      const ratio = z / view.zoom;
      view.zoom = z;
      applyLayout();
      viewer.scrollLeft = px * ratio + wrap.offsetLeft - ax;
      viewer.scrollTop = py * ratio + wrap.offsetTop - ay;
      updateZoomLabel();
      scheduleRender();
    }

    function viewerPoint(clientX, clientY) {
      const rect = viewer.getBoundingClientRect();
      return [clientX - rect.left, clientY - rect.top];
    }

    btnZoomIn.addEventListener('click', () => zoomTo(view.zoom * 1.25));
    btnZoomOut.addEventListener('click', () => zoomTo(view.zoom / 1.25));
    btnZoomReset.addEventListener('click', () => { zoomTo(1); viewer.scrollTo(0, 0); });
    btnCrop.addEventListener('click', async () => {
      setCropPref(!cropOn()); updateCropBtn();
      try { await rebuild(); } catch (e) { if (e && e.name !== 'RenderingCancelledException') console.warn(e); }
    });

    // Rueda + Ctrl (o pellizco en trackpad) → zoom en el cursor
    viewer.addEventListener('wheel', e => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      const d = clamp(e.deltaY * (e.deltaMode === 1 ? 16 : 1), -25, 25);
      const [x, y] = viewerPoint(e.clientX, e.clientY);
      zoomTo(view.zoom * Math.exp(-d * 0.01), x, y);
    }, { passive: false });

    // Safari macOS: gesto de pellizco en trackpad
    const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    let gestureZ0 = 1;
    document.addEventListener('gesturestart', e => { e.preventDefault(); gestureZ0 = view.zoom; });
    document.addEventListener('gesturechange', e => {
      e.preventDefault();
      if (hasTouch) return; // en táctiles lo gestionan los eventos touch
      const [x, y] = viewerPoint(e.clientX, e.clientY);
      zoomTo(gestureZ0 * e.scale, x, y);
    });
    document.addEventListener('gestureend', e => e.preventDefault());

    // Doble clic (escritorio)
    let lastTouchTime = 0;
    viewer.addEventListener('dblclick', e => {
      if (Date.now() - lastTouchTime < 800) return;
      const [x, y] = viewerPoint(e.clientX, e.clientY);
      zoomTo(view.zoom > 1.05 ? 1 : 2, x, y);
    });

    // Arrastrar con el ratón para desplazarse cuando hay zoom
    let drag = null;
    viewer.addEventListener('mousedown', e => {
      if (e.button !== 0 || !viewer.classList.contains('can-pan')) return;
      drag = { x: e.clientX, y: e.clientY, sl: viewer.scrollLeft, st: viewer.scrollTop };
      viewer.classList.add('dragging');
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!drag) return;
      viewer.scrollLeft = drag.sl - (e.clientX - drag.x);
      viewer.scrollTop = drag.st - (e.clientY - drag.y);
    });
    window.addEventListener('mouseup', () => { drag = null; viewer.classList.remove('dragging'); });

    // Táctil: pellizco, doble toque y deslizar para cambiar de día
    let pinch = null, swipe = null, lastTap = { t: 0, x: 0, y: 0 };
    const tdist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    viewer.addEventListener('touchstart', e => {
      if (e.touches.length === 2 && view.canvas) {
        if (e.cancelable) e.preventDefault();
        const [a, b] = e.touches;
        const [mx, my] = viewerPoint((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
        pinch = {
          d0: tdist(a, b) || 1, z0: view.zoom,
          px: viewer.scrollLeft + mx - wrap.offsetLeft,
          py: viewer.scrollTop + my - wrap.offsetTop
        };
        swipe = null;
      } else if (e.touches.length === 1 && !pinch) {
        const t = e.touches[0];
        swipe = { x: t.clientX, y: t.clientY, t: Date.now() };
      } else {
        swipe = null;
      }
    }, { passive: false });

    viewer.addEventListener('touchmove', e => {
      if (!pinch || e.touches.length !== 2) return;
      if (e.cancelable) e.preventDefault();
      const [a, b] = e.touches;
      const [mx, my] = viewerPoint((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
      const z = clamp(pinch.z0 * tdist(a, b) / pinch.d0, view.minZoom, MAX_ZOOM);
      const ratio = z / pinch.z0;
      view.zoom = z;
      applyLayout();
      viewer.scrollLeft = pinch.px * ratio + wrap.offsetLeft - mx;
      viewer.scrollTop = pinch.py * ratio + wrap.offsetTop - my;
      updateZoomLabel();
    }, { passive: false });

    viewer.addEventListener('touchend', e => {
      lastTouchTime = Date.now();
      if (pinch) {
        if (e.touches.length < 2) { pinch = null; swipe = null; scheduleRender(); }
        return;
      }
      if (!swipe || e.touches.length) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y, dt = Date.now() - swipe.t;
      swipe = null;
      if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 300) {
        // ¿doble toque?
        const now = Date.now();
        if (now - lastTap.t < 320 && Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y) < 40) {
          if (e.cancelable) e.preventDefault();
          const [x, y] = viewerPoint(t.clientX, t.clientY);
          zoomTo(view.zoom > 1.05 ? 1 : 2.5, x, y);
          lastTap.t = 0;
        } else {
          lastTap = { t: now, x: t.clientX, y: t.clientY };
        }
        return;
      }
      // Deslizar solo si no hay zoom ni scroll horizontal
      const canPanX = viewer.scrollWidth > viewer.clientWidth + 2;
      if (view.zoom <= 1.01 && !canPanX && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 800) {
        (dx < 0 ? btnNext : btnPrev).click();
      }
    }, { passive: false });
    viewer.addEventListener('touchcancel', () => { pinch = null; swipe = null; });

    // Redimensionar / girar: solo recalcular si cambia lo que afecta al ajuste
    let lastSize = { w: area.clientWidth, h: area.clientHeight, m: isMobile() };
    let resizeTimer = null;
    function onResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const w = area.clientWidth, h = area.clientHeight, m = isMobile();
        const changed = m !== lastSize.m || Math.abs(w - lastSize.w) > 2 || (!m && Math.abs(h - lastSize.h) > 2);
        lastSize = { w, h, m };
        if (changed && view.page) rebuild().catch(e => { if (e && e.name !== 'RenderingCancelledException') console.warn(e); });
      }, 200);
    }
    window.addEventListener('resize', onResize);
    if (MOBILE_MQ.addEventListener) MOBILE_MQ.addEventListener('change', onResize);

    // Teclado
    document.addEventListener('keydown', e => {
      if (e.target.closest && e.target.closest('input, textarea, select')) return;
      if (document.querySelector('.modal-overlay.open, .bible-reader.open')) return;
      const k = e.key;
      if (k === '+' || k === '=') { e.preventDefault(); zoomTo(view.zoom * 1.25); }
      else if (k === '-' || k === '_') { e.preventDefault(); zoomTo(view.zoom / 1.25); }
      else if (k === '0') { e.preventDefault(); zoomTo(1); viewer.scrollTo(0, 0); }
      else if (!e.ctrlKey && !e.metaKey && !e.altKey && viewer.scrollWidth <= viewer.clientWidth + 2) {
        if (k === 'ArrowLeft') btnPrev.click();
        else if (k === 'ArrowRight') btnNext.click();
      }
    });

    let navSeq = 0;
    async function showCurrent() {
      if (!currentPages.length) return;
      const seq = ++navSeq;
      const pageNum = currentPages[currentPageIdx];
      if (view.canvas) wrap.classList.add('loading');
      else wrap.innerHTML = '<div class="status">Renderizando p. ' + pageNum + '…</div>';
      updateNavUI(pageNum);
      try {
        const page = await pdfDoc.getPage(pageNum);
        if (seq !== navSeq) return;
        const vp1 = page.getViewport({ scale: 1 });
        view.full = { x: 0, y: 0, w: vp1.width, h: vp1.height };
        view.crop = await getCrop(pageNum, page, vp1);
        if (seq !== navSeq) return;
        view.page = page; view.pageNum = pageNum;
        await rebuild();
        if (seq !== navSeq) return;
        lastExtractedText = await getText(pageNum, page);
      } catch (e) {
        if (e && e.name === 'RenderingCancelledException') return;
        if (seq !== navSeq) return;
        view.canvas = null;
        wrap.innerHTML = '<div class="status error"></div>';
        wrap.firstChild.textContent = 'Error: ' + (e && e.message);
      } finally {
        if (seq === navSeq) wrap.classList.remove('loading');
      }
    }

    function updateNavUI(pageNum) {
      currentDateLabel.textContent = formatDate(currentDate);
      pageInfo.innerHTML = '<strong>' + currentDate + '</strong><br>Pág. ' + pageNum +
        (currentPages.length > 1 ? ' (' + (currentPageIdx+1) + '/' + currentPages.length + ')' : '');
      const keys = Object.keys(dateMap).sort();
      const idx = keys.indexOf(currentDate);
      btnPrev.disabled = idx <= 0 && currentPageIdx <= 0;
      btnNext.disabled = idx >= keys.length - 1 && currentPageIdx >= currentPages.length - 1;
    }

    function formatDate(iso) {
      const p = iso.split('-');
      const months = ['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      return parseInt(p[2]) + ' ' + months[parseInt(p[1])] + ' ' + p[0];
    }

    async function goToDate(dateStr) {
      const pages = dateMap[dateStr];
      if (!pages || !pages.length) { alert('No hay página para ' + dateStr); return; }
      currentDate = dateStr;
      currentPages = pages;
      currentPageIdx = 0;
      await showCurrent();
    }

    function extractRefs(text) {
      if (!text) return [];
      const re = /\b((?:1|2|3)?\s*[A-Za-záéíóúÁÉÍÓÚñÑ.]{1,8})\s+(\d{1,3})(?:\s*[,:]\s*(\d{1,3}[a-z]?)(?:\s*[-–]\s*(\d{1,3}[a-z]?))?)?/gi;
      const found = [];
      const seen = new Set();
      let m;
      while ((m = re.exec(text)) !== null) {
        let bookRaw = m[1].replace(/\./g, '').trim().toLowerCase().replace(/\s+/g, '');
        if (bookRaw === '1cor' || bookRaw === '1co') bookRaw = '1cor';
        if (bookRaw === '2cor' || bookRaw === '2co') bookRaw = '2cor';
        if (bookRaw === 'salmo' || bookRaw === 'salmos') bookRaw = 'sal';
        if (bookRaw === 'romanos') bookRaw = 'rom';
        if (bookRaw === 'gálatas' || bookRaw === 'galatas') bookRaw = 'gal';
        const bookId = BOOK_MAP[bookRaw];
        if (!bookId) continue;
        const chap = m[2];
        let from = m[3] ? m[3].replace(/[a-z]/g, '') : null;
        let to   = m[4] ? m[4].replace(/[a-z]/g, '') : from;
        let display = bookRaw.toUpperCase();
        if (display === '1COR') display = '1 Cor';
        if (display === '2COR') display = '2 Cor';
        display += ' ' + chap;
        if (from) display += ',' + from + (to && to !== from ? '-' + to : '');
        const key = bookId + '|' + chap + '|' + (from||'') + '|' + (to||'');
        if (seen.has(key)) continue;
        seen.add(key);
        let url = BIBLIA_BASE + '#/' + bookId + '/' + chap;
        if (from) url += '/' + from;
        found.push({ display, url });
      }
      return found;
    }

    btnPrev.addEventListener('click', async () => {
      if (currentPageIdx > 0) { currentPageIdx--; await showCurrent(); return; }
      const keys = Object.keys(dateMap).sort();
      const idx = keys.indexOf(currentDate);
      if (idx > 0) await goToDate(keys[idx - 1]);
    });
    btnNext.addEventListener('click', async () => {
      if (currentPageIdx < currentPages.length - 1) { currentPageIdx++; await showCurrent(); return; }
      const keys = Object.keys(dateMap).sort();
      const idx = keys.indexOf(currentDate);
      if (idx < keys.length - 1) await goToDate(keys[idx + 1]);
    });

    btnCalendar.addEventListener('click', () => {
      dateInput.value = currentDate || '2025-11-30';
      dateModal.classList.add('open');
    });
    document.getElementById('btnCancelDate').addEventListener('click', () => dateModal.classList.remove('open'));
    document.getElementById('btnGoDate').addEventListener('click', async () => {
      const v = dateInput.value;
      dateModal.classList.remove('open');
      if (v) await goToDate(v);
    });
    dateModal.addEventListener('click', e => { if (e.target === dateModal) dateModal.classList.remove('open'); });

    // Full-screen pure-text Bible reader
    const bibleReader = document.getElementById('bibleReader');
    const bibleReaderTitle = document.getElementById('bibleReaderTitle');
    const bibleReaderBody = document.getElementById('bibleReaderBody');
    const bibleExternalLink = document.getElementById('bibleExternalLink');

    // Hidden iframe used only to call Biblia.getPassage (same-origin when possible)
    let bibliaFrame = null;
    function ensureBibliaFrame() {
      if (bibliaFrame) return bibliaFrame;
      bibliaFrame = document.createElement('iframe');
      bibliaFrame.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
      bibliaFrame.src = 'https://javierscervera-rgb.github.io/Herramientas/Biblia.html';
      document.body.appendChild(bibliaFrame);
      return bibliaFrame;
    }

    async function fetchPassage(refDisplay) {
      // Try via hidden iframe (works when same-origin or relaxed)
      try {
        const frame = ensureBibliaFrame();
        // Wait a bit for load if needed
        for (let i = 0; i < 30; i++) {
          if (frame.contentWindow && frame.contentWindow.Biblia) break;
          await new Promise(r => setTimeout(r, 150));
        }
        if (frame.contentWindow && frame.contentWindow.Biblia) {
          const p = frame.contentWindow.Biblia.getPassage(refDisplay);
          if (p) return p;
        }
      } catch (e) { /* cross-origin or not ready */ }

      // Fallback: return null so UI shows link
      return null;
    }

    async function openReader(url, title) {
      bibleReaderTitle.textContent = title || 'Lectura';
      bibleReaderBody.innerHTML = '<div class="loading">Cargando texto…</div>';
      bibleExternalLink.href = url;
      bibleReader.classList.add('open');
      bibleModal.classList.remove('open');

      const passage = await fetchPassage(title);
      if (passage && passage.verses && passage.verses.length) {
        let html = '';
        for (const v of passage.verses) {
          html += '<div class="verse"><span class="verse-num">' + (v.label || v.n) + '</span>' +
                  (v.text || '') + '</div>';
        }
        bibleReaderBody.innerHTML = html;
      } else if (passage && passage.text) {
        bibleReaderBody.innerHTML = '<div class="verse">' + passage.text + '</div>';
      } else {
        bibleReaderBody.innerHTML =
          '<div class="error">No se pudo cargar el texto aquí.<br>' +
          'Pulsa el enlace de abajo para verlo en la Biblia Interactiva.</div>';
      }
    }

    document.getElementById('btnCloseReader').addEventListener('click', () => {
      bibleReader.classList.remove('open');
      bibleReaderBody.innerHTML = '';
    });
    // Close when clicking the dark backdrop
    bibleReader.addEventListener('click', e => {
      if (e.target === bibleReader) {
        bibleReader.classList.remove('open');
        bibleReaderBody.innerHTML = '';
      }
    });

    btnBible.addEventListener('click', () => {
      const refs = extractRefs(lastExtractedText);
      if (!refs.length) {
        bibleContent.innerHTML = '<div class="no-refs">No se detectaron citas bíblicas en esta página.<br>Prueba a pasar a la página anterior o siguiente del mismo día.</div>';
      } else {
        let html = '<ul class="ref-list">';
        for (const r of refs) {
          // Use button-like <a> that calls openReader instead of target=_blank
          html += '<li><span class="ref-text">' + r.display + '</span>' +
                  '<a href="#" data-url="' + r.url + '" data-title="' + r.display + '" class="open-reader">Leer</a></li>';
        }
        html += '</ul>';
        bibleContent.innerHTML = html;

        // Attach click handlers
        bibleContent.querySelectorAll('.open-reader').forEach(a => {
          a.addEventListener('click', ev => {
            ev.preventDefault();
            openReader(a.dataset.url, a.dataset.title);
          });
        });
      }
      bibleModal.classList.add('open');
    });
    document.getElementById('btnCloseBible').addEventListener('click', () => bibleModal.classList.remove('open'));
    bibleModal.addEventListener('click', e => { if (e.target === bibleModal) bibleModal.classList.remove('open'); });

    updateCropBtn();
    init();
  </script>
</body>
</html>
