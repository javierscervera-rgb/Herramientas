<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Calendario Litúrgico Pastoral 2025-2026</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #fff;
      --accent: #7a3b12;
      --green: #2d5a2e;
      --text: #1a1a1a;
      --muted: #666;
      --border: #ddd5c5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top bar minimal */
    .topbar {
      background: linear-gradient(135deg, #5c2e0e, #8b4513);
      color: #fff;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      flex-shrink: 0;
    }
    .topbar h1 {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar .date-label {
      font-size: 0.85rem;
      opacity: .9;
      font-weight: 500;
    }

    /* Main viewer */
    #viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: auto;
      padding: 0.5rem 0.25rem 4.5rem;
      -webkit-overflow-scrolling: touch;
    }
    .page-wrap {
      width: 100%;
      max-width: 920px;
      background: var(--card);
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,.1);
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    .page-wrap canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }
    .status {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }
    .status.error { color: #b33; }

    /* Bottom navigation bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.75rem;
      gap: 0.5rem;
      z-index: 100;
      box-shadow: 0 -2px 12px rgba(0,0,0,.08);
    }
    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--green);
      color: #fff;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .15s, background .15s;
      flex-shrink: 0;
    }
    .nav-btn:active { transform: scale(0.92); }
    .nav-btn:disabled {
      background: #aaa;
      cursor: default;
      opacity: .6;
    }
    .nav-btn.calendar {
      background: var(--accent);
      width: 52px;
      height: 52px;
      font-size: 1.5rem;
    }
    .page-info {
      flex: 1;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.3;
    }
    .page-info strong {
      color: var(--accent);
      font-size: 0.95rem;
    }

    /* Date picker modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 1.25rem;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    .modal h2 {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }
    .modal input[type="date"] {
      width: 100%;
      padding: 0.7rem;
      font-size: 1.1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
    }
    .modal-actions button {
      flex: 1;
      padding: 0.65rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-go {
      background: var(--green);
      color: #fff;
    }
    .btn-cancel {
      background: #eee;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Calendario Litúrgico 2025-2026</h1>
    <div class="date-label" id="currentDateLabel">—</div>
  </div>

  <div id="viewer">
    <div class="status" id="status">Cargando…</div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn" id="btnPrev" title="Página / día anterior" disabled>‹</button>
    <div class="page-info" id="pageInfo">—</div>
    <button class="nav-btn calendar" id="btnCalendar" title="Buscar fecha">📅</button>
    <button class="nav-btn" id="btnNext" title="Página / día siguiente" disabled>›</button>
  </div>

  <!-- Date search modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>Ir a una fecha</h2>
      <input type="date" id="dateInput" min="2025-11-29" max="2026-12-31">
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancel">Cancelar</button>
        <button class="btn-go" id="btnGo">Ir</button>
      </div>
    </div>
  </div>

  <script type="module">
    const { pdfjsLib } = globalThis;
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const PDF_URL = './Calendario-Liturgico-CEE-2026.pdf';
    let dateMap = {};
    let pdfDoc = null;
    let currentDate = null;   // YYYY-MM-DD
    let currentPages = [];    // pages for current date
    let currentPageIdx = 0;   // which of the pages we are showing (if multi)

    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');
    const pageInfo = document.getElementById('pageInfo');
    const currentDateLabel = document.getElementById('currentDateLabel');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnCalendar = document.getElementById('btnCalendar');
    const modal = document.getElementById('modal');
    const dateInput = document.getElementById('dateInput');

    // ---------- Load data ----------
    async function init() {
      try {
        const res = await fetch('./date_to_page.json');
        dateMap = await res.json();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Error cargando mapa de fechas';
        return;
      }

      try {
        status.textContent = 'Cargando PDF…';
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
      } catch (e) {
        status.className = 'status error';
        status.innerHTML = `No se pudo cargar el PDF.<br>Asegúrate de que <code>Calendario-Liturgico-CEE-2026.pdf</code> está junto a este HTML.<br>${e.message}`;
        return;
      }

      // Go to today if possible
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      const todayStr = `${y}-${m}-${d}`;

      if (dateMap[todayStr]) {
        await goToDate(todayStr);
      } else {
        // fallback first day of Advent 2025
        await goToDate('2025-11-30');
        currentDateLabel.textContent += ' (hoy fuera de rango)';
      }
    }

    // ---------- Render ----------
    async function renderPage(pageNum) {
      const page = await pdfDoc.getPage(pageNum);
      const scale = Math.min(2.0, (window.innerWidth - 16) / page.getViewport({ scale: 1 }).width * 1.8);
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: ctx, viewport }).promise;
      return canvas;
    }

    async function showCurrent() {
      if (!currentPages.length) return;
      const pageNum = currentPages[currentPageIdx];

      viewer.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      const loading = document.createElement('div');
      loading.className = 'status';
      loading.textContent = `Renderizando p. ${pageNum}…`;
      wrap.appendChild(loading);
      viewer.appendChild(wrap);

      try {
        const canvas = await renderPage(pageNum);
        wrap.innerHTML = '';
        wrap.appendChild(canvas);
      } catch (e) {
        loading.className = 'status error';
        loading.textContent = 'Error al renderizar: ' + e.message;
      }

      // Update UI
      const d = currentDate;
      currentDateLabel.textContent = formatDate(d);
      pageInfo.innerHTML = `<strong>${d}</strong><br>Pág. ${pageNum}` +
        (currentPages.length > 1 ? ` (${currentPageIdx + 1}/${currentPages.length})` : '');

      // Enable/disable arrows (day navigation)
      const keys = Object.keys(dateMap).sort();
      const idx = keys.indexOf(currentDate);
      btnPrev.disabled = idx <= 0 && currentPageIdx <= 0;
      btnNext.disabled = idx >= keys.length - 1 && currentPageIdx >= currentPages.length - 1;
    }

    function formatDate(iso) {
      const [y, m, d] = iso.split('-');
      const months = ['', 'ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      return `${parseInt(d)} ${months[parseInt(m)]} ${y}`;
    }

    async function goToDate(dateStr) {
      const pages = dateMap[dateStr];
      if (!pages || !pages.length) {
        alert('No hay página para ' + dateStr);
        return;
      }
      currentDate = dateStr;
      currentPages = pages;
      currentPageIdx = 0;
      await showCurrent();
    }

    // ---------- Navigation ----------
    btnPrev.addEventListener('click', async () => {
      if (currentPageIdx > 0) {
        currentPageIdx--;
        await showCurrent();
        return;
      }
      // previous day
      const keys = Object.keys(dateMap).sort();
      const idx = keys.indexOf(currentDate);
      if (idx > 0) {
        await goToDate(keys[idx - 1]);
      }
    });

    btnNext.addEventListener('click', async () => {
      if (currentPageIdx < currentPages.length - 1) {
        currentPageIdx++;
        await showCurrent();
        return;
      }
      // next day
      const keys = Object.keys(dateMap).sort();
      const idx = keys.indexOf(currentDate);
      if (idx < keys.length - 1) {
        await goToDate(keys[idx + 1]);
      }
    });

    // Calendar modal
    btnCalendar.addEventListener('click', () => {
      dateInput.value = currentDate || '2025-11-30';
      modal.classList.add('open');
    });
    document.getElementById('btnCancel').addEventListener('click', () => {
      modal.classList.remove('open');
    });
    document.getElementById('btnGo').addEventListener('click', async () => {
      const v = dateInput.value;
      modal.classList.remove('open');
      if (v) await goToDate(v);
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });

    // Swipe support (optional)
    let touchStartX = 0;
    viewer.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    viewer.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(dx) > 60) {
        if (dx < 0) btnNext.click();
        else btnPrev.click();
      }
    }, { passive: true });

    init();
  </script>
</body>
</html>
