<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compositor de la Misa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: cabecera fija con logo; tres vistas (Componer · Celebrar · Biblioteca). Celebrar = columna de lectura única con botonera flotante. */
:root{
  --bg:#171310; --card:#201D18; --btn:#292420; --fg:#F0E8DC; --fg2:#AA9D8F; --line:#37312B;
  --acc:#CD8B75; --acc2:#D88972; --rub:#CD8B75; --ok:#9DB58A; --warn:#E0B26A;
  --f-text:"Alegreya", Georgia, "Times New Roman", serif;
  --f-ui:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-sc:"Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
  --fs:22px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
@media (max-width:560px){.brand{display:none}}
html,body{background:var(--bg);color:var(--fg);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--acc)}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding-block:10px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.logo-btn{display:flex;align-items:center;border-radius:10px;padding:4px;text-decoration:none}
.logo-btn:hover{background:var(--btn)}
.logo{display:block;height:clamp(32px,5vw,48px);width:auto;max-width:200px}
.brand-fb{font-family:var(--f-sc);font-weight:700;color:var(--acc2);font-size:17px}
.brand{font-family:var(--f-sc);font-weight:700;letter-spacing:.06em;color:var(--acc2);font-size:18px;margin-right:auto}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{background:none;border:0;border-radius:9px;padding:7px 14px;color:var(--fg2);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--fg);box-shadow:inset 0 -2px 0 var(--acc)}

main{max-width:1180px;margin:0 auto;padding-top:22px}
h1,h2,h3{text-wrap:balance}
.view-title{font-family:var(--f-text);font-weight:500;font-size:clamp(26px,4vw,34px);margin:0 0 4px}
.lead{color:var(--fg2);margin:0 0 20px;max-width:65ch}

/* Componer */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-family:var(--f-sc);font-size:14px;letter-spacing:.09em;color:var(--acc);margin:0 0 14px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 200px}
.fld>label,.lbl{font-size:13px;color:var(--fg2);font-weight:500}
select,input[type=text],input[type=search],textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{font-family:var(--f-text);font-size:17px;line-height:1.5;resize:vertical}
select:disabled{opacity:.55}
.info{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--fg2);background:var(--bg)}
.chip.acc{color:var(--acc2);border-color:var(--acc)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;border-radius:8px;padding:6px 11px;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--fg);box-shadow:inset 0 0 0 1px var(--acc)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.opt{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.opt:last-child{margin-bottom:0}
.auto{font-size:12px;color:var(--fg2);margin-left:6px}
.btn{background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--fg)}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);color:#171310;border-color:var(--acc);font-weight:700}
.btn.primary:hover{background:var(--acc2)}
.btn.small{padding:5px 10px;font-size:14px}
.btn.danger{color:var(--acc2)}
.lect{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.lect:first-of-type{border-top:0;margin-top:0;padding-top:0}
.lect-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lect-h strong{font-family:var(--f-sc);letter-spacing:.05em;color:var(--fg);font-size:15px;min-width:110px}
.lect-h input{flex:1 1 160px}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.notes li{font-size:14.5px;padding-left:14px;border-left:3px solid var(--line);color:var(--fg)}
.notes li.lock{border-color:var(--acc)}
.notes li.warn{border-color:var(--warn)}
.notes li small{display:block;color:var(--fg2)}
.side{position:sticky;top:96px;display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){.side{position:static}}
.meter{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.muted{color:var(--fg2);font-size:14px}
.big-go{width:100%;padding:14px;font-size:18px}

/* Celebrar */
#v-celebrar{max-width:780px;margin:0 auto}
.cel-head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:8px}
.cel-head .eyebrow{font-family:var(--f-sc);letter-spacing:.1em;color:var(--acc);font-size:14px}
.cel-head h1{font-family:var(--f-text);font-weight:500;font-size:calc(var(--fs)*1.45);margin:4px 0}
#lectura{font-family:var(--f-text);font-size:var(--fs);line-height:1.55}
#lectura h2.sec{font-family:var(--f-sc);font-size:calc(var(--fs)*.8);letter-spacing:.12em;color:var(--acc2);margin:2.2em 0 .6em;font-weight:700;scroll-margin-top:90px}
#lectura .rub{color:var(--rub);font-size:calc(var(--fs)*.78);font-family:var(--f-ui);margin:.9em 0 .5em;max-width:65ch}
#lectura .lbl-t{font-family:var(--f-sc);font-size:calc(var(--fs)*.62);letter-spacing:.1em;color:var(--fg2);margin:1.3em 0 .2em;display:block}
#lectura p.s{margin:.25em 0 .55em;max-width:65ch;border-radius:8px;padding:2px 6px;margin-left:-6px;transition:background .3s}
#lectura p.s.now{background:color-mix(in srgb, var(--acc) 16%, transparent)}
#lectura .r{font-weight:700}
#lectura .vr{color:var(--rub);font-weight:700;margin-right:.3em}
#lectura .rub-in{color:var(--rub);font-family:var(--f-ui);font-size:.78em}
#lectura .missing{font-family:var(--f-ui);font-size:15px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--fg2);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:.3em 0 .8em}
#lectura .cita{color:var(--fg2);font-style:italic}
.end{text-align:center;color:var(--fg2);margin:3em 0 1em;font-family:var(--f-sc);letter-spacing:.1em}

.dock{position:fixed;z-index:30;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.dock .pod{display:flex;gap:6px;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:6px;backdrop-filter:blur(6px);flex-wrap:wrap;justify-content:flex-end}
.dock button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--btn);display:grid;place-items:center;color:var(--fg);font-family:var(--f-ui);font-weight:700;font-size:17px}
.dock button[aria-pressed="true"]{background:var(--acc);color:#171310;border-color:var(--acc)}
.dock button:disabled{opacity:.35}
.dock svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hear{max-width:min(86vw,420px);font-size:14px;color:var(--fg2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.hear b{color:var(--acc2);font-weight:500}
.jump{display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px}
.jump select{width:auto;max-width:70vw;background:var(--card)}

/* Biblioteca */
.lib{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.lib{grid-template-columns:minmax(0,1fr)}}
.items{max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-top:10px}
.items button{text-align:left;background:none;border:0;border-radius:8px;padding:7px 9px;color:var(--fg);display:flex;gap:9px;align-items:center}
.items button:hover{background:var(--btn)}
.items button[aria-current="true"]{background:var(--btn);box-shadow:inset 3px 0 0 var(--acc)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--fg2);flex:none}
.dot.on{background:var(--ok);border-color:var(--ok)}
#ed-text{min-height:46vh}
.help{font-size:14px;color:var(--fg2);line-height:1.5}
.help code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#171310;border-radius:10px;padding:9px 16px;font-weight:700;z-index:50}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>

<header class="top">
  <a class="logo-btn" href="https://javierscervera-rgb.github.io/Herramientas/herramientas.html" target="_self" aria-label="Volver a Herramientas">
    <img class="logo" src="logo.svg" alt="Herramientas" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'Herramientas',className:'brand-fb'}))">
  </a>
  <span class="brand">Compositor de la Misa</span>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="componer" aria-selected="true">Componer</button>
    <button role="tab" data-view="celebrar" aria-selected="false">Celebrar</button>
    <button role="tab" data-view="biblioteca" aria-selected="false">Biblioteca</button>
  </nav>
</header>

<main>
  <section id="v-componer"></section>
  <section id="v-celebrar" hidden></section>
  <section id="v-biblioteca" hidden></section>
</main>

<div class="dock" id="dock" hidden>

    <button id="b-auto" title="Desplazamiento automático" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 4v16M6 14l6 6 6-6"/></svg></button>
    <button id="b-lento" title="Más lento">−</button>
    <button id="b-rapido" title="Más rápido">+</button>
  </div>
  <div class="pod">
    <button id="b-menos" title="Texto más pequeño">A−</button>
    <button id="b-mas" title="Texto más grande">A+</button>
    <button id="b-arriba" title="Subir"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button id="b-abajo" title="Bajar"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
</div>

  P.forEach(p => c.push({g:"Prefacios",k:"pref."+p.id,l:p.n+" — "+p.t}));
  PE.forEach(p => [["a","desde el Santo hasta la consagración"],["b","relato de la institución"],["c","desde la aclamación hasta la doxología"]]
    .forEach(([s,t]) => c.push({g:"Plegarias eucarísticas",k:`pe.${p.id}.${s}`,l:`${p.n}: ${t}`})));
  EMB.forEach(([k,l]) => c.push({g:"Plegarias eucarísticas",k,l}));
  BSOL.forEach((t,i) => c.push({g:"Bendiciones",k:`bend.sol.${i+1}`,l:`Bendición solemne ${i+1}: ${t}`}));
  for(let i=1;i<=28;i++) c.push({g:"Bendiciones",k:`bend.pueblo.${i}`,l:`Oración sobre el pueblo ${i}`});
  RITOS.forEach(([k,l]) => c.push({g:"Ritos especiales",k,l}));
  return c;
}

function labelOf(k){
  if(LABEL[k]) return LABEL[k];

  if(m && FM[m[1]]) return `${TIPOS[m[2]]} — ${FM[m[1]].c}`;

}

function lecturasPorDefecto(f){
  const L = (t, x={}) => Object.assign({t, cita:"", txt:""}, x);
  if(f.e === "vigilia"){
    const a = [];
    for(let i=1;i<=S.vigN;i++){ a.push(L("lectura",{n:`Lectura ${i} (A. T.)`, or:i})); a.push(L("salmo")); }
    return a.concat([L("lectura",{n:"Epístola"}), L("salmo",{n:"Salmo con aleluya"}), L("evangelio")]);
  }
  if(f.e === "pentvig" && S.pentExt){
    const a = [];
    for(let i=1;i<=4;i++){ a.push(L("lectura",{n:`Lectura ${i}`, pent:i})); a.push(L("salmo")); }
    return a.concat([L("lectura",{n:"Epístola"}), L("aclamacion"), L("evangelio")]);
  }
  const a = [];
  if(f.e === "ramos") a.push(L("evangelio",{n:"Evangelio de la entrada", entrada:true}));
  a.push(L("lectura",{n:"Primera lectura"}), L("salmo"));
  if(f.l2 || f.e === "viernes") a.push(L("lectura",{n:"Segunda lectura"}));
  if(f.sq) a.push(L("secuencia",{opc: f.sq === 1}));
  a.push(L("aclamacion"));
  a.push(L("evangelio",{n: (f.e === "ramos" || f.e === "viernes") ? "Pasión del Señor" : "Evangelio"}));
  return a;
}

function rehacerLecturas(){
  const old = S.lect || [];
  const nuevas = lecturasPorDefecto(FM[S.fid]);
  const used = new Set();
  nuevas.forEach(n => {
    const i = old.findIndex((o,j) => !used.has(j) && o.t === n.t && (o.cita || o.txt) && (o.n||"") === (n.n||""));
    if(i >= 0){ used.add(i); n.cita = old[i].cita; n.txt = old[i].txt; }
  });
  S.lect = nuevas;
}
if(!S.lect || !S.lect.length) rehacerLecturas();

/* ---------- Reglas ---------- */
function commKey(f){
  const c = f.c;
  if(/Natividad del Señor|octava|Sagrada Familia|Madre de Dios/.test(c) && f.g === "Navidad") return "navidad";
  if(/Epifanía del Señor/.test(c)) return "epifania";
  if(f.e === "jueves") return "jueves";
  if(f.e === "vigilia" || /Pascua de la Resurrección|octava de Pascua|Domingo II de Pascua/.test(c)) return "pascua";
  if(/Ascensión del Señor/.test(c)) return "ascension";
  if(/Pentecostés/.test(c)) return "pentecostes";
  return "";
}
const R_com6 = f => !["Adviento","Navidad","Cuaresma","Semana Santa","Pascua"].includes(f.g);
function reglas(){
  const f = FM[S.fid], notes = [];
  const sinPE = f.e === "viernes";
  const peOpts = PE.map(p => {
    let dis = "";
    if(p.id === "pe4" && f.pp) dis = "Tiene prefacio fijo: no se usa cuando la misa tiene prefacio propio.";
    if(p.id.startsWith("dc") && f.s !== "Misas por diversas necesidades") dis = "Solo con las misas por diversas necesidades.";
    if(p.id.startsWith("nin") && !S.ninos) dis = "Activa «Misa con niños» para usarla.";
    return {...p, dis};
  });
  if(peOpts.find(p => p.id === S.pe)?.dis) S.pe = "pe2";
  const pe = PEM[S.pe];
  let prefOpts, prefLock = "";
  if(pe.own === "-"){ prefOpts = []; prefLock = "Esta plegaria lleva el prefacio integrado."; }
  else if(pe.own){ prefOpts = [pe.own]; prefLock = `La ${pe.n} tiene su propio prefacio, que no puede cambiarse.`; }
  else {
    prefOpts = [...f.pm];
    if(S.pe === "pe2" && !f.pp && !prefOpts.includes("com6") && !["Adviento","Navidad","Cuaresma","Semana Santa","Pascua"].includes(f.g)) prefOpts.push("com6");
    if(f.pp) prefLock = f.pm.length > 1 ? "Prefacio propio de la celebración (con las alternativas que permite la rúbrica)." : "Prefacio propio de la celebración: no puede cambiarse.";
  }
  if(prefOpts.length && !prefOpts.includes(S.pref)) S.pref = f.pp && !pe.own ? f.pp : prefOpts[0];
  if(!prefOpts.length) S.pref = "";
  if(pe.own && pe.own !== "-") S.pref = pe.own;

  if(f.pp && !pe.own) notes.push({c:"lock", t:`Prefacio propio: ${PM[f.pp].n}.`, s:"Se fija automáticamente."});
  if(pe.own && pe.own !== "-") notes.push({c:"lock", t:prefLock});
  if(f.pp) notes.push({c:"", t:"P. E. IV no disponible.", s:"Solo puede usarse con su prefacio propio, y esta misa ya tiene uno."});
  if(S.pe === "pe2" && !f.pp && R_com6(f)) notes.push({c:"", t:"La P. E. II tiene prefacio propio (Común VI), pero admite otro.", s:""});
  const ck = commKey(f);
  if(ck) notes.push({c: S.pe === "pe1" ? "lock" : "", t: S.pe === "pe1" ? "Se inserta el Communicantes propio del día." : "Con la P. E. I se usaría un Communicantes propio.", s: (ck === "jueves" || ck === "pascua") ? "También hay Hanc igitur propio." : ""});
  if(f.e === "jueves" && S.pe !== "pe1") notes.push({c:"warn", t:"Para la Cena del Señor se recomienda la P. E. I, con su relato de la institución propio."});

  const gloriaAuto = f.gl, credoAuto = f.cr;
  const gloria = S.gloria ?? gloriaAuto, credo = S.credo ?? credoAuto;
  notes.push({c: S.gloria === null ? "lock" : "warn", t:`Gloria: ${gloria ? "sí" : "no"}`, s: S.gloria === null ? "Según el rango y el tiempo litúrgico." : "Cambiado a mano."});
  notes.push({c: S.credo === null ? "lock" : "warn", t:`Credo: ${credo ? "sí" : "no"}`, s: S.credo === null ? "Domingos y solemnidades." : "Cambiado a mano."});
  if(S.ap === "3") notes.push({c:"lock", t:"Con la forma 3 del acto penitencial se omite el «Señor, ten piedad»."});
  if(f.e === "ceniza") notes.push({c:"lock", t:"Se omite el acto penitencial: lo sustituye la imposición de la ceniza."});
  if(f.e === "ramos") notes.push({c:"lock", t:"La conmemoración de la entrada sustituye a los ritos iniciales."});
  if(f.e === "presentacion") notes.push({c:"lock", t:"La bendición de las candelas sustituye al acto penitencial."});
  if(f.e === "jueves") notes.push({c:"lock", t:"No hay bendición ni despedida: la misa termina con el traslado del Santísimo."});
  if(f.sq === 2) notes.push({c:"lock", t:"Secuencia obligatoria antes del aleluya."});
  if(f.x.some(x => x[0] === "pueblo")) notes.push({c:"", t:"Este día tiene oración sobre el pueblo propia.", s:"Puedes elegirla en la bendición."});
  if(f.e === "ritual") notes.push({c:"", t:"El rito del sacramento se inserta después de la homilía.", s:"Sigue el ritual correspondiente."});
  return {f, peOpts, prefOpts, prefLock, gloria, credo, gloriaAuto, credoAuto, notes, sinPE};
}

/* ---------- Orden de la celebración ---------- */
function buildOrder(){
  const R = reglas(), f = R.f, B = [];
  const sec = t => B.push({t:"sec", x:t});
  const rub = x => B.push({t:"rub", x});
  const txt = (k, l) => B.push({t:"txt", k, l: l || labelOf(k)});
  const prop = (tipo, l) => { if(f.x.some(x => x[0] === tipo)) txt(`prop.${f.id}.${tipo}`, l || TIPOS[tipo]); };
  const lect = (L) => B.push({t:"lec", L});

  if(f.e === "viernes") return viernes(f, B, sec, rub, txt, prop, lect);

  /* Ritos iniciales */
  if(f.e === "vigilia"){
    sec("Lucernario");
    rub("Se apagan las luces de la iglesia. Fuera, se prepara una hoguera. El pueblo se reúne y el sacerdote saluda como de costumbre.");
    txt("rito.vig.mon"); txt("rito.vig.fuego");
    rub("Se prepara el cirio pascual: la cruz, las letras alfa y omega, las cifras del año y, si se desea, los cinco granos de incienso.");
    txt("rito.vig.cirio"); txt("rito.vig.luz");
    rub("En la procesión hacia el altar, al tercer «Luz de Cristo» se encienden las luces de la iglesia, excepto las del altar.");
    rub("Se inciensa el cirio y se canta el pregón pascual.");
    txt(S.pregon === "breve" ? "rito.vig.pregon_breve" : "rito.vig.pregon_largo");
    sec("Liturgia de la Palabra");
    txt("rito.vig.mon_palabra");
  } else {
    sec("Ritos iniciales");
    if(f.e === "ramos"){
      rub(S.ramos === "procesion" ? "Primera forma, la procesión. Los fieles se reúnen en una iglesia menor u otro lugar fuera de la iglesia principal, con ramos en las manos." :
          S.ramos === "solemne" ? "Segunda forma, la entrada solemne. Los fieles se reúnen ante la puerta o dentro de la iglesia, con ramos." :
          "Tercera forma, la entrada simple. Se canta o se dice la antífona de entrada mientras el sacerdote va al altar.");
      if(S.ramos !== "simple"){
        txt("rito.ramos.ant"); rub("El sacerdote saluda al pueblo y hace una breve monición."); txt("rito.ramos.mon"); txt("rito.ramos.bend");
        rub("Rocía los ramos con agua bendita, sin decir nada. Después se proclama el evangelio de la entrada del Señor.");
        const ev = S.lect.find(l => l.entrada); if(ev) lect(ev);
        rub("Si parece oportuno, sigue una homilía breve."); txt("rito.ramos.inv");
        rub("Comienza la procesión hacia la iglesia donde se celebrará la misa, con cantos en honor de Cristo Rey."); txt("rito.ramos.cantos");
        rub("Al llegar al altar, el sacerdote lo venera y va a la sede. Se omiten los demás ritos iniciales y se dice la colecta.");
      } else { prop("entrada"); txt("ord.senal"); txt("ord.saludo" + S.saludo); txt("ord.ap_inv"); txt("ord.ap" + S.ap); txt("ord.absol"); if(S.ap !== "3") txt("ord.kyrie"); }
    } else if(f.e === "presentacion"){
      rub("Los fieles se reúnen fuera de la iglesia o en otro lugar adecuado, con las candelas sin encender. Mientras se encienden, se canta una antífona.");
      txt("ord.senal"); txt("ord.saludo" + S.saludo); txt("rito.cand.mon"); txt("rito.cand.bend");
      rub("Rocía las candelas con agua bendita, sin decir nada, y recibe su candela."); txt("rito.cand.inv"); txt("rito.cand.ant");
      rub("Al llegar al altar, el sacerdote lo venera. Se omite el acto penitencial y se canta el Gloria.");
    } else {
      rub("Reunido el pueblo, el sacerdote va al altar con los ministros mientras se canta el canto de entrada. Si no hay canto, se dice la antífona de entrada.");
      prop("entrada");
      rub("Llegado al altar, hace la reverencia debida y lo besa; si se usa incienso, lo inciensa. Luego va a la sede.");
      txt("ord.senal"); txt("ord.saludo" + S.saludo);
      rub("El sacerdote, el diácono u otro ministro puede introducir a los fieles en la misa del día con palabras muy breves.");
      if(f.e === "ceniza") rub("Se omite el acto penitencial, que se sustituye por la imposición de la ceniza.");
      else if(S.ap === "asp"){
        rub("Los domingos puede hacerse la bendición y aspersión del agua en lugar del acto penitencial.");
        txt("rito.asp.mon"); txt("rito.asp.bend");
        rub("El sacerdote rocía con el agua bendita a sí mismo, a los ministros y al pueblo, recorriendo la iglesia si conviene. Mientras, se canta.");
        txt("rito.asp.ant"); txt("rito.asp.or");
      } else {
        txt("ord.ap_inv");
        rub("Se hace una breve pausa en silencio.");
        txt("ord.ap" + S.ap); txt("ord.absol");
        if(S.ap !== "3") txt("ord.kyrie");
      }
    }
    if(R.gloria && f.e !== "vigilia"){
      if(f.e === "jueves") rub("Mientras se canta el Gloria se tocan las campanas, que después callan hasta la Vigilia pascual.");
      else rub("Se canta o se dice el Gloria.");
      txt("ord.gloria");
    }
    rub("El sacerdote invita a orar y todos oran en silencio unos momentos. Después dice la oración colecta.");
    prop("colecta");
    sec("Liturgia de la Palabra");
  }

  /* Liturgia de la Palabra */
  palabra(f, R, rub, txt, prop, lect);

  /* Homilía e inserciones */
  rub("Homilía. Es obligatoria los domingos y fiestas de precepto; se recomienda en los demás días.");
  if(f.e === "ceniza"){
    sec("Bendición e imposición de la ceniza");
    rub("Después de la homilía, el sacerdote invita a orar y bendice la ceniza.");
    txt("rito.ceniza.bend");
    rub("Rocía la ceniza con agua bendita, sin decir nada, y la impone a los fieles con una de las fórmulas. Mientras, se canta.");
    txt("rito.ceniza.imp"); txt("rito.ceniza.ant");
    rub("Terminada la imposición, el sacerdote se lava las manos. Sigue la oración universal. No se dice Credo.");
  }
  if(f.e === "crismal"){
    sec("Renovación de las promesas sacerdotales");
    rub("Después de la homilía, el obispo dialoga con los presbíteros, que renuevan sus promesas.");
    txt("rito.crismal.promesas");
    rub("La bendición de los óleos puede hacerse en este momento o antes del final de la plegaria eucarística, según el Pontifical.");
    txt("rito.crismal.oleos");
  }
  if(f.e === "jueves"){
    sec("Lavatorio de los pies");
    rub("Después de la homilía, donde lo aconseje la utilidad pastoral, se hace el lavatorio de los pies. El sacerdote echa agua sobre los pies de cada uno y se los seca. Mientras, se cantan antífonas.");
    txt("rito.jueves.lavatorio");
    rub("Después se hace la oración universal. No se dice Credo.");
  }
  if(f.e === "ritual"){
    sec("Rito del sacramento");
    rub("Después de la homilía se celebra el rito propio, según el ritual correspondiente.");
    txt("rito.ritual");
  }
  if(f.e === "vigilia"){
    sec("Liturgia bautismal");
    rub("El sacerdote va con los ministros a la fuente bautismal, o se coloca un recipiente con agua en el presbiterio.");
    txt("rito.vig.mon_baut");
    rub("Se cantan las letanías, que pueden ampliarse con los nombres de santos propios.");
    txt("rito.vig.letanias");
    txt("rito.vig.agua_baut");
    rub("Si no hay bautismos ni se bendice la fuente, se bendice el agua con la otra fórmula.");
    txt("rito.vig.agua");
    rub("Todos, con las velas encendidas, renuevan las promesas bautismales.");
    txt("rito.vig.promesas");
    rub("El sacerdote rocía al pueblo con el agua bendita, mientras se canta.");
    txt("rito.vig.asp");
  }
  if(R.credo && !["ceniza","jueves"].includes(f.e)){
    rub("Se canta o se dice el símbolo. Todos se inclinan en las palabras sobre la Encarnación.");
    txt(S.simbolo === "apostoles" ? "ord.apostoles" : "ord.credo");
  }
  rub("Oración universal u oración de los fieles.");
  if(S.ou.trim()) B.push({t:"free", l:"Oración universal", x:S.ou});

  eucaristia(f, R, B, sec, rub, txt, prop);
  return B;
}

function palabra(f, R, rub, txt, prop, lect){
  let primera = true;
  S.lect.forEach(L => {
    if(L.entrada) return;
    if(L.t === "lectura"){
      rub(primera ? "El lector va al ambón y proclama la lectura; todos escuchan sentados." : "Sigue la lectura.");
      primera = false;
      lect(L);
      txt("ord.palabra");
    } else if(L.t === "salmo"){
      lect(L);
    } else if(L.t === "secuencia"){
      rub(L.opc ? "Se puede cantar la secuencia." : "Se canta la secuencia.");
      lect(L);
    } else if(L.t === "aclamacion"){
      rub("Todos se levantan y se canta el Aleluya o, en Cuaresma, la aclamación correspondiente.");
      lect(L);
    } else if(L.t === "evangelio"){
      if(f.e === "vigilia"){
        rub("Después de la epístola, todos se levantan y el sacerdote entona solemnemente el aleluya tres veces, elevando la voz cada vez. El pueblo lo repite.");
        txt("rito.vig.aleluya");
      }
      if(f.e === "ramos" || f.e === "viernes"){
        rub("Se lee la Pasión del Señor sin cirios ni incienso, sin saludo y sin signar el libro.");
        lect(L);
      } else {
        rub("Mientras se pone incienso, si se usa, el diácono pide la bendición; si no hay diácono, el sacerdote, inclinado ante el altar, dice en secreto:");
        txt("ord.ev_secreta"); txt("ord.ev_dialogo");
        lect(L);
        txt("ord.ev_final");
      }
    }
    // oración tras las lecturas de la Vigilia (después del salmo correspondiente)
    if(L.t === "salmo"){
      const idx = S.lect.indexOf(L), prev = S.lect[idx-1];
      if(prev && (prev.or || prev.pent)) rub("Todos se levantan; el sacerdote invita a orar y, tras un momento de silencio, dice la oración.");
      if(prev && prev.or) txt(`rito.vig.or${prev.or}`);
      if(prev && prev.pent) txt(`rito.pent.or${prev.pent}`);
      if(f.e === "vigilia" && prev && prev.or === S.vigN){
        rub("Después de la última lectura del Antiguo Testamento, con su salmo y su oración, se encienden las velas del altar y se canta el Gloria, mientras se tocan las campanas.");
        txt("ord.gloria");
        rub("El sacerdote dice la oración colecta.");
        prop("colecta");
      }
    }
  });
}

  if(f.e === "jueves"){

    rub("Después de la oración después de la comunión, el sacerdote pone incienso y, arrodillado, inciensa el Santísimo. Con el velo humeral, lleva el copón en procesión al lugar de la reserva, mientras se canta.");
    txt("rito.jueves.traslado");

  if(S.bend === "solemne"){
    rub("El diácono, o el sacerdote, invita a inclinarse para recibir la bendición. El sacerdote, con las manos extendidas sobre el pueblo, dice la bendición solemne; todos responden «Amén» a cada invocación.");
    txt(`bend.sol.${S.bendN}`);
  } else if(S.bend === "pueblo"){
    rub("El diácono, o el sacerdote, invita a inclinarse. El sacerdote, con las manos extendidas sobre el pueblo, dice la oración.");

  const aleluya = f.e === "vigilia" || /octava de Pascua|Pascua de la Resurrección|Pentecostés: Misa del día/.test(f.c);

}

/* ---------- Renderizado del texto ---------- */
function parseTexto(s){
  return s.trim().split(/\n\s*\n/).map(par => {
    const lines = par.split("\n").map(l => l.trimEnd()).filter(l => l.trim());
    let rubOnly = lines.every(l => /^\s*(\*|\[)/.test(l));
    const html = lines.map(l => {
      let m;
      if((m = l.match(/^\s*(?:\*|\[)(.*?)\]?\s*$/))) return `<span class="rub-in">${esc(m[1].trim())}</span>`;
      if((m = l.match(/^\s*(?:℟|R\.|R\/)\s*(.*)$/))) return `<span class="vr">℟.</span><span class="r">${esc(m[1])}</span>`;
      if((m = l.match(/^\s*(?:℣|V\.|V\/)\s*(.*)$/))) return `<span class="vr">℣.</span>${esc(m[1])}`;
      return esc(l);
    }).join("<br>");
    return {html, plain: rubOnly ? "" : lines.join(" ")};
  });
}
let SEGS = [];
function renderCelebrar(){
  const f = FM[S.fid], B = buildOrder();
  let h = `<div class="cel-head"><div class="eyebrow">${esc(f.g)}${f.f ? " · " + esc(f.f) : ""}${f.r ? " · " + esc(f.r) : ""}</div><h1>${esc(f.c)}</h1></div>`;
  const secs = B.filter(b => b.t === "sec");
  h += `<div class="jump"><select id="jump-sel" aria-label="Ir a la parte"><option value="">Ir a…</option>${secs.map((s,i) => `<option value="sec${i}">${esc(s.x)}</option>`).join("")}</select></div>`;
  h += `<div id="lectura">`;
  let si = 0;
  for(const b of B){
    if(b.t === "sec") h += `<h2 class="sec" id="sec${si++}">${esc(b.x)}</h2>`;
    else if(b.t === "rub") h += `<p class="rub">${esc(b.x)}</p>`;
    else if(b.t === "txt" || b.t === "free"){
      const v = b.t === "free" ? b.x : LIB[b.k];
      h += `<span class="lbl-t">${esc(b.l)}</span>`;
      if(v && v.trim()) h += parseTexto(v).map(p => `<p class="s" data-plain="${esc(p.plain)}">${p.html}</p>`).join("");
      else h += `<div class="missing">Falta este texto en tu biblioteca. <button class="btn small" data-edit="${esc(b.k)}">Añadir texto</button></div>`;
    } else if(b.t === "lec"){
      const L = b.L, nom = L.n || TL[L.t];
      h += `<span class="lbl-t">${esc(nom)}${L.cita ? ` · <span class="cita">${esc(L.cita)}</span>` : ""}</span>`;
      if(L.txt && L.txt.trim()) h += parseTexto(L.txt).map(p => `<p class="s" data-plain="${esc(p.plain)}">${p.html}</p>`).join("");
      else h += `<div class="missing">Sin texto. Pégalo en Componer › Liturgia de la Palabra.</div>`;
    }
  }
  h += `</div><div class="end">Fin de la celebración</div>`;
  $("#v-celebrar").innerHTML = h;
  SEGS = [...document.querySelectorAll("#lectura p.s")].map(el => {
    const w = normWords(el.dataset.plain || "");
    const bi = new Map();
    for(let i=0;i<w.length-1;i++){ const k = w[i]+" "+w[i+1]; if(!bi.has(k)) bi.set(k, []); bi.get(k).push(i); }
    return {el, w, bi};
  }).filter(s => s.w.length);
  vozIdx = 0;
}

/* ---------- Vista Componer ---------- */
const SECCIONES = [...new Set(F.map(f => f.s))];
function segHTML(name, opts, val, disabled = {}){

}
function faltantes(){
  const B = buildOrder(), set = new Set();
  B.forEach(b => { if(b.t === "txt" && !(LIB[b.k] && LIB[b.k].trim())) set.add(b.k); });
  const total = new Set(B.filter(b => b.t === "txt").map(b => b.k)).size;
  return {faltan:[...set], total};

let libGrupo = "Ordinario de la misa", libKey = "", libFiltro = "", libConfirm = false;
function libItems(){
  if(libGrupo === "Propio de la misa actual"){
    const f = FM[S.fid];
    return f.x.map(([t,o]) => ({k:`prop.${f.id}.${t}`, l:`${TIPOS[t]}${o !== "Propio" ? " (" + o.toLowerCase() + ")" : ""}`}));
  }
  if(libGrupo === "Lo que falta en esta misa") return faltantes().faltan.map(k => ({k, l:labelOf(k)}));
  if(libGrupo === "Propio de otra celebración"){
    const q = libFiltro.toLowerCase();
    const fs = q ? F.filter(f => f.c.toLowerCase().includes(q)).slice(0, 25) : [];
    return fs.flatMap(f => f.x.map(([t]) => ({k:`prop.${f.id}.${t}`, l:`${f.c} · ${TIPOS[t]}`})));
  }
  const q = libFiltro.toLowerCase();
  return CAT.filter(x => x.g === libGrupo && (!q || x.l.toLowerCase().includes(q))).map(x => ({k:x.k, l:x.l}));
}

/* ---------- Navegación ---------- */
let vista = "componer";
function mostrar(v){
  vista = v;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === v)));
  ["componer","celebrar","biblioteca"].forEach(x => $("#v-" + x).hidden = x !== v);
  $("#dock").hidden = v !== "celebrar";
  if(v === "componer") renderComponer();
  if(v === "celebrar"){ renderCelebrar(); pedirWakeLock(); }
  else { pararAuto(); pararVoz(); }
  if(v === "biblioteca") renderBiblioteca();
  window.scrollTo({top:0});
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if(b) mostrar(b.dataset.view); });

function toast(t){ const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }

/* Eventos de Componer */
const vc = $("#v-componer");
vc.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.set){
    const k = b.dataset.set, v = b.dataset.val;
    if(k === "gloria" || k === "credo") S[k] = v === "auto" ? null : v === "true";
    else if(["ninos","pentExt"].includes(k)) S[k] = v === "true";
    else if(k === "vigN") S[k] = +v;
    else S[k] = v;
    if(["vigN","pentExt"].includes(k)) rehacerLecturas();
    if(k === "bend" && v === "pueblo" && FM[S.fid].x.some(x => x[0] === "pueblo")) S.puebloN = "propia";
    renderComponer(); return;
  }
  if(b.dataset.dellect !== undefined){ S.lect.splice(+b.dataset.dellect, 1); renderComponer(); return; }
  if(b.dataset.addlect){ const ai = S.lect.findIndex(l => l.t === "aclamacion"); S.lect.splice(ai < 0 ? S.lect.length : ai, 0, {t:b.dataset.addlect, cita:"", txt:"", n: b.dataset.addlect === "lectura" ? "Lectura" : ""}); renderComponer(); return; }
  if(b.id === "reset-lect"){ S.lect = []; rehacerLecturas(); S.lect.forEach(l => { l.cita = ""; l.txt = ""; }); renderComponer(); return; }
  if(b.id === "go-celebrar"){ mostrar("celebrar"); return; }
  if(b.id === "ver-faltan"){ libGrupo = "Lo que falta en esta misa"; libKey = ""; mostrar("biblioteca"); return; }
  if(b.id === "g-guardar"){
    const nombre = $("#g-nombre").value.trim() || FM[S.fid].c;
    const g = store.get("misa.guardadas", []); g.unshift({nombre, S: JSON.parse(JSON.stringify(S))});
    store.set("misa.guardadas", g); toast("Misa guardada"); renderComponer(); return;
  }
  if(b.id === "g-cargar"){ const g = store.get("misa.guardadas", [])[+$("#g-lista").value]; if(g){ S = Object.assign({}, DEF, g.S); toast("Misa cargada"); renderComponer(); } return; }
  if(b.id === "g-borrar"){ const g = store.get("misa.guardadas", []); g.splice(+$("#g-lista").value, 1); store.set("misa.guardadas", g); renderComponer(); return; }
});
vc.addEventListener("change", e => {
  const t = e.target;
  if(t.id === "c-sec"){ const x = F.find(f => f.s === t.value); cambiarCel(x.id); }
  else if(t.id === "c-grp"){ const x = F.find(f => f.s === FM[S.fid].s && f.g === t.value); cambiarCel(x.id); }
  else if(t.id === "c-cel") cambiarCel(t.value);
  else if(t.id === "c-pe"){ S.pe = t.value; S.pref = ""; renderComponer(); }
  else if(t.id === "c-pref"){ S.pref = t.value; renderComponer(); }
  else if(t.id === "c-bsol"){ S.bendN = +t.value; saveS(); }
  else if(t.id === "c-bpue"){ S.puebloN = t.value === "propia" ? "propia" : +t.value; saveS(); }
});
vc.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.lect !== undefined){ S.lect[+t.dataset.lect][t.dataset.f] = t.value; saveS(); }
  else if(t.id === "c-ou"){ S.ou = t.value; saveS(); }
  else if(t.id === "c-busca"){ filtroCel = t.value; clearTimeout(vc._t); vc._t = setTimeout(() => { renderComponer(); const i = $("#c-busca"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); }
});
function cambiarCel(id){
  S.fid = id; S.gloria = null; S.credo = null; S.pref = "";
  const f = FM[id];
  S.bend = f.x.some(x => x[0] === "pueblo") && f.g === "Cuaresma" ? "pueblo" : "simple";
  if(S.bend === "pueblo") S.puebloN = "propia";
  if(f.e === "jueves") S.pe = "pe1";
  if(S.ap === "asp" && f.r !== "Domingo" && f.r !== "Solemnidad") S.ap = "1";
  rehacerLecturas(); renderComponer();
}

/* Eventos de Biblioteca */
const vb = $("#v-biblioteca");
vb.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.key){ libKey = b.dataset.key; renderBiblioteca(); $("#ed-text")?.focus(); return; }
  if(b.id === "ed-sig"){ const it = libItems(), i = it.findIndex(x => x.k === libKey); if(it[i+1]){ libKey = it[i+1].k; renderBiblioteca(); $("#ed-text")?.focus(); } return; }
  if(b.id === "l-exp"){
    const blob = new Blob([JSON.stringify({tipo:"biblioteca-misal", version:1, textos:LIB}, null, 1)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "biblioteca-misal.json"; document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  if(b.id === "l-del"){ libConfirm = true; renderBiblioteca(); return; }
  if(b.id === "l-del-no"){ libConfirm = false; renderBiblioteca(); return; }
  if(b.id === "l-del-si"){ LIB = {}; saveLib(); libConfirm = false; toast("Biblioteca vaciada"); renderBiblioteca(); return; }
});
vb.addEventListener("input", e => {
  const t = e.target;
  if(t.id === "ed-text"){
    LIB[libKey] = t.value;
    clearTimeout(vb._t); vb._t = setTimeout(() => {
      const ok = saveLib(); const st = $("#ed-estado"); if(st) st.textContent = ok ? "Guardado." : "No se pudo guardar en este navegador.";
      const dot = vb.querySelector(`button[data-key="${CSS.escape(libKey)}"] .dot`); if(dot) dot.classList.toggle("on", !!t.value.trim());
    }, 400);
  }
  if(t.id === "l-filtro"){ libFiltro = t.value; clearTimeout(vb._f); vb._f = setTimeout(() => { renderBiblioteca(); const i = $("#l-filtro"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); }
});
vb.addEventListener("change", e => {
  const t = e.target;
  if(t.id === "l-grupo"){ libGrupo = t.value; libKey = ""; libFiltro = ""; renderBiblioteca(); }
  if(t.id === "l-imp" && t.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try{
        const j = JSON.parse(r.result), tx = j.textos || j;
        let n = 0; for(const [k,v] of Object.entries(tx)) if(typeof v === "string"){ LIB[k] = v; n++; }
        saveLib(); toast(`${n} textos importados`); renderBiblioteca();
      }catch(err){ toast("El archivo no es una biblioteca válida"); }
    };
    r.readAsText(t.files[0]);
  }
});

  if(b){ libGrupo = "Lo que falta en esta misa"; libKey = b.dataset.edit; mostrar("biblioteca"); }
});
$("#v-celebrar").addEventListener("change", e => {
  if(e.target.id === "jump-sel" && e.target.value){ document.getElementById(e.target.value)?.scrollIntoView({behavior:"smooth"}); e.target.value = ""; }
});

/* ---------- Tamaño, desplazamiento ---------- */
let fs = store.get("misa.fs", 22);
const aplicarFs = () => { document.documentElement.style.setProperty("--fs", fs + "px"); store.set("misa.fs", fs); };
aplicarFs();
$("#b-mas").onclick = () => { fs = Math.min(48, fs + 2); aplicarFs(); };
$("#b-menos").onclick = () => { fs = Math.max(14, fs - 2); aplicarFs(); };
const paso = dir => window.scrollBy({top: dir * innerHeight * 0.6, behavior:"smooth"});
$("#b-arriba").onclick = () => paso(-1);
$("#b-abajo").onclick = () => paso(1);
document.addEventListener("keydown", e => {
  if(vista !== "celebrar" || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if(["ArrowDown","PageDown"," "].includes(e.key)){ e.preventDefault(); paso(1); }
  if(["ArrowUp","PageUp"].includes(e.key)){ e.preventDefault(); paso(-1); }
});

let autoOn = false, vel = store.get("misa.vel", 30), autoT = 0, acum = 0;
function tick(t){
  if(!autoOn) return;
  if(autoT){ acum += vel * (t - autoT) / 1000; const px = Math.floor(acum); if(px){ window.scrollBy(0, px); acum -= px; } }
  autoT = t;
  if(innerHeight + scrollY >= document.documentElement.scrollHeight - 2){ pararAuto(); return; }
  requestAnimationFrame(tick);
}
function pararAuto(){ autoOn = false; autoT = 0; $("#b-auto").setAttribute("aria-pressed", "false"); }
$("#b-auto").onclick = () => {
  if(autoOn){ pararAuto(); return; }
  if(vozOn) pararVoz();
  autoOn = true; $("#b-auto").setAttribute("aria-pressed", "true"); requestAnimationFrame(tick);
  toast(`Velocidad ${vel} px/s`);
};
$("#b-lento").onclick = () => { vel = Math.max(6, vel - 6); store.set("misa.vel", vel); toast(`Velocidad ${vel} px/s`); };
$("#b-rapido").onclick = () => { vel = Math.min(150, vel + 6); store.set("misa.vel", vel); toast(`Velocidad ${vel} px/s`); };

let wake = null;
async function pedirWakeLock(){ try{ if("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } }catch(e){} }
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && vista === "celebrar") pedirWakeLock(); });

/* ---------- Seguir la voz ---------- */
function normWords(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ\s]/g, " ").split(/\s+/).filter(Boolean);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, vozOn = false, vozIdx = 0, oidas = [];
if(!SR){ $("#b-voz").disabled = true; $("#b-voz").title = "Este navegador no reconoce la voz. Usa Chrome, Edge o Safari."; }
function mostrarOido(txt, estado){
  const h = $("#hear"); h.hidden = false;
  h.innerHTML = `<b>${esc(estado)}</b>${txt ? " · " + esc(txt) : ""}`;
}
function seguir(palabras){
  if(palabras.length < 3 || !SEGS.length) return;
  const bis = [];
  for(let i = Math.max(0, palabras.length - 12); i < palabras.length - 1; i++) bis.push(palabras[i] + " " + palabras[i+1]);
  let best = -1, bestScore = 0, bestPos = 0;
  const desde = Math.max(0, vozIdx - 2), hasta = Math.min(SEGS.length - 1, vozIdx + 30);
  for(let s = desde; s <= hasta; s++){
    const seg = SEGS[s]; let hits = 0, pos = -1;
    bis.forEach((b, j) => { const o = seg.bi.get(b); if(o){ hits += 1 + j / bis.length; pos = Math.max(pos, o[0] + 1); } });
    if(!hits) continue;
    const dist = s - vozIdx;
    const score = hits - (dist < 0 ? 0.6 * -dist : 0.04 * dist);
    if(score > bestScore){ bestScore = score; best = s; bestPos = pos; }
  }
  if(best < 0 || bestScore < 1.6) return;
  vozIdx = best;
  const seg = SEGS[best];
  SEGS.forEach((x, i) => x.el.classList.toggle("now", i === best));
  const r = seg.el.getBoundingClientRect();
  const frac = Math.min(1, bestPos / seg.w.length);
  const objetivo = scrollY + r.top + frac * r.height - innerHeight * 0.33;
  if(Math.abs(objetivo - scrollY) > 24) window.scrollTo({top: objetivo, behavior:"smooth"});
  // si se termina un párrafo, el siguiente pasa a ser el candidato principal
  if(frac > 0.85 && best + 1 < SEGS.length) vozIdx = best + (seg.w.length - bestPos < 3 ? 1 : 0);
}
function iniciarVoz(){
  rec = new SR(); rec.lang = "es-ES"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = ev => {
    let interim = "";
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const t = ev.results[i][0].transcript;
      if(ev.results[i].isFinal) oidas = oidas.concat(normWords(t)).slice(-40); else interim += " " + t;
    }
    const todo = oidas.concat(normWords(interim)).slice(-16);
    mostrarOido(todo.slice(-8).join(" "), "Escuchando");
    seguir(todo);
  };
  rec.onerror = ev => {
    if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){ pararVoz(); mostrarOido("", "Sin permiso para usar el micrófono. Actívalo en el navegador."); }
  };
  rec.onend = () => { if(vozOn) setTimeout(() => { try{ rec.start(); }catch(e){} }, 200); };
  try{ rec.start(); }catch(e){}
}
function pararVoz(){
  vozOn = false; $("#b-voz").setAttribute("aria-pressed", "false");
  if(rec){ try{ rec.onend = null; rec.stop(); }catch(e){} rec = null; }
  const h = $("#hear"); if(h && !/permiso/.test(h.textContent)) h.hidden = true;
}
$("#b-voz").onclick = () => {
  if(vozOn){ pararVoz(); return; }
  if(autoOn) pararAuto();
  // Empieza a buscar desde lo que está en pantalla
  const top = scrollY + innerHeight * 0.2;
  vozIdx = Math.max(0, SEGS.findIndex(s => s.el.getBoundingClientRect().top + scrollY >= top));
  vozOn = true; oidas = []; $("#b-voz").setAttribute("aria-pressed", "true");
  mostrarOido("", "Escuchando…"); iniciarVoz(); pedirWakeLock();
};

mostrar("componer");
</script>
