<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compositor de la Misa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: cabecera fija con logo; tres vistas (Componer · Celebrar · Biblioteca). Celebrar = columna de lectura única con botonera flotante. */
:root{
  --bg:#171310; --card:#201D18; --btn:#292420; --fg:#F0E8DC; --fg2:#AA9D8F; --line:#37312B;
  --acc:#CD8B75; --acc2:#D88972; --rub:#CD8B75; --ok:#9DB58A; --warn:#E0B26A;
  --f-text:"Alegreya", Georgia, "Times New Roman", serif;
  --f-ui:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-sc:"Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
  --fs:22px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
@media (max-width:560px){.brand{display:none}}
html,body{background:var(--bg);color:var(--fg);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--acc)}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding-block:10px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.logo-btn{display:flex;align-items:center;border-radius:10px;padding:4px;text-decoration:none}
.logo-btn:hover{background:var(--btn)}
.logo{display:block;height:clamp(32px,5vw,48px);width:auto;max-width:200px}
.brand-fb{font-family:var(--f-sc);font-weight:700;color:var(--acc2);font-size:17px}
.brand{font-family:var(--f-sc);font-weight:700;letter-spacing:.06em;color:var(--acc2);font-size:18px;margin-right:auto}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{background:none;border:0;border-radius:9px;padding:7px 14px;color:var(--fg2);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--fg);box-shadow:inset 0 -2px 0 var(--acc)}

main{max-width:1180px;margin:0 auto;padding-top:22px}
h1,h2,h3{text-wrap:balance}
.view-title{font-family:var(--f-text);font-weight:500;font-size:clamp(26px,4vw,34px);margin:0 0 4px}
.lead{color:var(--fg2);margin:0 0 20px;max-width:65ch}

/* Componer */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-family:var(--f-sc);font-size:14px;letter-spacing:.09em;color:var(--acc);margin:0 0 14px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 200px}
.fld>label,.lbl{font-size:13px;color:var(--fg2);font-weight:500}
select,input[type=text],input[type=search],textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{font-family:var(--f-text);font-size:17px;line-height:1.5;resize:vertical}
select:disabled{opacity:.55}
.info{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--fg2);background:var(--bg)}
.chip.acc{color:var(--acc2);border-color:var(--acc)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;border-radius:8px;padding:6px 11px;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--fg);box-shadow:inset 0 0 0 1px var(--acc)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.opt{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.opt:last-child{margin-bottom:0}
.auto{font-size:12px;color:var(--fg2);margin-left:6px}
.btn{background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--fg)}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);color:#171310;border-color:var(--acc);font-weight:700}
.btn.primary:hover{background:var(--acc2)}
.btn.small{padding:5px 10px;font-size:14px}
.btn.danger{color:var(--acc2)}
.lect{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.lect:first-of-type{border-top:0;margin-top:0;padding-top:0}
.lect-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lect-h strong{font-family:var(--f-sc);letter-spacing:.05em;color:var(--fg);font-size:15px;min-width:110px}
.lect-h input{flex:1 1 160px}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.notes li{font-size:14.5px;padding-left:14px;border-left:3px solid var(--line);color:var(--fg)}
.notes li.lock{border-color:var(--acc)}
.notes li.warn{border-color:var(--warn)}
.notes li small{display:block;color:var(--fg2)}
.side{position:sticky;top:96px;display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){.side{position:static}}
.meter{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.muted{color:var(--fg2);font-size:14px}
.big-go{width:100%;padding:14px;font-size:18px}

/* Celebrar */
#v-celebrar{max-width:780px;margin:0 auto}
.cel-head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:8px}
.cel-head .eyebrow{font-family:var(--f-sc);letter-spacing:.1em;color:var(--acc);font-size:14px}
.cel-head h1{font-family:var(--f-text);font-weight:500;font-size:calc(var(--fs)*1.45);margin:4px 0}
#lectura{font-family:var(--f-text);font-size:var(--fs);line-height:1.55}
#lectura h2.sec{font-family:var(--f-sc);font-size:calc(var(--fs)*.8);letter-spacing:.12em;color:var(--acc2);margin:2.2em 0 .6em;font-weight:700;scroll-margin-top:90px}
#lectura .rub{color:var(--rub);font-size:calc(var(--fs)*.78);font-family:var(--f-ui);margin:.9em 0 .5em;max-width:65ch}
#lectura .lbl-t{font-family:var(--f-sc);font-size:calc(var(--fs)*.62);letter-spacing:.1em;color:var(--fg2);margin:1.3em 0 .2em;display:block}
#lectura p.s{margin:.25em 0 .55em;max-width:65ch;border-radius:8px;padding:2px 6px;margin-left:-6px;transition:background .3s}
#lectura p.s.now{background:color-mix(in srgb, var(--acc) 16%, transparent)}
#lectura .r{font-weight:700}
#lectura .vr{color:var(--rub);font-weight:700;margin-right:.3em}
#lectura .rub-in{color:var(--rub);font-family:var(--f-ui);font-size:.78em}
#lectura .missing{font-family:var(--f-ui);font-size:15px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--fg2);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:.3em 0 .8em}
#lectura .cita{color:var(--fg2);font-style:italic}
#lectura p.rub.tit{font-style:italic;margin-top:.2em}
.end{text-align:center;color:var(--fg2);margin:3em 0 1em;font-family:var(--f-sc);letter-spacing:.1em}

.dock{position:fixed;z-index:30;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.dock .pod{display:flex;gap:6px;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:6px;backdrop-filter:blur(6px);flex-wrap:wrap;justify-content:flex-end}
.dock button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--btn);display:grid;place-items:center;color:var(--fg);font-family:var(--f-ui);font-weight:700;font-size:17px}
.dock button[aria-pressed="true"]{background:var(--acc);color:#171310;border-color:var(--acc)}
.dock button:disabled{opacity:.35}
.dock svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hear{max-width:min(86vw,420px);font-size:14px;color:var(--fg2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.hear b{color:var(--acc2);font-weight:500}
.jump{display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px}
.jump select{width:auto;max-width:70vw;background:var(--card)}

/* Biblioteca */
.lib{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.lib{grid-template-columns:minmax(0,1fr)}}
.items{max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-top:10px}
.items button{text-align:left;background:none;border:0;border-radius:8px;padding:7px 9px;color:var(--fg);display:flex;gap:9px;align-items:center}
.items button:hover{background:var(--btn)}
.items button[aria-current="true"]{background:var(--btn);box-shadow:inset 3px 0 0 var(--acc)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--fg2);flex:none}
.dot.on{background:var(--ok);border-color:var(--ok)}
#ed-text{min-height:46vh}
.help{font-size:14px;color:var(--fg2);line-height:1.5}
.help code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#171310;border-radius:10px;padding:9px 16px;font-weight:700;z-index:50}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Opciones deslizables */
.car{min-width:0;background:var(--bg);border:1px solid var(--acc);border-radius:12px;padding:12px 0 10px;overflow:hidden}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.car-track::-webkit-scrollbar,.alt-track::-webkit-scrollbar{display:none}
.car-card{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;text-align:left;background:none;border:0;border-radius:0;padding:0 16px;display:flex;flex-direction:column;gap:6px;color:var(--fg);cursor:grab;height:calc(16px * 1.4 * 3 + 24px)}
.car-card:focus-visible{outline-offset:-2px}
.car-card:disabled{opacity:.45;cursor:not-allowed}
.car-t{font-family:var(--f-sc);font-size:13px;letter-spacing:.06em;color:var(--acc2);font-weight:700}
.car-s{font-family:var(--f-text);font-size:16px;line-height:1.4;color:var(--fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.car-card:disabled .car-s{font-family:var(--f-ui);font-size:13px;color:var(--fg2)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:10px}
.dot-b{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line);transition:background .2s,transform .2s}
.dot-b.on{background:var(--acc);transform:scale(1.25)}
#lectura .alt{margin:.2em 0 .9em}
#lectura .alt-track{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;transition:height .25s;overscroll-behavior-x:contain}
#lectura .alt-slide{flex:0 0 100%;scroll-snap-align:start;padding-right:4px;min-width:0}
#lectura .alt-t{font-family:var(--f-ui);font-size:13px;color:var(--fg2);margin-bottom:.2em}
#lectura .dots{margin-top:4px}

/* ---------- Vista libro ---------- */
#libro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 50% 40%,#2b241e 0%,#171310 70%);color:var(--fg);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#libro[hidden]{display:none}
.lb-top{display:flex;align-items:center;gap:10px;padding:6px 16px 0;min-height:52px}
.lb-top .lb-tit{flex:1;min-width:0;font-family:var(--f-sc);letter-spacing:.08em;font-size:14px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-top .lb-num{font-family:var(--f-ui);font-size:14px;color:var(--fg2);font-variant-numeric:tabular-nums}
.lb-ic{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--fg);display:grid;place-items:center;font:700 16px var(--f-ui);cursor:pointer}
.lb-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb-ic[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#171310}
.lb-ic:disabled{opacity:.35;cursor:default}
.lb-stage{flex:1;min-height:0;position:relative;display:flex;justify-content:center;align-items:stretch;
  padding:12px 26px 18px 16px;perspective:2400px;touch-action:pan-y}
.lb-page{position:relative;width:min(100%,860px);height:100%;background:#fbf8f1;color:#1d1813;border-radius:2px 6px 6px 2px;
  box-shadow:1px 1px 0 #ebe5d9,2px 2px 0 #cfc7b8,3px 3px 0 #f1ece2,4px 4px 0 #c9c0b0,5px 5px 0 #ede7dc,6px 6px 0 #c3baa9,
    7px 7px 0 #e9e2d5,8px 8px 0 #bdb3a2,0 22px 46px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.35)}
.lb-page::before{content:"";position:absolute;inset:0 auto 0 0;width:26px;border-radius:2px 0 0 2px;pointer-events:none;
  background:linear-gradient(to right,rgba(80,60,40,.16),rgba(80,60,40,0))}
.lb-vp{position:absolute;inset:var(--lb-pt) var(--lb-px) var(--lb-pb);overflow:hidden}
.lb-run{position:absolute;left:var(--lb-px);right:var(--lb-px);top:calc(var(--lb-pt)*.38);display:flex;justify-content:space-between;
  font-family:var(--f-sc);font-size:12px;letter-spacing:.14em;color:#a3281f;pointer-events:none}
.lb-run .n{color:#8b8174;font-family:var(--f-ui);letter-spacing:0;font-variant-numeric:tabular-nums}
.lb-flow{height:100%;column-fill:auto;font-family:var(--f-text);font-size:var(--fs);line-height:1.5;color:#1d1813;
  orphans:2;widows:2;will-change:transform}
.lb-flow > :first-child{margin-top:0}
.lb-flow .lb-portada{break-after:column;text-align:center;padding-top:22%}
.lb-flow .lb-portada .eyebrow{font-family:var(--f-sc);letter-spacing:.14em;color:#a3281f;font-size:calc(var(--fs)*.7)}
.lb-flow .lb-portada h1{font-family:var(--f-text);font-weight:500;font-size:calc(var(--fs)*1.6);line-height:1.2;margin:.6em 0 .4em}
.lb-flow .lb-portada .orn{color:#a3281f;font-size:calc(var(--fs)*1.2);margin-top:.6em}
.lb-flow h2.sec{font-family:var(--f-sc);font-size:calc(var(--fs)*.82);letter-spacing:.14em;color:#a3281f;font-weight:700;margin:1.6em 0 .5em;break-after:avoid;text-align:center}
.lb-flow .rub,.lb-flow .rub-in{color:#a3281f;font-family:var(--f-text);font-style:italic}
.lb-flow p.rub{font-size:calc(var(--fs)*.8);line-height:1.38;margin:.7em 0 .4em}
.lb-flow .alt-t{display:none}
.lb-flow .rub-in{font-size:.84em}
.lb-flow .lbl-t{display:block;font-family:var(--f-sc);font-size:calc(var(--fs)*.6);letter-spacing:.12em;color:#8b8174;margin:1.1em 0 .15em;break-after:avoid}
.lb-flow p.s{margin:.2em 0 .5em;padding:1px 5px;margin-left:-5px;border-radius:5px;transition:background .4s}
.lb-flow p.s.now{background:rgba(205,139,117,.22)}
.lb-flow .vr{color:#a3281f;font-weight:700;margin-right:.3em}
.lb-flow .r{font-weight:700}
.lb-flow .cita{color:#6d645a;font-style:italic}
.lb-flow .missing{font-family:var(--f-ui);font-size:15px;color:#8b8174;border:1px dashed #cfc7b8;border-radius:8px;padding:8px 10px;margin:.3em 0 .8em}
.lb-flow .missing button{display:none}
.lb-flow .end{font-family:var(--f-sc);letter-spacing:.14em;color:#a3281f;text-align:center;margin:2.2em 0 0}
.lb-leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;z-index:3;display:none}
.lb-leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fbf8f1;border-radius:2px 6px 6px 2px;overflow:hidden}
.lb-leaf .back{transform:rotateY(180deg);background:linear-gradient(to left,#f6f1e7,#e9e2d4)}
.lb-leaf .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to left,rgba(0,0,0,.18),rgba(0,0,0,0) 55%);opacity:0}
.lb-cast{position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(to right,rgba(0,0,0,.22),rgba(0,0,0,0) 70%);opacity:0}
.lb-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
.lb-bar .grp{display:flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:5px}
.lb-bar .lb-nav{width:56px}
.lb-flow h2.sec.nueva{break-before:column;margin-top:0}
.lb-orn{display:flex;align-items:center;justify-content:center;margin:0;padding:0;break-inside:avoid}
.lb-orn img{display:block;max-width:100%;max-height:100%;opacity:.92}
#libro.lb-full{padding:0}
#libro.lb-full .lb-top{display:none}
#libro.lb-full .lb-stage{padding:0}
#libro.lb-full .lb-page{width:100%;border-radius:0;box-shadow:none}
#libro.lb-full .lb-page::before,#libro.lb-full .lb-leaf .face{border-radius:0}
#libro.lb-full .lb-bar{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:8;padding:0 8px;opacity:.45;transition:opacity .3s}
#libro.lb-full .lb-bar:hover,#libro.lb-full .lb-bar:focus-within,#libro.lb-full .lb-bar.vis{opacity:1}
#libro.lb-full .lb-bar .grp{background:rgba(32,29,24,.55);border-color:rgba(55,49,43,.6)}
#libro.lb-full .lb-hear{bottom:76px}
.lb-hear{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:5;max-width:min(86%,460px);font:14px var(--f-ui);color:var(--fg2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-hear b{color:var(--acc2);font-weight:500}
@media (max-width:560px){.lb-stage{padding:6px 14px 14px 8px}.lb-bar{gap:5px;padding:0 6px 10px}.lb-bar .grp{gap:4px;padding:4px}.lb-bar .lb-nav{width:46px}.lb-ic{width:40px;height:42px}#lb-lento,#lb-rapido{display:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>
<body>
<header class="top">
  <a class="logo-btn" href="https://javierscervera-rgb.github.io/Herramientas/herramientas.html" target="_self" aria-label="Volver a Herramientas">
    <img class="logo" src="logo.svg" alt="Herramientas" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'Herramientas',className:'brand-fb'}))">
  </a>
  <span class="brand">Compositor de la Misa</span>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="componer" aria-selected="true">Componer</button>

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
let LIB = store.get("misa.lib", {});
/* Leccionario: se guarda en IndexedDB (cabe mucho más que en localStorage) */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try{ const r = indexedDB.open("misa", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch(e){ rej(e); }
  }));
  return {
    async get(k){ try{ const db = await open(); return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }catch(e){ return undefined; } },
    async set(k, v){ try{ const db = await open(); await new Promise((res, rej) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; }catch(e){ return false; } }
  };
})();

/* Calendario: semana del tiempo ordinario para una fecha */
function pascuaDe(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
    h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mes - 1, dia);

/* ---------- Calendario: la misa de cada día (España) ---------- */

function misaDelDia(d0){

    tiempo = "Pascua";

    else if(k === 49) temp = fidC("Domingo de Pentecostés: Misa del día");

  const privilegiado = T && (["Semana Santa", "Triduo pascual"].includes(T.g) || /octava de Pascua|Miércoles de Ceniza|Ferias mayores/.test(T.c) || (T.r === "Domingo" && ["Adviento","Cuaresma","Pascua"].includes(T.g)) || T.r === "Solemnidad");
  const san = santosDe(d).filter(f => !/vigilia/.test(f.c));
  const solemne = san.find(f => f.r === "Solemnidad"), fiesta = san.find(f => f.r === "Fiesta"), memoria = san.find(f => f.r === "Memoria obligatoria");

  let elegido = null;
  if(solemne && !(T && (T.r === "Solemnidad" || (privilegiado && T.r !== "Domingo") || (T.r === "Domingo" && ["Adviento","Cuaresma","Pascua"].includes(T.g)) || ["Semana Santa","Triduo pascual"].includes(T.g)))) elegido = solemne;
  else if(fiesta && !privilegiado && (!dom || (T && T.g === "Tiempo ordinario" && delSenor(fiesta)) || navidad)) elegido = fiesta;

/* ---------- Reglas ---------- */
function commKey(f){
  const c = f.c;
  if(/Natividad del Señor|octava|Sagrada Familia|Madre de Dios/.test(c) && f.g === "Navidad") return "navidad";
  if(/Epifanía del Señor/.test(c)) return "epifania";
  if(f.e === "jueves") return "jueves";
  if(f.e === "vigilia" || /Pascua de la Resurrección|octava de Pascua|Domingo II de Pascua/.test(c)) return "pascua";
  if(/Ascensión del Señor/.test(c)) return "ascension";
  if(/Pentecostés/.test(c)) return "pentecostes";
  if(f.r === "Domingo") return "domingo";
  return "";
}
function intAuto(f){
  if(f.e === "vigilia") return "pascua";
  if(/bautismo/.test(f.c)) return "bautismo";
  if(/confirmación/.test(f.c)) return "confirmacion";
  if(f.g === "Matrimonio") return "matrimonio";
  if(f.s === "Misas de difuntos" || /fieles difuntos/.test(f.c)) return "difuntos";

  priv:{label:"Oración privada antes de comulgar", get:() => S.priv, set:v => S.priv = v, opts:() => ["1","2"].map(n => ({val:n, title:`Oración ${n}`, k:`ord.priv${n}`}))},
  bend:{label:"Bendición", get:() => S.bend, set:v => { S.bend = v; if(v === "pueblo" && FM[S.fid].x.some(x => x[0] === "pueblo")) S.puebloN = "propia"; },
    opts:() => [{val:"simple", title:"Bendición simple", k:"ord.bendicion"}, {val:"solemne", title:"Bendición solemne", k:`bend.sol.${S.bendN}`},
      {val:"pueblo", title:"Oración sobre el pueblo", k: S.puebloN === "propia" ? `prop.${S.fid}.pueblo` : `bend.pueblo.${S.puebloN}`}]},

};
function altTxt(txt, id){

}
function inicioDe(k, v){
  let s = LIB[k]; if(!s || !s.trim()) return "";
  if(v !== undefined) s = elegirVariante(s, v);
  const p = s.split(/\n\s*\n/).find(x => !/^\s*\*/.test(x)) || "";
  const t = p.replace(/^(℟\.|℣\.|R\.|V\.)\s*/gm, "").replace(/\s+/g, " ").trim();
  return t.length > 130 ? t.slice(0, 127).replace(/\s+\S*$/, "") + "…" : t;
}
function carHTML(id){

/* Desplazamiento horizontal: al soltar, queda elegida la opción centrada */
function centrada(track){
  const kids = [...track.children], r = track.getBoundingClientRect(), c = r.left + r.width / 2;
  let best = 0, d = Infinity;
  kids.forEach((k, i) => { const b = k.getBoundingClientRect(), dd = Math.abs(b.left + b.width / 2 - c); if(dd < d){ d = dd; best = i; } });
  return best;
}
function iniciarCarruseles(root, alElegir){
  root.querySelectorAll(".car-track, .alt-track").forEach(track => {
    const kids = [...track.children], on = kids.findIndex(k => k.classList.contains("on"));
    if(on > 0) track.scrollLeft = kids[on].offsetLeft - (track.clientWidth - kids[on].offsetWidth) / 2 - kids[0].offsetLeft;
    if(track.classList.contains("alt-track") && on >= 0) track.style.height = kids[on].offsetHeight + "px";
    const dots = track.parentElement.querySelectorAll(".dot-b");
    let tmo;
    track.addEventListener("scroll", () => {
      const i = centrada(track);
      dots.forEach((d, j) => d.classList.toggle("on", j === i));
      if(track.classList.contains("alt-track")) track.style.height = Math.max(kids[i].offsetHeight, 40) + "px";
      clearTimeout(tmo);
      tmo = setTimeout(() => {
        const k = kids[centrada(track)];
        if(k && !k.classList.contains("on") && !k.disabled) alElegir(track.parentElement.dataset.car, k.dataset.val);
      }, 180);
    }, {passive: true});
    dots.forEach((d, j) => d.addEventListener("click", () => kids[j].scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"})));
  });
}
function elegirOpcion(id, val){
  if(id.startsWith("lec:")){ const L = S.lect[+id.slice(4)]; if(L) L.sel = +val; saveS(); return; }
  OPC[id].set(val); saveS();
}
function opcDe(id){
  if(!id.startsWith("lec:")) return OPC[id];
  const L = S.lect[+id.slice(4)];
  return {label: L.n, get: () => String(L.sel || 0), set: v => L.sel = +v,
    opts: () => L.alts.map((a, i) => ({val: String(i), title: (a.nom || `Opción ${i+1}`) + (a.cita ? ` · ${a.cita}` : ""), ini: inicioTxt(textoLec(a, "evangelio"))}))};
}
function inicioTxt(s){
  const p = (s || "").split(/\n\s*\n/).find(x => !/^\s*\*/.test(x) && !/^(Lectura|Comienzo|Principio|Pasión)\b/.test(x)) || "";
  const t = p.replace(/^(℟\.|℣\.|R\.|V\.)\s*/gm, "").replace(/\s+/g, " ").trim();
  return t.length > 130 ? t.slice(0, 127).replace(/\s+\S*$/, "") + "…" : t;
}
/* Texto que se proclama: sin el anuncio ni la conclusión que ya da el Ordinario */
function textoLec(a, modo){
  let t = (a.txt || "").trim();
  if(modo === "lectura") t = t.replace(/\n*\s*Palabra de Dios\.?\s*$/, "");
  if(modo === "evangelio") t = t.replace(/^(Lectura|Comienzo|Conclusión|Final) del santo Evangelio según[^\n]*\n*/, "").replace(/\n*\s*Palabra del Señor\.?\s*$/, "");
  return t.trim();
}
function anuncioEv(L){
  const m = (lecCur(L).txt || "").match(/^((Lectura|Comienzo|Conclusión|Final) del santo Evangelio según [^\n]+?)\.?\s*$/m);
  return m ? m[1] + "." : "";
}

/* ---------- Orden de la celebración ---------- */
const esMat = f => f.g === "Matrimonio";
const esUnc = f => f.g === "Unción y viático" && /unción/.test(f.c);
const esVia = f => f.g === "Unción y viático" && /viático/.test(f.c);
const ritoKey = f => esMat(f) ? "rito.matrimonio" : esUnc(f) ? "rito.uncion" : esVia(f) ? "rito.viatico" : "rito.ritual";
const ritoBend = f => esMat(f) ? "rito.matrimonio.bendicion" : esUnc(f) ? "rito.uncion.bendicion" : esVia(f) ? "rito.viatico.bendicion" : "";
function buildOrder(){
  const R = reglas(), f = R.f, B = [];
  const sec = t => B.push({t:"sec", x:t});
  const rub = x => B.push({t:"rub", x});
  const txt = (k, l, o = {}) => B.push({t:"txt", k, l: l === undefined || l === null ? labelOf(k) : l, ...o});
  const AMEN = ["colecta","ofrendas","postcomunion","pueblo"];
  const prop = (tipo, l) => { if(f.x.some(x => x[0] === tipo)) txt(`prop.${f.id}.${tipo}`, l || TIPOS[tipo], {amen: AMEN.includes(tipo)}); };
  const sal = () => "ord.saludo" + (["1","2","3"].includes(S.saludo) ? S.saludo : "1");
  const lect = (L, modo) => B.push({t:"lec", L, modo: modo || ""});

  if(f.e === "viernes") return viernes(f, B, sec, rub, txt, prop, lect);

  /* Ritos iniciales */
  if(f.e === "vigilia"){
    sec("Lucernario");
    rub("Se apagan las luces de la iglesia. Fuera, se prepara una hoguera. El pueblo se reúne y el sacerdote saluda como de costumbre.");
    txt("rito.vig.mon"); txt("rito.vig.fuego");
    rub("Se prepara el cirio pascual: la cruz, las letras alfa y omega, las cifras del año y, si se desea, los cinco granos de incienso.");
    txt("rito.vig.cirio"); txt("rito.vig.luz");
    rub("En la procesión hacia el altar, al tercer «Luz de Cristo» se encienden las luces de la iglesia, excepto las del altar.");
    rub("Se inciensa el cirio y se canta el pregón pascual.");
    altTxt(txt, "pregon");
    sec("Liturgia de la Palabra");
    txt("rito.vig.mon_palabra");
  } else {
    sec("Ritos iniciales");
    if(f.e === "ramos"){
      rub(S.ramos === "procesion" ? "Primera forma, la procesión. Los fieles se reúnen en una iglesia menor u otro lugar fuera de la iglesia principal, con ramos en las manos." :
          S.ramos === "solemne" ? "Segunda forma, la entrada solemne. Los fieles se reúnen ante la puerta o dentro de la iglesia, con ramos." :
          "Tercera forma, la entrada simple. Se canta o se dice la antífona de entrada mientras el sacerdote va al altar.");
      if(S.ramos !== "simple"){
        txt("rito.ramos.ant"); rub("El sacerdote saluda al pueblo y hace una breve monición."); txt("rito.ramos.mon"); txt("rito.ramos.bend");
        rub("Rocía los ramos con agua bendita, sin decir nada. Después se proclama el evangelio de la entrada del Señor.");
        const ev = S.lect.find(l => l.entrada); if(ev) lect(ev);
        rub("Si parece oportuno, sigue una homilía breve."); txt("rito.ramos.inv");
        rub("Comienza la procesión hacia la iglesia donde se celebrará la misa, con cantos en honor de Cristo Rey."); txt("rito.ramos.cantos");
        rub("Al llegar al altar, el sacerdote lo venera y va a la sede. Se omiten los demás ritos iniciales y se dice la colecta.");
      } else { prop("entrada"); txt("ord.senal"); altTxt(txt, "saludo"); altTxt(txt, "ap_inv"); altTxt(txt, "ap"); txt("ord.absol"); if(S.ap !== "3") txt("ord.kyrie"); }
    } else if(f.e === "presentacion"){
      rub("Los fieles se reúnen fuera de la iglesia o en otro lugar adecuado, con las candelas sin encender. Mientras se encienden, se canta una antífona.");
      txt("ord.senal"); altTxt(txt, "saludo"); txt("rito.cand.mon"); txt("rito.cand.bend");
      rub("Rocía las candelas con agua bendita, sin decir nada, y recibe su candela."); txt("rito.cand.inv"); txt("rito.cand.ant");
      rub("Al llegar al altar, el sacerdote lo venera. Se omite el acto penitencial y se canta el Gloria.");
    } else if(esMat(f)){
      txt("rito.matrimonio.acogida");
      rub("Mientras, se canta el canto de entrada. Si no hay canto, se dice la antífona de entrada.");
      prop("entrada");
      txt("ord.senal"); altTxt(txt, "saludo");
      rub("El sacerdote se dirige a los novios y a los presentes con palabras breves. Se omite el acto penitencial y se dice el Gloria.");
    } else {
      rub("Reunido el pueblo, el sacerdote va al altar con los ministros mientras se canta el canto de entrada. Si no hay canto, se dice la antífona de entrada.");
      prop("entrada");
      rub("Llegado al altar, hace la reverencia debida y lo besa; si se usa incienso, lo inciensa. Luego va a la sede.");
      txt("ord.senal"); altTxt(txt, "saludo");
      rub("El sacerdote, el diácono u otro ministro puede introducir a los fieles en la misa del día con palabras muy breves.");
      if(f.e === "ceniza") rub("Se omite el acto penitencial, que se sustituye por la imposición de la ceniza.");
      else if(S.ap === "asp"){
        rub("Los domingos puede hacerse la bendición y aspersión del agua en lugar del acto penitencial.");
        txt("rito.asp.mon"); txt("rito.asp.bend");
        rub("El sacerdote rocía con el agua bendita a sí mismo, a los ministros y al pueblo, recorriendo la iglesia si conviene. Mientras, se canta.");
        txt("rito.asp.ant"); txt("rito.asp.or");
      } else {
        altTxt(txt, "ap_inv");
        rub("Se hace una breve pausa en silencio.");
        altTxt(txt, "ap"); txt("ord.absol");
        if(S.ap !== "3") txt("ord.kyrie");
      }
    }
    if(R.gloria && f.e !== "vigilia"){
      if(f.e === "jueves") rub("Mientras se canta el Gloria se tocan las campanas, que después callan hasta la Vigilia pascual.");
      else rub("Se canta o se dice el Gloria.");
      txt("ord.gloria");
    }
    rub("El sacerdote invita a orar y todos oran en silencio unos momentos. Después dice la oración colecta.");
    txt("ord.oremos_colecta");
    prop("colecta");
    sec("Liturgia de la Palabra");
  }

  /* Liturgia de la Palabra */
  palabra(f, R, rub, txt, prop, lect);

  /* Homilía e inserciones */
  rub("Homilía. Es obligatoria los domingos y fiestas de precepto; se recomienda en los demás días.");
  if(f.e === "ceniza"){
    sec("Bendición e imposición de la ceniza");
    rub("Después de la homilía, el sacerdote invita a orar y bendice la ceniza.");
    txt("rito.ceniza.bend");
    rub("Rocía la ceniza con agua bendita, sin decir nada, y la impone a los fieles con una de las fórmulas. Mientras, se canta.");
    txt("rito.ceniza.imp"); txt("rito.ceniza.ant");
    rub("Terminada la imposición, el sacerdote se lava las manos. Sigue la oración universal. No se dice Credo.");
  }
  if(f.e === "crismal"){
    sec("Renovación de las promesas sacerdotales");
    rub("Después de la homilía, el obispo dialoga con los presbíteros, que renuevan sus promesas.");
    txt("rito.crismal.promesas");
    rub("La bendición de los óleos puede hacerse en este momento o antes del final de la plegaria eucarística, según el Pontifical.");
    txt("rito.crismal.oleos");
  }
  if(f.e === "jueves"){
    sec("Lavatorio de los pies");
    rub("Después de la homilía, donde lo aconseje la utilidad pastoral, se hace el lavatorio de los pies. El sacerdote echa agua sobre los pies de cada uno y se los seca. Mientras, se cantan antífonas.");
    txt("rito.jueves.lavatorio");
    rub("Después se hace la oración universal. No se dice Credo.");
  }
  if(f.e === "ritual"){
    sec("Rito del sacramento");
    rub("Después de la homilía se celebra el rito propio, según el ritual correspondiente.");
    txt(ritoKey(f));
  }
  if(f.e === "vigilia"){
    sec("Liturgia bautismal");
    rub("El sacerdote va con los ministros a la fuente bautismal, o se coloca un recipiente con agua en el presbiterio.");
    txt("rito.vig.mon_baut");
    rub("Se cantan las letanías, que pueden ampliarse con los nombres de santos propios.");
    txt("rito.vig.letanias");
    txt("rito.vig.agua_baut");
    rub("Si no hay bautismos ni se bendice la fuente, se bendice el agua con la otra fórmula.");
    txt("rito.vig.agua");
    rub("Todos, con las velas encendidas, renuevan las promesas bautismales.");
    txt("rito.vig.promesas");
    rub("El sacerdote rocía al pueblo con el agua bendita, mientras se canta.");
    txt("rito.vig.asp");
  }
  if(R.credo && esVia(f)) rub("La profesión de fe del enfermo hace las veces del Credo.");
  else if(R.credo && !["ceniza","jueves"].includes(f.e)){
    rub("Se canta o se dice el símbolo. Todos se inclinan en las palabras sobre la Encarnación.");
    txt(S.simbolo === "apostoles" ? "ord.apostoles" : "ord.credo");
  }
  rub("Oración universal u oración de los fieles.");
  if(S.ou.trim()) B.push({t:"free", l:"Oración universal", x:S.ou});

  eucaristia(f, R, B, sec, rub, txt, prop);
  return B;
}

function palabra(f, R, rub, txt, prop, lect0){
  let primera = true;
  const ultimaOT = Math.max(0, ...S.lect.filter(x => x.or).map(x => x.or));
  S.lect.forEach(L => {
    if(L.entrada) return;
    const lect = (X, modo) => lect0(X, modo);
    if(L.t === "lectura"){
      rub(primera ? "El lector va al ambón y proclama la lectura; todos escuchan sentados." : "Sigue la lectura.");
      primera = false;
      lect(L, "lectura");
      txt("ord.palabra");
    } else if(L.t === "salmo"){
      if(f.e === "vigilia" && L.slot === "s:a la epístola"){
        rub("Acabada la epístola, todos se levantan y el sacerdote entona solemnemente el aleluya tres veces, elevando la voz cada vez. El pueblo lo repite.");
        txt("rito.vig.aleluya");
      }
      lect(L);
    } else if(L.t === "secuencia"){
      rub(L.opc ? "Se puede cantar la secuencia." : "Se canta la secuencia.");
      lect(L);
    } else if(L.t === "aclamacion"){
      rub("Todos se levantan y se canta el Aleluya o, en Cuaresma, la aclamación correspondiente.");
      lect(L);
    } else if(L.t === "evangelio"){
      if(f.e === "vigilia" && !S.lect.some(x => x.slot === "s:a la epístola")){
        rub("Después de la epístola, todos se levantan y el sacerdote entona solemnemente el aleluya tres veces, elevando la voz cada vez. El pueblo lo repite.");
        txt("rito.vig.aleluya");
      }
      if(f.e === "ramos" || f.e === "viernes"){
        rub("Se lee la Pasión del Señor sin cirios ni incienso, sin saludo y sin signar el libro.");
        lect(L);
      } else {
        rub("Mientras se pone incienso, si se usa, el diácono pide la bendición; si no hay diácono, el sacerdote, inclinado ante el altar, dice en secreto:");
        txt("ord.ev_secreta"); txt("ord.ev_dialogo", null, {sub: anuncioEv(L)});
        lect(L, "evangelio");
        txt("ord.ev_final");
      }
    }
    // oración tras las lecturas de la Vigilia (después del salmo correspondiente)
    if(L.t === "salmo"){
      const idx = S.lect.indexOf(L), prev = S.lect[idx-1];
      if(prev && (prev.or || prev.pent)) rub("Todos se levantan; el sacerdote invita a orar y, tras un momento de silencio, dice la oración.");
      if(prev && prev.or) txt(`rito.vig.or${prev.or}`);
      if(prev && prev.pent) txt(`rito.pent.or${prev.pent}`);
      if(f.e === "vigilia" && prev && prev.or && prev.or === ultimaOT){
        rub("Después de la última lectura del Antiguo Testamento, con su salmo y su oración, se encienden las velas del altar y se canta el Gloria, mientras se tocan las campanas.");
        txt("ord.gloria");
        rub("El sacerdote dice la oración colecta.");
        prop("colecta");
      }
    }
  });
}

function eucaristia(f, R, B, sec, rub, txt, prop){
  sec("Liturgia eucarística");
  rub("Comienza el canto del ofertorio. Los ministros preparan el altar; los fieles pueden presentar el pan y el vino.");

  txt("ord.ofr_pan");
  rub("El diácono, o el sacerdote, echa vino y un poco de agua en el cáliz, diciendo en secreto:");
  txt("ord.ofr_agua");
  rub("Toma el cáliz y, sosteniéndolo un poco elevado, dice:");
  txt("ord.ofr_vino");
  rub("Profundamente inclinado, dice en secreto:"); txt("ord.ofr_humilde");
  rub("Si se usa incienso, inciensa las ofrendas, la cruz y el altar. Después, de pie a un lado del altar, se lava las manos diciendo en secreto:");

  prop("ofrendas");

  sec("Plegaria eucarística");
  const pe = PEM[S.pe];
  rub(`Se usa la ${pe.n}.`);

    txt("ord.pref_dialogo");

    txt("ord.santo");
  }
  txt(`pe.${S.pe}.a`, pe.n);
  const ck = commKey(f);
  if(S.pe === "pe1" && ck){
    rub(ck === "domingo" ? "En los domingos, cuando no hay otro propio, el Communicantes puede decirse así:" : "En lugar del Communicantes ordinario se dice el propio del día:");
    txt("emb.comm." + ck);
  }
  const hk = hancKey(f);
  if(S.pe === "pe1" && hk){ rub("El Hanc igitur es propio:"); txt("emb.hanc." + hk); }
  rub("En el relato de la institución, las palabras del Señor se pronuncian con claridad. El sacerdote muestra al pueblo la hostia y luego el cáliz, y hace genuflexión después de cada uno.");
  txt(`pe.${S.pe}.b`, pe.n + ": relato de la institución");
  rub("Después dice:"); altTxt(txt, "aclam");
  segmentosPE(f).forEach(([k, l], i) => txt(k, i === 0 ? pe.n + ": hasta la doxología" : (l || ""), {cont: !l && i > 0}));
  rub("Toma la patena con la hostia y el cáliz y, elevándolos, dice:");
  txt("ord.doxologia");

  sec("Rito de la comunión");
  comunion(f, R, rub, txt, prop, true);
  if(f.e === "jueves"){
    sec("Traslado del Santísimo Sacramento");
    rub("Después de la oración después de la comunión, el sacerdote pone incienso y, arrodillado, inciensa el Santísimo. Con el velo humeral, lleva el copón en procesión al lugar de la reserva, mientras se canta.");
    txt("rito.jueves.traslado");
    rub("Se deja un tiempo de adoración en silencio. Después se desnuda el altar y se quitan las cruces de la iglesia o se cubren. No hay bendición ni despedida.");
    return;
  }
  sec("Rito de conclusión");
  rub("Si es necesario, se hacen breves avisos al pueblo.");
  txt("ord.saludo_final");
  if(ritoBend(f) && S.bend === "solemne"){
    rub(esMat(f) ? "El sacerdote bendice a los esposos y al pueblo; todos responden «Amén» a cada invocación." :
        "El sacerdote bendice al enfermo y a los presentes; todos responden «Amén» a cada invocación.");
    txt(ritoBend(f));
  } else if(S.bend === "solemne"){
    rub("El diácono, o el sacerdote, invita a inclinarse para recibir la bendición. El sacerdote, con las manos extendidas sobre el pueblo, dice la bendición solemne; todos responden «Amén» a cada invocación.");
    txt(`bend.sol.${S.bendN}`);

const NOMBRES = Object.assign({papa:"León", obispo:"José"}, store.get("misa.nombres", {}));
function conNombres(t){
  const p = (NOMBRES.papa || "").trim(), o = (NOMBRES.obispo || "").trim();
  if(p) t = t.replace(/\b(Papa|papa)\s+N\./g, `$1 ${p}`);
  if(o) t = t.replace(/\b(Obispo|obispo)\s+N\./g, `$1 ${o}`);
  return t;
}
function parseTexto(s){
  return s.trim().split(/\n\s*\n/).map(par => {
    const lines = par.split("\n").map(l => l.trimEnd()).filter(l => l.trim());
    let rubOnly = lines.every(l => /^\s*(\*|\[)/.test(l));
    const html = lines.map(l => {
      let m;
      if((m = l.match(/^\s*(?:\*|\[)(.*?)\]?\s*$/))) return `<span class="rub-in">${esc(m[1].trim())}</span>`;
      if((m = l.match(/^\s*(?:℟|R\.|R\/)\s*(.*)$/))) return `<span class="vr">℟.</span><span class="r">${esc(m[1])}</span>`;
      if((m = l.match(/^\s*(?:℣|V\.|V\/)\s*(.*)$/))) return `<span class="vr">℣.</span>${esc(m[1])}`;
      return esc(l);
    }).join("<br>");
    return {html, plain: rubOnly ? "" : lines.join(" ")};
  });
}

function hacerSegs(root){
  return [...root.querySelectorAll("p.s")].filter(el => !el.closest(".alt-slide:not(.on)")).map(el => {
    const w = normWords(el.dataset.plain || "");
    const bi = new Map();
    for(let i=0;i<w.length-1;i++){ const k = w[i]+" "+w[i+1]; if(!bi.has(k)) bi.set(k, []); bi.get(k).push(i); }
    return {el, w, bi};
  }).filter(s => s.w.length);
}

let libGrupo = "Ordinario de la misa", libKey = "", libFiltro = "", libConfirm = false, lecConfirm = false;
function libItems(){
  if(libGrupo === "Propio de la misa actual"){
    const f = FM[S.fid];
    return f.x.map(([t,o]) => ({k:`prop.${f.id}.${t}`, l:`${TIPOS[t]}${o !== "Propio" ? " (" + o.toLowerCase() + ")" : ""}`}));
  }
  if(libGrupo === "Lo que falta en esta misa") return faltantes().faltan.map(k => ({k, l:labelOf(k)}));
  if(libGrupo === "Oración de los fieles"){
    const q = libFiltro.toLowerCase();
    return Object.keys(LIB).filter(k => k.startsWith("ou.")).map(k => {
      const p = k.split("."), f = FM[p[1]];
      return {k, l: ouTitulo(k) + (p[2] && p[2] !== "T" && f ? ` · año ${p[2]}` : "")};
    }).filter(x => !q || x.l.toLowerCase().includes(q)).sort((a,b) => a.l.localeCompare(b.l, "es"));
  }
  if(libGrupo === "Propio de otra celebración"){
    const q = libFiltro.toLowerCase();
    const fs = q ? F.filter(f => f.c.toLowerCase().includes(q)).slice(0, 25) : [];
    return fs.flatMap(f => f.x.map(([t]) => ({k:`prop.${f.id}.${t}`, l:`${f.c} · ${TIPOS[t]}`})));
  }
  const q = libFiltro.toLowerCase();
  return CAT.filter(x => x.g === libGrupo && (!q || x.l.toLowerCase().includes(q))).map(x => ({k:x.k, l:x.l}));
}

  ["componer","celebrar","biblioteca"].forEach(x => $("#v-" + x).hidden = x !== v);

  if(v === "componer") renderComponer();
  if(v === "celebrar"){ renderCelebrar(); pedirWakeLock(); }

function toast(t){ const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }

/* Eventos de Componer */
const vc = $("#v-componer");
vc.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.classList.contains("car-card")){
    if(!b.classList.contains("on")){ elegirOpcion(b.dataset.car, b.dataset.val); renderComponer(); }
    else b.scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"});
    return;
  }
  if(b.classList.contains("dot-b")) return;
  if(b.dataset.set){
    const k = b.dataset.set, v = b.dataset.val;
    if(k === "gloria" || k === "credo") S[k] = v === "auto" ? null : v === "true";
    else if(["ninos","pentExt","recProp"].includes(k)) S[k] = v === "true";
    else if(k.startsWith("var.")) S.var[k.slice(4)] = +v;
    else if(k === "vesp") S.vespertina = v === "true";
    else if(k === "apModo"){ if(v === "asp"){ if(S.ap !== "asp") S.apF = S.ap; S.ap = "asp"; } else S.ap = S.apF || "1"; }
    else if(k === "vigN") S[k] = +v;
    else S[k] = v;
    if(["vigN","pentExt","ciclo","lecModo"].includes(k)) rehacerLecturas();
    if(k === "ciclo") ouAuto();
    if(k === "bend" && v === "pueblo" && FM[S.fid].x.some(x => x[0] === "pueblo")) S.puebloN = "propia";
    renderComponer(); return;
  }
  if(b.dataset.dellect !== undefined){ S.lect.splice(+b.dataset.dellect, 1); renderComponer(); return; }
  if(b.dataset.addlect){ const ai = S.lect.findIndex(l => l.t === "aclamacion"); S.lect.splice(ai < 0 ? S.lect.length : ai, 0, {t:b.dataset.addlect, cita:"", txt:"", n: b.dataset.addlect === "lectura" ? "Lectura" : ""}); renderComponer(); return; }
  if(b.id === "reset-lect"){ S.lect = []; rehacerLecturas(); if(!S.lectSrc) S.lect.forEach(l => { l.cita = ""; l.txt = ""; }); renderComponer(); return; }
  if(b.id === "go-celebrar"){ mostrar("celebrar"); return; }
  if(b.id === "c-hoy"){ const h = fechaInicial(); aplicarDia(h.fecha, h.vespertina); return; }
  if(b.id === "to-hoy"){ const h = semanaTO(); if(h){ S.toSem = h.sem; S.toDia = h.dia; S.toAnyo = h.anyo; rehacerLecturas(); renderComponer(); } return; }
  if(b.id === "ver-faltan"){ libGrupo = "Lo que falta en esta misa"; libKey = ""; mostrar("biblioteca"); return; }
  if(b.id === "g-guardar"){
    const nombre = $("#g-nombre").value.trim() || FM[S.fid].c;
    const g = store.get("misa.guardadas", []); g.unshift({nombre, S: JSON.parse(JSON.stringify(S))});
    store.set("misa.guardadas", g); toast("Misa guardada"); renderComponer(); return;
  }
  if(b.id === "g-cargar"){ const g = store.get("misa.guardadas", [])[+$("#g-lista").value]; if(g){ S = Object.assign({}, DEF, g.S); toast("Misa cargada"); renderComponer(); } return; }
  if(b.id === "g-borrar"){ const g = store.get("misa.guardadas", []); g.splice(+$("#g-lista").value, 1); store.set("misa.guardadas", g); renderComponer(); return; }
});
vc.addEventListener("change", e => {

  else if(t.id === "c-grp"){ const x = F.find(f => f.s === FM[S.fid].s && f.g === t.value); cambiarCel(x.id); }
  else if(t.id === "c-cel") cambiarCel(t.value);
  else if(t.id === "c-pe"){ S.pe = t.value; S.pref = ""; renderComponer(); }
  else if(t.id === "c-intc"){ S.intc = t.value === "auto" ? null : t.value; renderComponer(); }
  else if(t.id === "c-ouk"){ S.ouKey = t.value; S.ou = t.value ? ouCuerpo(t.value) : ""; renderComponer(); }

  else if(t.id === "c-bsol"){ S.bendN = +t.value; saveS(); }

vc.addEventListener("input", e => {

function cambiarCel(id, opt = {}){
  S.fid = id; S.gloria = null; S.credo = null; S.pref = ""; S.intc = null; S.recProp = true;
  const f = FM[id];
  S.bend = f.x.some(x => x[0] === "pueblo") && f.g === "Cuaresma" && f.r !== "Domingo" ? "pueblo" : "simple";
  if(S.bend === "pueblo") S.puebloN = "propia";
  S.bendN = bendSugerida(f);
  if(ritoBend(f)) S.bend = "solemne";
  if(f.e === "jueves") S.pe = "pe1";
  if(S.ap === "asp" && f.r !== "Domingo" && f.r !== "Solemnidad") S.ap = "1";
  modoLecturasAuto(f, opt.dia);
  rehacerLecturas(); ouAuto(); if(!opt.noRender) renderComponer();
}
/* Elige de dónde salen las lecturas al cambiar de celebración */
function modoLecturasAuto(f, dia){
  S.lecModo = "propio";
  if(dia && dia.lec){ S.lecModo = dia.lec.modo; S.lecOtra = dia.lec.clave; return; }
  if(dia && dia.to && !dia.santo){ S.lecModo = "feria"; S.toSem = dia.to.sem; S.toDia = dia.to.dia; S.toAnyo = dia.to.anyo; return; }
  const hoy = semanaTO(fechaSel());
  const propias = LEC.lecturas[`${f.id}.${S.ciclo}`] || LEC.lecturas[`${f.id}.T`];
  const deFeria = propias && /Memoria/.test(f.r) && propias.some(x => (x.nota || []).some(n => /^Ordinariamente, lecturas de la feria/.test(n)));
  if(deFeria && hoy){ S.lecModo = "feria"; S.toSem = hoy.sem; S.toDia = hoy.dia; S.toAnyo = hoy.anyo; return; }
  if(propias) return;
  const ferial = (f.g === "Tiempo ordinario" && f.r !== "Domingo") || (f.s === "Propio de los santos" && /Memoria/.test(f.r)) || f.s === "Comunes" || f.s === "Misas votivas" || f.s === "Misas por diversas necesidades";
  if(ferial && hoy && S.diaDom !== true){ S.lecModo = "feria"; S.toSem = hoy.sem; S.toDia = hoy.dia; S.toAnyo = hoy.anyo; }
  else if(f.g === "Tiempo ordinario" && f.r !== "Domingo"){ S.lecModo = "feria"; }
}

    const hoy = semanaTO();
    h += `<div class="row" style="margin-bottom:12px">

      ${hoy ? `<button class="btn" id="to-hoy" type="button">Hoy: ${DIASN[hoy.dia]} ${ROMN[hoy.sem-1]}</button>` : ""}</div>`;
  }
  if(S.lecModo === "otra"){
    const ks = Object.keys(LEC.lecturas), grupos = {};
    const grupo = k => /^to\./.test(k) ? `Tiempo ordinario · año ${k.endsWith("impar") ? "impar" : "par"}` : /^F\d+\.T$/.test(k) ? `Ferias de ${(FM[k.split(".")[0]] || {}).g || "otros tiempos"}` : /^F\d+\./.test(k) ? `Domingos y solemnidades · año ${k.slice(-1)}` : "Otras";
    ks.forEach(k => (grupos[grupo(k)] = grupos[grupo(k)] || []).push(k));

      `<optgroup label="${esc(g)}">${grupos[g].sort((a, b) => orden(a) - orden(b)).map(k => `<option value="${esc(k)}" ${k === S.lecOtra ? "selected" : ""}>${esc(tituloLec(k))}</option>`).join("")}</optgroup>`).join("")}</select></div>`;

  return h;
}

/* ---------- Seguir la voz ---------- */
function normWords(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ\s]/g, " ").split(/\s+/).filter(Boolean);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, vozOn = false, vozIdx = 0, oidas = [];
if(!SR){ $("#lb-voz").disabled = true; $("#lb-voz").title = "Este navegador no reconoce la voz."; $("#b-voz").disabled = true; $("#b-voz").title = "Este navegador no reconoce la voz. Usa Chrome, Edge o Safari."; }
function mostrarOido(txt, estado){
  const h = LB.on ? $("#lb-hear") : $("#hear"); h.hidden = false;
  h.innerHTML = `<b>${esc(estado)}</b>${txt ? " · " + esc(txt) : ""}`;
}
function seguir(palabras){
  if(palabras.length < 3 || !SEGS.length) return;
  const bis = [];
  for(let i = Math.max(0, palabras.length - 12); i < palabras.length - 1; i++) bis.push(palabras[i] + " " + palabras[i+1]);
  let best = -1, bestScore = 0, bestPos = 0;
  const desde = Math.max(0, vozIdx - 2), hasta = Math.min(SEGS.length - 1, vozIdx + 30);
  for(let s = desde; s <= hasta; s++){
    const seg = SEGS[s]; let hits = 0, pos = -1;
    bis.forEach((b, j) => { const o = seg.bi.get(b); if(o){ hits += 1 + j / bis.length; pos = Math.max(pos, o[0] + 1); } });
    if(!hits) continue;
    const dist = s - vozIdx;
    const score = hits - (dist < 0 ? 0.6 * -dist : 0.04 * dist);
    if(score > bestScore){ bestScore = score; best = s; bestPos = pos; }
  }
  if(best < 0 || bestScore < 1.6) return;
  vozIdx = best;
  const seg = SEGS[best];
  SEGS.forEach((x, i) => x.el.classList.toggle("now", i === best));
  const frac = Math.min(1, bestPos / seg.w.length);
  if(LB.on){
    const pg = paginaDe(seg.el, frac);
    if(pg > LB.page) irA(pg);
    else if(pg === LB.page && !LB.busy && finDePagina(best, bestPos)) irA(LB.page + 1);
    if(frac > 0.85 && best + 1 < SEGS.length) vozIdx = best + (seg.w.length - bestPos < 3 ? 1 : 0);
    return;
  }
  const r = seg.el.getBoundingClientRect();
  const objetivo = scrollY + r.top + frac * r.height - innerHeight * 0.33;
  if(Math.abs(objetivo - scrollY) > 24) window.scrollTo({top: objetivo, behavior:"smooth"});
  // si se termina un párrafo, el siguiente pasa a ser el candidato principal
  if(frac > 0.85 && best + 1 < SEGS.length) vozIdx = best + (seg.w.length - bestPos < 3 ? 1 : 0);
}
function iniciarVoz(){
  rec = new SR(); rec.lang = "es-ES"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = ev => {
    let interim = "";
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const t = ev.results[i][0].transcript;
      if(ev.results[i].isFinal) oidas = oidas.concat(normWords(t)).slice(-40); else interim += " " + t;
    }
    const todo = oidas.concat(normWords(interim)).slice(-16);
    mostrarOido(todo.slice(-8).join(" "), "Escuchando");
    seguir(todo);
  };
  rec.onerror = ev => {
    if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){ pararVoz(); mostrarOido("", "Sin permiso para usar el micrófono. Actívalo en el navegador."); }
  };
  rec.onend = () => { if(vozOn) setTimeout(() => { try{ rec.start(); }catch(e){} }, 200); };
  try{ rec.start(); }catch(e){}
}
function pararVoz(){
  vozOn = false; $("#b-voz").setAttribute("aria-pressed", "false"); $("#lb-voz").setAttribute("aria-pressed", "false"); $("#lb-hear").hidden = true;
  if(rec){ try{ rec.onend = null; rec.stop(); }catch(e){} rec = null; }
  const h = $("#hear"); if(h && !/permiso/.test(h.textContent)) h.hidden = true;
}
$("#b-voz").onclick = () => {
  if(vozOn){ pararVoz(); return; }
  if(autoOn) pararAuto();
  // Empieza a buscar desde lo que está en pantalla
  const top = scrollY + innerHeight * 0.2;
  vozIdx = Math.max(0, SEGS.findIndex(s => s.el.getBoundingClientRect().top + scrollY >= top));
  vozOn = true; oidas = []; $("#b-voz").setAttribute("aria-pressed", "true");
  mostrarOido("", "Escuchando…"); iniciarVoz(); pedirWakeLock();
};


/* ---------- Vista libro ---------- */
const LB = {on:false, page:0, n:1, W:0, G:0, busy:false, secs:[], auto:false, autoT:null, seg:store.get("misa.lbseg", 45)};
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
function contenidoLibro(){
  const f = FM[S.fid], src = $("#lectura"); if(!src) return "";

function medidas(){
  const pg = $("#lb-page"), w = pg.clientWidth, h = pg.clientHeight;
  const px = Math.round(Math.max(22, Math.min(64, w * 0.075))), pt = Math.round(Math.max(36, Math.min(70, h * 0.075))), pb = Math.round(Math.max(28, Math.min(56, h * 0.06)));
  const full = $("#libro").classList.contains("lb-full");
  const pb2 = full ? Math.max(pb, $(".lb-bar").offsetHeight + 22) : pb, pt2 = full ? Math.max(pt, 44) : pt;
  pg.style.setProperty("--lb-pb", pb2 + "px"); pg.style.setProperty("--lb-pt", pt2 + "px");
  pg.style.setProperty("--lb-px", px + "px");
}
function paginar(ancla){
  const fl = $("#lb-flow"), vp = $("#lb-vp");
  medidas();
  LB.W = vp.clientWidth; LB.G = Math.round(LB.W * 0.12) + 40;
  for(const e of [fl, $("#lb-flow2")]){ e.style.width = LB.W + "px"; e.style.columnWidth = LB.W + "px"; e.style.columnGap = LB.G + "px"; }
  fl.style.transform = "none";
  fl.querySelectorAll(".lb-orn").forEach(e => e.remove());
  rellenarHuecos(fl);
  const base = fl.getBoundingClientRect().left;
  let maxR = 0; for(const el of fl.children){ for(const r of el.getClientRects()) maxR = Math.max(maxR, r.right - base); }
  LB.n = Math.max(1, Math.round((maxR + LB.G) / (LB.W + LB.G)));
  LB.secs = [...fl.querySelectorAll("h2.sec")].map(h => ({t: h.textContent, p: Math.round((h.getBoundingClientRect().left - base) / (LB.W + LB.G))}));
  $("#lb-flow2").innerHTML = fl.innerHTML;
  LB.page = Math.min(LB.n - 1, ancla ? paginaDe(ancla, 0) : LB.page);
  pintar();
}
const ORN_SEC = {"liturgia de la palabra":"ihs","liturgia eucaristica":"virgen","plegaria eucaristica":"cruz","rito de la comunion":"altar","rito de conclusion":"ihs"};
function rellenarHuecos(fl){
  const H = $("#lb-vp").clientHeight, fr = fl.getBoundingClientRect(), paso = LB.W + LB.G;
  const pagina = x => Math.round((x - fr.left) / paso);
  // fondo ocupado por página
  const fondo = {};
  for(const el of fl.querySelectorAll("p, h1, h2, span.lbl-t, div.missing, div.end, div.lb-portada, li")){
    for(const r of el.getClientRects()){ if(!r.height) continue; const p = pagina(r.left); fondo[p] = Math.max(fondo[p] || 0, r.bottom - fr.top); }
  }
  const huecos = [];
  for(const h of fl.querySelectorAll("h2.sec.nueva")){
    const r = h.getClientRects()[0]; if(!r) continue;
    const p = pagina(r.left) - 1; if(p < 1 || fondo[p] === undefined) continue;
    const libre = H - fondo[p] - 18; if(libre < 90) continue;
    const k = h.textContent.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    huecos.push({h, libre, k: ORN_SEC[k] || "ihs"});
  }
  for(const {h, libre, k} of huecos){
    let im = ORN[k];
    if(!im) continue;
    // si el dibujo no cabe al 60 % del ancho, prueba con el más apaisado
    if(LB.W * 0.6 * im.r > libre && ORN.ihs) im = ORN.ihs;
    const w = Math.min(LB.W * 0.92, libre / im.r), alto = Math.min(libre, w * im.r);
    if(w < LB.W * 0.4) continue;
    const fig = document.createElement("figure"); fig.className = "lb-orn"; fig.setAttribute("aria-hidden", "true");
    fig.style.height = Math.floor(libre) + "px";
    fig.innerHTML = `<img src="${im.src}" alt="" style="width:${Math.floor(w)}px;height:${Math.floor(alto)}px">`;
    h.before(fig);
  }
}
function paginaDe(el, frac){
  const fl = $("#lb-flow"), rs = [...el.getClientRects()]; if(!rs.length) return LB.page;
  const base = fl.getBoundingClientRect().left;
  const r = rs[Math.min(rs.length - 1, Math.floor((frac || 0) * rs.length))];
  return Math.max(0, Math.min(LB.n - 1, Math.round((r.left - base) / (LB.W + LB.G))));
}
// ¿se ha leído el final del último párrafo en negro de la página actual?
function finDePagina(i, pos){
  const fl = $("#lb-flow"), base = fl.getBoundingClientRect().left, paso = LB.W + LB.G;
  const pag = el => [...el.getClientRects()].filter(r => r.height).map(r => ({p: Math.round((r.left - base) / paso), h: r.height}));
  for(let j = i + 1; j < SEGS.length; j++){ const rs = pag(SEGS[j].el); if(!rs.length) continue; if(rs[0].p <= LB.page) return false; break; }
  const rs = pag(SEGS[i].el), tot = rs.reduce((a, r) => a + r.h, 0); if(!tot) return false;
  const aqui = rs.filter(r => r.p <= LB.page).reduce((a, r) => a + r.h, 0) / tot;
  if(aqui >= 0.999 && SEGS[i].w.length - pos <= 2) return LB.page < LB.n - 1;
  return aqui < 0.999 && aqui * SEGS[i].w.length - pos <= 1.5;
}
const posX = p => `translateX(${-p * (LB.W + LB.G)}px)`;
function pintar(){

  $("#lb-pn").textContent = LB.page ? LB.page + 1 : "";

}
function anclaActual(){
  const fl = $("#lb-flow"), base = fl.getBoundingClientRect().left, x0 = base + LB.page * (LB.W + LB.G);
  for(const el of fl.querySelectorAll("p.s, p.rub, h2.sec, .lbl-t")){

  }

}
function irA(p){

const siguiente = () => irA(LB.page + 1), anterior = () => irA(LB.page - 1);

function pararAutoLibro(){ LB.auto = false; clearInterval(LB.autoT); LB.autoT = null; $("#lb-auto").setAttribute("aria-pressed", "false"); }
function pantallaCompleta(on){
  const lb = $("#libro"), a = anclaActual();
  lb.classList.toggle("lb-full", on); $("#lb-full").setAttribute("aria-pressed", String(on));
  try{
    if(on && !document.fullscreenElement && lb.requestFullscreen) lb.requestFullscreen().catch(() => {});
    else if(!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }catch(e){}
  requestAnimationFrame(() => paginar(a));
}
$("#lb-full").onclick = () => pantallaCompleta(!$("#libro").classList.contains("lb-full"));
document.addEventListener("fullscreenchange", () => { if(!document.fullscreenElement && $("#libro").classList.contains("lb-full")) pantallaCompleta(false); });

$("#lb-auto").onclick = () => {
  if(LB.auto){ pararAutoLibro(); return; }

  LB.auto = true; $("#lb-auto").setAttribute("aria-pressed", "true");
  LB.autoT = setInterval(() => { if(LB.page >= LB.n - 1) pararAutoLibro(); else siguiente(); }, LB.seg * 1000);
  toast(`Página cada ${LB.seg} s`);
};
const ritmo = d => { LB.seg = Math.max(10, Math.min(180, LB.seg + d)); store.set("misa.lbseg", LB.seg); toast(`Página cada ${LB.seg} s`); if(LB.auto){ pararAutoLibro(); $("#lb-auto").onclick(); } };
$("#lb-lento").onclick = () => ritmo(5); $("#lb-rapido").onclick = () => ritmo(-5);
document.addEventListener("keydown", e => {
  if(!LB.on) return;
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ e.preventDefault(); siguiente(); }
  else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ e.preventDefault(); anterior(); }
  else if(e.key === "Escape"){ if($("#libro").classList.contains("lb-full")) pantallaCompleta(false); else cerrarLibro(); }
});
{
  const st = $("#lb-stage"); let x0 = null, y0 = 0, t0 = 0;
  st.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; t0 = Date.now(); });
  st.addEventListener("pointerup", e => {

      else if($("#libro").classList.contains("lb-full")){ const bar = $(".lb-bar"); bar.classList.add("vis"); clearTimeout(bar._t); bar._t = setTimeout(() => bar.classList.remove("vis"), 3000); }
    }
