<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tierra Santa · Ministerio de Jesús</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script>if (/[?&](lugar|pasaje|modo)=/.test(location.search)) document.documentElement.classList.add('embed');</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #171310;        /* fondo principal */
    --panel: #201D18;     /* tarjetas y paneles */
    --btn: #292420;       /* botones secundarios */
    --text: #F0E8DC;      /* texto principal */
    --muted: #AA9D8F;     /* texto secundario */
    --line: #37312B;      /* bordes */
    --accent: #CD8B75;    /* acento */
    --accent2: #D88972;   /* títulos y botones activos */
    --hover: #292420;
    --active: rgba(205, 139, 117, .18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
  .app { display: flex; flex-direction: column; height: 100%; }

  /* Barra superior con el logo */
  .top { flex: none; display: flex; align-items: center; gap: 12px; padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top, 0px));
    background: var(--panel); border-bottom: 1px solid var(--line); }
  .logolink { display: block; border-radius: 10px; line-height: 0; }
  .logolink:hover, .logolink:focus-visible { background: var(--btn); outline: none; }
  .logo { display: block; height: clamp(32px, 5vw, 48px); width: auto; max-width: 200px; }

  /* Brillo del logo al cargar: una sola vez, a los 0,5 s, dura 1,8 s */
  a:has(> .logo) { position: relative; }
  a > .logo { position: relative; z-index: 1; }
  a:has(> .logo)::before {
    content: ""; position: absolute; inset: -16px; border-radius: 50%;
    background: radial-gradient(circle, rgba(216,137,114,.75) 0%,
      rgba(216,137,114,.3) 42%, rgba(216,137,114,0) 70%);
    opacity: 0; pointer-events: none;
    animation: brillo-logo 1.8s ease-in-out .5s 1 both;
  }
  @keyframes brillo-logo {
    0%   { opacity: 0; transform: scale(.6); }
    45%  { opacity: 1; transform: scale(1.1); }
    100% { opacity: 0; transform: scale(1.3); }
  }
  @media (prefers-reduced-motion: reduce) { a:has(> .logo)::before { animation: none; } }
  .titulo { font-size: 16px; font-weight: 700; color: var(--accent2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .cols { display: flex; flex: 1; min-height: 0; }
  aside { width: 280px; min-width: 260px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  aside.oculto { display: none; }
  .cab { display: flex; align-items: center; justify-content: space-between; padding-right: 12px; }
  aside h1 { font-size: 18px; padding: 14px 16px 8px; color: var(--accent2); }
  .plegar, .tools button, .tabp { border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 8px; cursor: pointer; }
  .plegar:hover, .tools button:hover, .tabp:hover { background: var(--line); }
  .plegar { padding: 6px 10px; font-size: 12px; }
  .tools { display: flex; gap: 8px; padding: 6px 16px 12px; border-bottom: 1px solid var(--line); }
  .tools input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--btn); color: var(--text); font-size: 14px; }
  .tools input::placeholder { color: var(--muted); }
  .tools button { padding: 8px 10px; font-size: 13px; white-space: nowrap; }
  ul { list-style: none; overflow-y: auto; flex: 1; }
  li { padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; align-items: center; gap: 10px; }
  li:hover { background: var(--hover); }
  li.active { background: var(--active); font-weight: 600; color: var(--accent2); }
  li .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  li.active .dot { background: var(--accent2); }

  .mapwrap { flex: 1; position: relative; min-width: 0; min-height: 0; display: flex; }
  main { flex: 1; min-width: 0; overflow: hidden; position: relative; }
  #map { width: 100%; height: 100%; background: var(--bg); }

  /* Leaflet adaptado a la paleta */
  .leaflet-container { font-family: inherit; }
  .leaflet-bar { border: 1px solid var(--line) !important; box-shadow: none !important; }
  .leaflet-bar a, .leaflet-bar a:hover { background: var(--panel); color: var(--text); border-bottom-color: var(--line); }
  .leaflet-control-layers { background: var(--panel); color: var(--text); border: 1px solid var(--line); box-shadow: none; }
  .leaflet-control-attribution { background: rgba(23, 19, 16, .85) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--accent); }
  .leaflet-tooltip.nom { background: var(--panel); color: var(--text); border: 1px solid var(--accent); font-size: 13px; padding: 4px 8px; box-shadow: none; }
  .leaflet-tooltip.nom::before { display: none; }
  .pinicon { background: none; border: 0; }
  .pinicon svg { width: 36px; height: 36px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.55)); }
  .card, .leaflet-top, .leaflet-bottom { z-index: 1000; }

  /* Ventana inferior izquierda */
  .card { position: absolute; left: 12px; bottom: 12px; width: min(340px, calc(100% - 24px)); max-height: 60%; overflow-y: auto;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-left: 4px solid var(--accent2); border-radius: 12px;
    padding: 12px 34px 12px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.5); font-size: 13.5px; line-height: 1.4; }
  .card[hidden] { display: none; }
  .card.grande { width: min(620px, calc(100% - 24px)); max-height: 80%; }
  .card h3 { font-size: 14px; margin-bottom: 4px; color: var(--accent2); }
  .card .sub { font-weight: 600; margin-bottom: 4px; }
  .card .x { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
  .card .cita { background: none; border: 0; padding: 0; margin-top: 6px; text-align: left; cursor: pointer; font: inherit; font-weight: 600; display: block; color: var(--accent); }
  #texto { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
  #texto[hidden] { display: none; }
  #texto .ref { font-weight: 700; margin-top: 8px; color: var(--accent2); }
  #texto .cap { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #texto p { margin: 4px 0 8px; }
  #texto sup { color: var(--accent); margin-right: 2px; font-size: 10px; }
  #texto .pie { color: var(--muted); font-size: 11px; margin-top: 8px; }
  #texto .pie a, #texto .abrir { color: var(--accent); }
  #texto .abrir { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 600; }
  #texto iframe { width: 100%; height: 340px; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: block; }
  .pas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tabp { padding: 5px 9px; font-size: 12px; }
  .tabp.sel { background: var(--accent2); color: var(--bg); border-color: var(--accent2); }

  /* Pestañas plegables */
  .tabflot { position: absolute; top: 10px; left: 10px; z-index: 1000; border: 2px solid var(--bg); background: var(--accent2); color: var(--bg);
    padding: 11px 18px; border-radius: 14px; box-shadow: 0 3px 12px rgba(0,0,0,.55); cursor: pointer; font-size: 15px; font-weight: 700; }
  .tabflot[hidden] { display: none; }
  .rueda { background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .barra { width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; border-top: 3px solid var(--accent); background: var(--panel); color: var(--text); padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .rueda.cerrada .barra { background: var(--accent2); color: var(--bg); padding: 13px 16px; font-size: 15px; box-shadow: 0 -3px 12px rgba(0,0,0,.5); }
  .rueda.cerrada .cuerpo { display: none; }

  /* Rueda de meses */
  .info { padding: 8px 16px 2px; font-size: 14px; min-height: 58px; }
  .info b { color: var(--accent2); }
  .info small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .wrap { position: relative; }
  .wrap::before { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 78px; margin-left: -39px; border: 2px solid var(--accent); border-radius: 12px; pointer-events: none; z-index: 2; }
  .track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 8px 0; }
  .track::-webkit-scrollbar { display: none; }
  .sp { flex: none; }
  .mes { flex: none; width: 84px; scroll-snap-align: center; text-align: center; cursor: pointer; padding: 4px 0; opacity: .45; transition: opacity .15s, transform .15s; }
  .mes.sel { opacity: 1; transform: scale(1.08); }
  .mes.sel .m { color: var(--accent2); }
  .mes .m { font-size: 15px; font-weight: 600; }
  .mes .a { font-size: 11px; color: var(--muted); }
  .mes.ini { border-left: 1px dashed var(--line); }

  /* Modo incrustado (ventana emergente de la Biblia): solo el mapa y la ficha */
  .embed .top, .embed aside, .embed .rueda, .embed .tabflot { display: none !important; }

  @media (max-width: 700px) {
    .cols { flex-direction: column; }
    aside { width: 100%; height: 34%; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>

  const RES = {"Tiro": ["Ciudad fenicia de la costa. Jesús la pone como ejemplo de ciudad que habría creído si hubiera visto sus milagros, y en su región cura a la hija de la mujer sirofenicia. Pablo se detiene allí de regreso a Jerusalén.", "Mt 11,21-22; Mc 7,24-30; Hch 21,3-4", [["Mt 11,21-22", ["Matthew 11:21-22"]], ["Mc 7,24-30", ["Mark 7:24-30"]], ["Hch 21,3-4", ["Acts 21:3-4"]]]], "Panias": ["Cesarea de Filipo. Aquí Pedro confiesa que Jesús es el Mesías, Jesús le promete edificar su Iglesia sobre él y anuncia por primera vez su Pasión.", "Mt 16,13-20", [["Mt 16,13-20", ["Matthew 16:13-20"]]]], "Corazín": ["Ciudad junto al lago a la que Jesús reprocha su falta de conversión pese a los milagros que había visto.", "Mt 11,20-24; Lc 10,13-15", [["Mt 11,20-24", ["Matthew 11:20-24"]], ["Lc 10,13-15", ["Luke 10:13-15"]]]], "Cafarnaum": ["Base de Jesús en Galilea, «su ciudad». Allí enseña en la sinagoga, vive en la casa de Pedro, cura al siervo del centurión y pronuncia el discurso del Pan de Vida.", "Mt 4,13; Mc 1,21-34; Mt 8,5-13", [["Mt 4,13", ["Matthew 4:13"]], ["Mc 1,21-34", ["Mark 1:21-34"]], ["Mt 8,5-13", ["Matthew 8:5-13"]]]], "Tabgha": ["Lugar de la orilla del lago asociado por la tradición a la multiplicación de los panes y a la aparición del Resucitado, donde confía a Pedro el cuidado de su rebaño.", "Jn 21,1-17; Mt 14,13-21", [["Jn 21,1-17", ["John 21:1-17"]], ["Mt 14,13-21", ["Matthew 14:13-21"]]]], "Betsaida": ["Patria de Pedro, Andrés y Felipe. Jesús cura allí a un ciego y, en sus cercanías, multiplicó los panes para la multitud.", "Jn 1,44; Mc 8,22-26; Lc 9,10-17", [["Jn 1,44", ["John 1:44"]], ["Mc 8,22-26", ["Mark 8:22-26"]], ["Lc 9,10-17", ["Luke 9:10-17"]]]], "Acre": ["Antigua Tolemaida. Pablo se detiene un día con los hermanos al volver de su tercer viaje misionero.", "Hch 21,7", [["Hch 21,7", ["Acts 21:7"]]]], "Magdala": ["Patria de María Magdalena, discípula que siguió a Jesús desde Galilea y primera testigo de la Resurrección.", "Lc 8,1-3; Jn 20,11-18", [["Lc 8,1-3", ["Luke 8:1-3"]], ["Jn 20,11-18", ["John 20:11-18"]]]], "Gergesa": ["Orilla oriental del lago donde Jesús libera a un endemoniado y los espíritus impuros entran en una piara de cerdos.", "Mc 5,1-20", [["Mc 5,1-20", ["Mark 5:1-20"]]]], "Cuernos Hattin": ["Colina que la tradición asocia al lugar del Sermón de la montaña. Los Evangelios no nombran el monte; es una localización tradicional.", "Mt 5,1-12", [["Mt 5,1-12", ["Matthew 5:1-12"]]]], "Tiberías": ["Ciudad fundada por Herodes Antipas a orillas del lago, que da nombre al «mar de Tiberíades», escenario de la multiplicación de los panes y de la aparición del Resucitado.", "Jn 6,23; Jn 21,1", [["Jn 6,23", ["John 6:23"]], ["Jn 21,1", ["John 21:1"]]]], "Hippus": ["Ciudad de la Decápolis, región pagana donde Jesús cura al sordomudo y donde se extiende su fama. El Nuevo Testamento no nombra la ciudad, solo la región.", "Mc 7,31-37; Mt 4,25", [["Mc 7,31-37", ["Mark 7:31-37"]], ["Mt 4,25", ["Matthew 4:25"]]]], "Caná": ["Allí Jesús realiza su primer signo en una boda y cura a distancia al hijo de un funcionario real. Era también la patria de Natanael.", "Jn 2,1-11; Jn 4,46-54", [["Jn 2,1-11", ["John 2:1-11"]], ["Jn 4,46-54", ["John 4:46-54"]]]], "Nazaret": ["Patria de María y José, donde Jesús crece. En su sinagoga lee a Isaías y sus vecinos lo rechazan.", "Lc 1,26-27; Lc 4,16-30", [["Lc 1,26-27", ["Luke 1:26-27"]], ["Lc 4,16-30", ["Luke 4:16-30"]]]], "Gadara": ["Ciudad de la Decápolis cuyo territorio, según Mateo, es el escenario de la liberación de los endemoniados, llamados por eso «gadarenos».", "Mt 8,28-34", [["Mt 8,28-34", ["Matthew 8:28-34"]]]], "Monte Tabor": ["Según la tradición, el monte de la Transfiguración, donde Pedro, Santiago y Juan ven a Jesús glorificado junto a Moisés y Elías. El texto no nombra el monte.", "Mt 17,1-9", [["Mt 17,1-9", ["Matthew 17:1-9"]]]], "Naín": ["Aquí Jesús devuelve a la vida al hijo único de una viuda, signo de su compasión y de su poder sobre la muerte.", "Lc 7,11-17", [["Lc 7,11-17", ["Luke 7:11-17"]]]], "Cesárea": ["Cesarea Marítima, capital romana de Judea. Pedro bautiza allí al centurión Cornelio, primer pagano que recibe el Espíritu, y Felipe llega a ella evangelizando.", "Hch 10,1-48; Hch 8,40", [["Hch 10,1-48", ["Acts 10:1-48"]], ["Hch 8,40", ["Acts 8:40"]]]], "Samaria": ["Ciudad de la región samaritana donde Felipe predica tras la muerte de Esteban; Pedro y Juan bajan a imponer las manos a los nuevos creyentes.", "Hch 8,4-17", [["Hch 8,4-17", ["Acts 8:4-17"]]]], "Sicar": ["Junto al pozo de Jacob Jesús habla con la samaritana, se revela como Mesías y muchos samaritanos creen en él.", "Jn 4,4-42", [["Jn 4,4-42", ["John 4:4-42"]]]], "Monte Gerizim": ["Monte sagrado de los samaritanos, al que alude la samaritana. Jesús anuncia que llega la hora de adorar al Padre en espíritu y verdad.", "Jn 4,19-24", [["Jn 4,19-24", ["John 4:19-24"]]]], "Tel Aviv - Yafo": ["Yafo es la antigua Jope. Pedro resucita allí a Tabita y, hospedado en casa de Simón el curtidor, recibe la visión que abre el Evangelio a los paganos.", "Hch 9,36-43; Hch 10,9-16", [["Hch 9,36-43", ["Acts 9:36-43"]], ["Hch 10,9-16", ["Acts 10:9-16"]]]], "Lod": ["Antigua Lida, donde Pedro cura al paralítico Eneas y muchos se convierten al Señor.", "Hch 9,32-35", [["Hch 9,32-35", ["Acts 9:32-35"]]]], "Efraín": ["Pueblo del borde del desierto de Judea donde Jesús se retira con sus discípulos antes de su última Pascua.", "Jn 11,54", [["Jn 11,54", ["John 11:54"]]]], "Monte Tentación": ["Lugar que la tradición señala para los cuarenta días de ayuno y las tentaciones de Jesús en el desierto.", "Mt 4,1-11", [["Mt 4,1-11", ["Matthew 4:1-11"]]]], "Jericó": ["En esta ciudad Jesús cura al ciego Bartimeo y se hospeda en casa de Zaqueo. En el camino de Jerusalén a Jericó sitúa la parábola del buen samaritano.", "Mc 10,46-52; Lc 19,1-10; Lc 10,30-37", [["Mc 10,46-52", ["Mark 10:46-52"]], ["Lc 19,1-10", ["Luke 19:1-10"]], ["Lc 10,30-37", ["Luke 10:30-37"]]]], "Arimatea": ["Pueblo de José de Arimatea, discípulo que pidió a Pilato el cuerpo de Jesús y lo sepultó en su sepulcro nuevo. Su ubicación exacta es incierta.", "Mt 27,57-60; Jn 19,38-42", [["Mt 27,57-60", ["Matthew 27:57-60"]], ["Jn 19,38-42", ["John 19:38-42"]]]], "Betabará": ["Lugar del Bautismo de Jesús por Juan, al otro lado del Jordán. Allí encuentra a sus primeros discípulos y a él regresa más tarde.", "Jn 1,28-34; Jn 10,40-42", [["Jn 1,28-34", ["John 1:28-34"]], ["Jn 10,40-42", ["John 10:40-42"]]]], "Emaus": ["Camino de Emaús, dos discípulos reconocen al Resucitado al partir el pan. Su ubicación exacta es discutida.", "Lc 24,13-35", [["Lc 24,13-35", ["Luke 24:13-35"]]]], "Betfagé": ["En el monte de los Olivos, desde aquí Jesús envía a dos discípulos a buscar el pollino para su entrada en Jerusalén.", "Mt 21,1-11", [["Mt 21,1-11", ["Matthew 21:1-11"]]]], "Betania": ["Aldea de Marta, María y Lázaro, amigos de Jesús: aquí resucita a Lázaro y María lo unge seis días antes de la Pascua.", "Jn 11,1-44; Jn 12,1-8", [["Jn 11,1-44", ["John 11:1-44"]], ["Jn 12,1-8", ["John 12:1-8"]]]], "Jerusalén": ["Ciudad del Templo y escenario de la Pasión, muerte y Resurrección de Jesús. Allí nace la Iglesia en Pentecostés.", "Lc 9,51-53; Hch 2,1-4", [["Lc 9,51-53", ["Luke 9:51-53"]], ["Hch 2,1-4", ["Acts 2:1-4"]]]], "Belén": ["Ciudad de David, donde nace Jesús y a donde llegan los magos de Oriente.", "Lc 2,1-7; Mt 2,1-12", [["Lc 2,1-7", ["Luke 2:1-7"]], ["Mt 2,1-12", ["Matthew 2:1-12"]]]], "Campo Pastores": ["Lugar tradicional, junto a Belén, donde los ángeles anuncian a los pastores el nacimiento del Salvador.", "Lc 2,8-20", [["Lc 2,8-20", ["Luke 2:8-20"]]]]};
  const LUGARES = PL.map(([nombre, lat, lng]) => ({ nombre, lat, lng })).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

  // ===== Mapa (Leaflet + capas actuales) =====
  const map = L.map('map', { zoomControl: false }).setView([32.1, 35.3], 8);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
  const sat = L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imágenes &copy; Esri' }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 })
  ]);
  osm.addTo(map);
  L.control.layers({ 'Mapa actual': osm, 'Satélite actual': sat }, null, { position: 'topright' }).addTo(map);

  const pinSVG = c => '<svg viewBox="0 0 24 24"><path fill="' + c + '" stroke="#fff" stroke-width="1.2" d="M12 2C8 2 5 5 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.8" fill="#fff"/></svg>';
  function crearPin(l, color) {
    const m = L.marker([l.lat, l.lng], { icon: L.divIcon({ className: 'pinicon', html: pinSVG(color), iconSize: [36, 36], iconAnchor: [18, 34] }) });
    m.bindTooltip(l.nombre, { permanent: true, direction: 'top', offset: [0, -30], className: 'nom' });
    return m.addTo(map);
  }

  map.createPane('lineas').style.zIndex = 410;
  map.createPane('puntos').style.zIndex = 420;
  const TOP15 = Object.keys(RES);   // todos los lugares con importancia en el Nuevo Testamento (34)
  TOP15.forEach(n => {
    const l = LUGARES.find(x => x.nombre === n);
    const abrir = () => abrirLugar(n);
    L.circleMarker([l.lat, l.lng], { pane: 'puntos', radius: 6, color: '#fff', weight: 1.5, fillColor: '#d00000', fillOpacity: 1 }).on('click', abrir).addTo(map);
    // zona de pulsación más amplia e invisible, para acertar con el dedo
    L.circleMarker([l.lat, l.lng], { pane: 'puntos', radius: 15, stroke: false, fillOpacity: 0.01 }).on('click', abrir).addTo(map);
  });

  const lista = document.getElementById('lista');
  const buscar = document.getElementById('buscar');
  const activos = new Map();

  function pintarLista() {
    const q = buscar.value.trim().toLowerCase();
    lista.innerHTML = '';
    LUGARES.forEach((l, i) => {
      if (!RES[l.nombre]) return;
      if (q && !l.nombre.toLowerCase().includes(q)) return;
      const li = document.createElement('li');
      li.innerHTML = '<span class="dot"></span><span></span>';
      li.lastChild.textContent = l.nombre;
      if (activos.has(i)) li.classList.add('active');
      li.onclick = () => alternar(i);
      lista.appendChild(li);
    });
  }
  let cardCita = '', cardRefs = [];
  function pintarCard(titulo, sub, texto, cita, refs) {
    cardCita = cita; cardRefs = refs;
    document.getElementById('ct').textContent = titulo;
    document.getElementById('cs').textContent = sub;
    document.getElementById('cp').textContent = texto;
    const card = document.getElementById('card');
    card.classList.remove('grande');
    document.getElementById('texto').hidden = true;
    document.getElementById('cc').textContent = '📖 ' + cita + ' ▸ ver texto';
    card.hidden = false;
  }
  function alternar(i) {
    const yaActivo = activos.has(i);
    activos.forEach(m => m.remove()); activos.clear();
    if (!yaActivo) {
      const l = LUGARES[i], r = RES[l.nombre];
      activos.set(i, crearPin(l, '#e8412c'));
      map.flyTo([l.lat, l.lng], 14);
      lineaTok++; capaLinea.clearLayers();           // desaparece la línea roja
      pintarCard(l.nombre, 'Importancia en el Nuevo Testamento', r[0], r[1], r[2]);
    } else if (actual >= 0) {                        // al deseleccionar, vuelve la línea y la ficha del mes
      dibujarLinea(actual); cardMes(actual);
    } else document.getElementById('card').hidden = true;
    pintarLista();
  }
  // Al pulsar un punto rojo del mapa: se despliega la lista con ese lugar seleccionado y su ficha
  function abrirLugar(nombre) {
    if (document.documentElement.classList.contains('embed')) { mostrarEmbed([nombre]); return; }
    const i = LUGARES.findIndex(l => l.nombre === nombre);
    if (i < 0) return;
    mostrarLista(true);
    buscar.value = '';
    if (activos.has(i)) {
      const r = RES[nombre];
      lineaTok++; capaLinea.clearLayers();
      pintarCard(nombre, 'Importancia en el Nuevo Testamento', r[0], r[1], r[2]);
      pintarLista();
    } else alternar(i);
    const li = lista.querySelector('li.active');
    if (li) li.scrollIntoView({ block: 'center' });
  }
  document.getElementById('btnLimpiar').onclick = () => {
    activos.forEach(m => m.remove()); activos.clear(); pintarLista();
  };
  buscar.oninput = pintarLista;
  pintarLista();

  const D = [["Jesús llega desde Nazaret al Jordán y es bautizado por Juan; el Espíritu desciende sobre él y se le proclama Hijo amado.", "Mt 3,13-17; Jn 1,28"], ["Tras el bautismo el Espíritu lo lleva al desierto, donde ayuna y es tentado. La tradición lo sitúa en el monte cercano a Jericó.", "Mt 4,1-11; Mc 1,12-13"], ["Vuelve al Jordán, donde Juan lo señala como «el Cordero de Dios» y los primeros discípulos (Andrés, Juan, Pedro) empiezan a seguirlo.", "Jn 1,29-42"], ["Asiste a una boda en Caná de Galilea con su madre y sus discípulos; convierte el agua en vino, primer signo de su gloria.", "Jn 2,1-11"], ["Baja a Cafarnaum con su madre, sus hermanos y sus discípulos, y se queda allí unos días. Será su base en Galilea.", "Jn 2,12"], ["Probable visita a su familia y a su pueblo de infancia antes de subir a Jerusalén. Es una reconstrucción sin cita directa.", "Sin cita directa; cf. Mc 6,3"], ["Enseña en la sinagoga de Cafarnaum y la gente se admira de que hable con autoridad.", "Mc 1,21-22"], ["La multitud se agolpa a la orilla del lago y Jesús enseña desde una barca. La tradición recuerda Tabgha como este lugar junto al lago.", "Lc 5,1-3"], ["Camino de Galilea a Jerusalén por el valle del Jordán, ruta habitual de los peregrinos judíos. Es una reconstrucción sin cita directa.", "Sin cita directa; cf. Jn 2,13"], ["Sube a Jerusalén para la Pascua, expulsa del Templo a los vendedores y anuncia el templo de su cuerpo.", "Jn 2,13-22"], ["Nicodemo, fariseo y jefe de los judíos, lo visita de noche; Jesús le habla del nuevo nacimiento y del amor de Dios.", "Jn 3,1-21"], ["Se queda con sus discípulos en tierra de Judea y bautizan, mientras Juan sigue bautizando cerca de allí.", "Jn 3,22-23"], ["Continúa el ministerio en Judea hasta que Juan es encarcelado; entonces Jesús se retira a Galilea.", "Jn 3,22-24; Mt 4,12"], ["De paso por Samaria, cansado junto al pozo de Jacob, habla con una mujer samaritana y le revela que es el Mesías.", "Jn 4,4-42"], ["De nuevo en Caná, un funcio   const LIBROS_ES = { mt: 'mt', mateo: 'mt', mc: 'mc', marcos: 'mc', lc: 'lc', lucas: 'lc', jn: 'jn', juan: 'jn', hch: 'hch', hechos: 'hch' };
  function parsePasaje(txt) {
    const m = txt.match(/^\s*([A-Za-zÁÉÍÓÚáéíóúñ]+)\.?\s+(\d+)(?:\s*[,:]\s*(\d+)(?:\s*[-–]\s*(\d+))?)?/);
    if (!m) return null;
    const libro = LIBROS_ES[quitaAcentos(m[1])];
    if (!libro) return null;
    const desde = m[3] ? +m[3] : 1;
    return { libro, cap: +m[2], desde, hasta: m[4] ? +m[4] : (m[3] ? desde : 999) };
  }
  function lugaresDePasaje(txt) {
    const q = parsePasaje(txt);
    if (!q) return [];
    return Object.keys(RES).filter(n => RES[n][2].some(([etq]) => {
      const r = parsePasaje(etq);
      return r && r.libro === q.libro && r.cap === q.cap && r.desde <= q.hasta && q.desde <= r.hasta;
    }));
  }
  let pinsEmbed = [];
  function mostrarEmbed(nombres) {
    pinsEmbed.forEach(m => m.remove()); pinsEmbed = [];
    const ls = nombres.map(n => LUGARES.find(l => l.nombre === n)).filter(Boolean);
    if (!ls.length) return;
    ls.forEach(l => pinsEmbed.push(crearPin(l, '#e8412c')));
    if (ls.length === 1) map.setView([ls[0].lat, ls[0].lng], 14);
    else map.fitBounds(L.latLngBounds(ls.map(l => [l.lat, l.lng])), { padding: [70, 70], maxZoom: 14 });
    const r = RES[ls[0].nombre];
    pintarCard(ls[0].nombre, 'Importancia en el Nuevo Testamento', r[0], r[1], r[2]);
  }
  if (document.documentElement.classList.contains('embed')) {
    const q = new URLSearchParams(location.search);
    let nombres = [];
    if (q.get('lugar')) { const n = resolverLugar(q.get('lugar')); if (n) nombres = [n]; }
    else if (q.get('pasaje')) nombres = lugaresDePasaje(q.get('pasaje'));
    map.invalidateSize();
    mostrarEmbed(nombres);
  }
</script>
