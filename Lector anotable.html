<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lector anotable</title>
<style>
  :root { --tabh: 46px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #111; -webkit-text-size-adjust: 100%; }
  .hidden { display: none !important; }

  /* ---------- Barra de pestañas ---------- */
  #tabbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--tabh); z-index: 30;
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    background: #111827; -webkit-user-select: none; user-select: none;
  }
  #tabs { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: flex; align-items: center; gap: 4px; max-width: 210px; height: 34px;
    padding: 0 4px 0 12px; border-radius: 9px; background: #1f2937; color: #d1d5db;
    border: 1px solid #374151; cursor: pointer; font-size: .9rem;
  }
  .tab.active { background: #f9fafb; color: #111827; border-color: #f9fafb; font-weight: 600; }
  .tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .x { flex: none; width: 26px; height: 26px; border: 0; border-radius: 7px; background: transparent; color: inherit; font-size: 1.2rem; line-height: 1; cursor: pointer; }
  .tab .x:hover { background: rgba(127,127,127,.3); }
  #newTab { flex: none; width: 38px; height: 34px; border-radius: 9px; border: 1px solid #4b5563; background: #374151; color: #fff; font-size: 1.4rem; line-height: 1; cursor: pointer; }

  /* ---------- Página 1 ---------- */
  #setup { max-width: 760px; margin: 0 auto; padding: calc(var(--tabh) + 24px) 16px 40px; }
  #setup h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .hint { color: #4b5563; font-size: .95rem; margin: 0 0 18px; }
  .field { margin-bottom: 18px; }
  .field > label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea#inputText { width: 100%; min-height: 220px; padding: 12px; font-size: 1rem; border: 1px solid #c7cad1; border-radius: 10px; resize: vertical; font-family: inherit; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row .field { flex: 1 1 140px; }
  input[type=color] { width: 100%; height: 44px; border: 1px solid #c7cad1; border-radius: 8px; padding: 2px; background: #fff; }
  select, input[type=number] { width: 100%; height: 44px; font-size: 1rem; border: 1px solid #c7cad1; border-radius: 8px; padding: 0 8px; background: #fff; }
  input[type=range] { width: 100%; }
  .range-val { font-variant-numeric: tabular-nums; color: #555; font-size: .9rem; }
  #preview { border: 1px solid #c7cad1; border-radius: 10px; padding: 14px 0; font-size: 1.05rem; line-height: 1.6; max-height: 140px; overflow: hidden; }
  #preview div { white-space: pre-wrap; }
  .btn-primary { width: 100%; padding: 14px; font-size: 1.05rem; font-weight: 600; background: #2563eb; color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
  .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }

  /* ---------- Página 2 ---------- */
  #toolbar {
    position: fixed; top: var(--tabh); left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    background: #1f2937; color: #fff; overflow-x: auto; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    -webkit-user-select: none; user-select: none;
  }
  #toolbar button {
    flex: none; height: 42px; padding: 0 14px; border: 1px solid #4b5563; border-radius: 10px;
    background: #374151; color: #fff; font-size: .95rem; cursor: pointer;
  }
  #toolbar button.active { background: #2563eb; border-color: #60a5fa; }
  #toolbar .sep { flex: none; width: 1px; height: 26px; background: #4b5563; margin: 0 4px; }
  #toolbar input[type=color] { flex: none; width: 42px; height: 42px; padding: 2px; border-radius: 10px; border: 1px solid #4b5563; background: #374151; }
  #toolbar input[type=range] { flex: none; width: 100px; }
  #toolbar label { flex: none; font-size: .8rem; color: #d1d5db; }
  #toolbar .tip { flex: none; font-size: .75rem; color: #9ca3af; }

  #pencilMenu {
    position: fixed; z-index: 40; display: flex; gap: 6px; padding: 8px;
    background: #111827; border-radius: 16px; box-shadow: 0 8px 28px rgba(0,0,0,.4);
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #pencilMenu button {
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; padding: 10px 8px;
    border: 1px solid #374151; border-radius: 12px; background: #1f2937; color: #fff; font-size: .8rem; cursor: pointer;
  }
  #pencilMenu button b { font-size: 1.4rem; font-weight: 400; line-height: 1.2; }
  #pencilMenu button.active { background: #2563eb; border-color: #60a5fa; }

  #reader { padding-top: calc(var(--tabh) + 70px); min-height: 100vh; }
  #content { position: relative; margin: 0 auto; max-width: 100%; padding-bottom: 80px; touch-action: pan-y pinch-zoom; }
  #textEl {
    white-space: pre-wrap; overflow-wrap: break-word; line-height: 1.75; font-size: 1.1rem; padding-top: 16px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  body.mode-erase #overlay { pointer-events: auto; }
  body.mode-erase #overlay .ann { pointer-events: stroke; }
  body.mode-erase #overlay rect.ann { pointer-events: all; }
  body.mode-erase #overlay .ann:hover { opacity: .35; }
</style>
</head>
<body>

<!-- ===================== PESTAÑAS ===================== -->
<div id="tabbar">
  <div id="tabs" role="tablist"></div>
  <button id="newTab" title="Nueva pestaña" aria-label="Nueva pestaña">+</button>
</div>

<!-- ===================== PÁGINA 1 ===================== -->
<section id="setup">
  <h1>Prepara tu texto</h1>
  <p class="hint">En la lectura: el dedo hace scroll; el Apple Pencil subraya, resalta, dibuja o borra. Si mantienes el Pencil quieto sobre el texto, aparece un menú para cambiar de herramienta.</p>

  <div class="field">
    <label for="inputText">Texto</label>
    <textarea id="inputText" placeholder="Pega o escribe aquí tu texto…"></textarea>
  </div>

  <div class="row">
    <div class="field">
      <label for="bgColor">Color de fondo</label>
      <input type="color" id="bgColor" value="#fdf6e3">
    </div>
    <div class="field">
      <label for="fgColor">Color de letra</label>
      <input type="color" id="fgColor" value="#222222">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label for="fontSel">Fuente</label>
      <select id="fontSel">
        <option value="Georgia, serif">Georgia (serif)</option>
        <option value="'Times New Roman', Times, serif">Times New Roman</option>
        <option value="'Palatino Linotype', Palatino, 'Book Antiqua', serif">Palatino</option>
        <option value="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Sistema (sans-serif)</option>
        <option value="Arial, Helvetica, sans-serif">Arial</option>
        <option value="Verdana, Geneva, sans-serif">Verdana</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet</option>
        <option value="'Courier New', Courier, monospace">Courier (monoespaciada)</option>
        <option value="'Comic Sans MS', 'Comic Neue', cursive">Comic Sans</option>
      </select>
    </div>
    <div class="field">
      <label for="sizeNum">Tamaño de letra (px)</label>
      <input type="number" id="sizeNum" value="20" min="10" max="60">
    </div>
  </div>

  <div class="field">
    <label for="marginRange">Margen lateral: <span class="range-val" id="marginVal">10%</span></label>
    <input type="range" id="marginRange" min="0" max="35" step="1" value="10">
  </div>

  <div class="field">
    <label>Vista previa</label>
    <div id="preview"><div id="previewText">Así se verá tu texto.</div></div>
  </div>

  <button class="btn-primary" id="goBtn" disabled>Continuar →</button>
</section>

<!-- ===================== PÁGINA 2 ===================== -->
<section id="reader" class="hidden">
  <div id="toolbar">
    <button id="backBtn" title="Volver a la configuración">← Volver</button>
    <span class="sep"></span>
    <button data-tool="underline" class="active">U̲ Subrayar</button>
    <button data-tool="highlight">🖍 Resaltar</button>
    <button data-tool="draw">✏️ Dibujar</button>
    <button data-tool="erase">🧽 Borrar</button>
    <span class="sep"></span>
    <input type="color" id="toolColor" title="Color de la herramienta">
    <label for="toolWidth">Grosor</label>
    <input type="range" id="toolWidth" min="1" max="20" value="3">
    <span class="sep"></span>
    <button id="undoBtn">↶ Deshacer</button>
    <button id="clearBtn">Borrar todo</button>
    <span class="tip">Dedo: scroll · Pencil: anotar · Pencil quieto: menú</span>
  </div>

  <div id="pencilMenu" class="hidden" role="menu">
    <button data-tool="underline"><b>U̲</b><span>Subrayar</span></button>
    <button data-tool="highlight"><b>🖍</b><span>Resaltar</span></button>
    <button data-tool="draw"><b>✏️</b><span>Dibujar</span></button>
    <button data-tool="erase"><b>🧽</b><span>Borrar</span></button>
  </div>

  <div id="content">
    <div id="textEl"></div>
    <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</section>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const setup = $('setup'), reader = $('reader');
  const inputText = $('inputText'), bgColor = $('bgColor'), fgColor = $('fgColor');
  const fontSel = $('fontSel'), sizeNum = $('sizeNum'), marginRange = $('marginRange'), marginVal = $('marginVal');
  const preview = $('preview'), previewText = $('previewText'), goBtn = $('goBtn');
  const content = $('content'), textEl = $('textEl'), overlay = $('overlay');
  const toolColor = $('toolColor'), toolWidth = $('toolWidth');
  const tabsEl = $('tabs');

  /* ---------- Estado ---------- */
  // Cada pestaña: {id, text, bg, fg, font, size, margin, annotations, view, applied, scrollY}
  //   annotations: {type, color, width, start,end | pts:[[xRatio,y]]}
  //   applied: ajustes con los que se creó la lectura (se fijan al pulsar "Continuar")
  let tabs = [], cur = null, nextId = 1;
  let annotations = [];       // referencia a las anotaciones de la pestaña activa
  let tool = 'underline';
  const toolStyle = {
    underline: { color: '#e11d48', width: 3 },
    highlight: { color: '#facc15', width: 3 },
    draw:      { color: '#2563eb', width: 3 },
  };

  /* ---------- Pestañas ---------- */
  function newTabObj() {
    return { id: nextId++, text: '', bg: '#fdf6e3', fg: '#222222', font: fontSel.options[0].value,
             size: 20, margin: 10, annotations: [], view: 'setup', applied: null, scrollY: 0 };
  }
  function tabTitle(t) {
    const w = (t.text || '').trim().split(/\s+/).filter(Boolean).slice(0, 3).join(' ');
    return w || 'Nueva pestaña';
  }
  function renderTabs(reveal) {
    tabsEl.innerHTML = '';
    tabs.forEach(t => {
      const d = document.createElement('div');
      d.className = 'tab' + (t === cur ? ' active' : '');
      d.setAttribute('role', 'tab');
      d.title = tabTitle(t);
      const s = document.createElement('span');
      s.className = 't'; s.textContent = tabTitle(t);
      const x = document.createElement('button');
      x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', 'Cerrar pestaña');
      x.addEventListener('click', e => { e.stopPropagation(); closeTab(t); });
      d.addEventListener('click', () => switchTo(t));
      d.append(s, x);
      tabsEl.appendChild(d);
    });
    if (reveal) {
      const a = tabsEl.querySelector('.tab.active');
      if (a) tabsEl.scrollLeft = Math.max(0, a.offsetLeft - 40);
    }
  }
  function fillForm(t) {
    inputText.value = t.text; bgColor.value = t.bg; fgColor.value = t.fg;
    fontSel.value = t.font; sizeNum.value = t.size; marginRange.value = t.margin;
    updatePreview();
  }
  function readForm(t) {
    t.text = inputText.value; t.bg = bgColor.value; t.fg = fgColor.value;
    t.font = fontSel.value; t.size = sizeNum.value; t.margin = marginRange.value;
  }
  function loadCur() {
    fillForm(cur);
    if (cur.view === 'reader' && cur.applied) showReader(cur); else showSetup();
    window.scrollTo(0, cur.scrollY || 0);
  }
  function switchTo(t) {
    if (t === cur) return;
    if (cur) { readForm(cur); cur.scrollY = window.scrollY; }
    clearHold(); hideMenu(); active = null; activePointer = null;
    cur = t; annotations = t.annotations;
    loadCur();
    renderTabs(true);
  }
  function addTab() { const n = newTabObj(); tabs.push(n); switchTo(n); }
  function closeTab(t) {
    if (t.annotations.length && !confirm('Esta pestaña tiene anotaciones que se perderán. ¿Cerrarla?')) return;
    const i = tabs.indexOf(t);
    const wasCurrent = (t === cur);
    tabs.splice(i, 1);
    if (!wasCurrent) { renderTabs(); return; }
    cur = null;
    let next = tabs[i] || tabs[i - 1];
    if (!next) { next = newTabObj(); tabs.push(next); }
    switchTo(next);
  }
  $('newTab').addEventListener('click', addTab);

  /* ---------- Página 1: vista previa ---------- */
  function updatePreview() {
    const m = marginRange.value;
    marginVal.textContent = m + '%';
    preview.style.background = bgColor.value;
    preview.style.color = fgColor.value;
    preview.style.fontFamily = fontSel.value;
    preview.style.fontSize = (sizeNum.value || 20) + 'px';
    preview.style.paddingLeft = preview.style.paddingRight = m + '%';
    previewText.textContent = inputText.value.trim() ? inputText.value : 'Así se verá tu texto.';
    goBtn.disabled = !inputText.value.trim();
  }
  [inputText, bgColor, fgColor, fontSel, sizeNum, marginRange].forEach(el => el.addEventListener('input', () => {
    updatePreview();
    if (cur) { readForm(cur); renderTabs(); }
  }));

  /* ---------- Navegación entre página 1 y 2 ---------- */
  function showSetup() {
    reader.classList.add('hidden');
    setup.classList.remove('hidden');
    document.body.style.background = '#f3f4f6';
  }
  function showReader(t) {
    const a = t.applied;
    document.body.style.background = a.bg;
    reader.style.background = a.bg;
    textEl.textContent = a.text;
    textEl.style.color = a.fg;
    textEl.style.fontFamily = a.font;
    textEl.style.fontSize = (a.size || 20) + 'px';
    textEl.style.paddingLeft = textEl.style.paddingRight = a.margin + '%';
    setup.classList.add('hidden');
    reader.classList.remove('hidden');
    setTool(tool);
    render();
  }
  goBtn.addEventListener('click', () => {
    const txt = inputText.value;
    if (cur.applied && annotations.length && txt !== cur.applied.text) {
      if (!confirm('El texto ha cambiado: se borrarán las anotaciones anteriores. ¿Continuar?')) return;
      annotations.length = 0;
    }
    readForm(cur);
    cur.applied = { text: cur.text, bg: cur.bg, fg: cur.fg, font: cur.font, size: cur.size, margin: cur.margin };
    cur.view = 'reader';
    showReader(cur);
    window.scrollTo(0, 0);
  });
  $('backBtn').addEventListener('click', () => {
    cur.view = 'setup';
    showSetup();
    window.scrollTo(0, 0);
  });

  /* ---------- Herramientas ---------- */
  function setTool(t) {
    tool = t;
    document.body.className = 'mode-' + t;
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
    const st = toolStyle[t];
    if (st) { toolColor.value = st.color; toolWidth.value = st.width; }
    toolColor.disabled = !st;
    toolWidth.disabled = !st || t === 'highlight';
  }
  document.querySelectorAll('#toolbar [data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
  toolColor.addEventListener('input', () => { if (toolStyle[tool]) toolStyle[tool].color = toolColor.value; });
  toolWidth.addEventListener('input', () => { if (toolStyle[tool]) toolStyle[tool].width = +toolWidth.value; });
  $('undoBtn').addEventListener('click', () => { annotations.pop(); render(); });
  $('clearBtn').addEventListener('click', () => {
    if (annotations.length && confirm('¿Borrar todas las anotaciones?')) { annotations.length = 0; render(); }
  });

  /* ---------- Entrada: dedo = scroll, Pencil (y ratón) = anotar ---------- */
  // En iOS el Pencil también desplazaría la página: lo evitamos solo para toques de lápiz.
  const isStylus = t => t && t.touchType === 'stylus';
  function blockStylusScroll(e) {
    for (const t of e.changedTouches) if (isStylus(t)) { e.preventDefault(); return; }
  }
  content.addEventListener('touchstart', blockStylusScroll, { passive: false });
  content.addEventListener('touchmove', blockStylusScroll, { passive: false });

  function caretOffset(x, y) {
    let node, off;
    if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(x, y);
      if (!p) return null; node = p.offsetNode; off = p.offset;
    } else if (document.caretRangeFromPoint) {
      const r = document.caretRangeFromPoint(x, y);
      if (!r) return null; node = r.startContainer; off = r.startOffset;
    } else return null;
    const t = textEl.firstChild;
    const len = t ? t.length : 0;
    if (node === t) return off;
    if (node === textEl) return off > 0 ? len : 0;
    return null;
  }
  function pt(e) {
    const r = overlay.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, e.clientY - r.top];
  }
  function eraseAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const a = el && el.closest && el.closest('.ann');
    if (a) { annotations.splice(+a.dataset.i, 1); render(); }
  }

  let active = null;   // anotación en curso
  let anchor = 0;
  let activePointer = null;
  let raf = 0;
  const scheduleRender = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };

  /* ---------- Menú flotante: mantén pulsado el Pencil sin moverlo ---------- */
  const pencilMenu = $('pencilMenu');
  let holdTimer = null, holdX = 0, holdY = 0;
  function clearHold() { clearTimeout(holdTimer); holdTimer = null; }
  function hideMenu() { pencilMenu.classList.add('hidden'); }
  function showMenu(x, y) {
    pencilMenu.classList.remove('hidden');
    const w = pencilMenu.offsetWidth, h = pencilMenu.offsetHeight;
    const left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2));
    let top = y - h - 24;
    if (top < 120) top = y + 28;           // si no cabe encima, debajo de la punta
    pencilMenu.style.left = left + 'px';
    pencilMenu.style.top = top + 'px';
  }
  function startHold(e) {
    clearHold();
    holdX = e.clientX; holdY = e.clientY;
    holdTimer = setTimeout(() => {
      holdTimer = null;
      if (active) { const i = annotations.indexOf(active); if (i >= 0) annotations.splice(i, 1); active = null; }
      activePointer = null;
      render();
      showMenu(holdX, holdY);
      if (navigator.vibrate) { try { navigator.vibrate(10); } catch (_) {} }
    }, 600);
  }
  pencilMenu.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => {
    setTool(b.dataset.tool); hideMenu();
  }));
  document.addEventListener('pointerdown', e => {
    if (!pencilMenu.classList.contains('hidden') && !pencilMenu.contains(e.target)) hideMenu();
  }, true);

  content.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;          // el dedo solo hace scroll
    if (e.button !== undefined && e.button > 0) return;
    if (e.pointerType === 'pen') startHold(e);
    activePointer = e.pointerId;
    try { content.setPointerCapture(e.pointerId); } catch (_) {}
    if (tool === 'erase') { eraseAt(e.clientX, e.clientY); e.preventDefault(); return; }
    if (tool === 'draw') {
      active = { type: 'draw', color: toolStyle.draw.color, width: toolStyle.draw.width, pts: [pt(e)] };
      annotations.push(active); scheduleRender(); e.preventDefault(); return;
    }
    // subrayar / resaltar: se marca el texto por el que desliza el Pencil
    const o = caretOffset(e.clientX, e.clientY);
    if (o === null) { activePointer = null; return; }
    anchor = o;
    active = { type: tool, color: toolStyle[tool].color, width: toolStyle[tool].width, start: o, end: o };
    annotations.push(active);
    e.preventDefault();
  });

  content.addEventListener('pointermove', e => {
    if (holdTimer && Math.hypot(e.clientX - holdX, e.clientY - holdY) > 8) clearHold();
    if (e.pointerId !== activePointer) return;
    const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    if (tool === 'erase') { evs.forEach(c => eraseAt(c.clientX, c.clientY)); return; }
    if (!active) return;
    if (active.type === 'draw') {
      evs.forEach(c => active.pts.push(pt(c)));
    } else {
      const o = caretOffset(e.clientX, e.clientY);
      if (o === null) return;
      active.start = Math.min(anchor, o);
      active.end = Math.max(anchor, o);
    }
    scheduleRender();
    e.preventDefault();
  });

  function endStroke(e) {
    clearHold();
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    if (active && active.type !== 'draw' && active.end <= active.start) {
      const i = annotations.indexOf(active);
      if (i >= 0) annotations.splice(i, 1);   // toque sin deslizar: no marca nada
    }
    active = null;
    render();
  }
  content.addEventListener('pointerup', endStroke);
  content.addEventListener('pointercancel', endStroke);
  content.addEventListener('contextmenu', e => e.preventDefault());

  /* ---------- Render del overlay ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  function render() {
    const cr = content.getBoundingClientRect();
    const w = cr.width, h = content.scrollHeight;
    overlay.setAttribute('viewBox', `0 0 ${w} ${h}`);
    overlay.style.height = h + 'px';
    while (overlay.firstChild) overlay.removeChild(overlay.firstChild);
    const node = textEl.firstChild;
    annotations.forEach((a, i) => {
      if (a.type === 'draw') {
        const p = document.createElementNS(NS, 'path');
        const d = a.pts.map((q, k) => (k ? 'L' : 'M') + (q[0] * w).toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
        p.setAttribute('d', a.pts.length === 1 ? d + ' l0.1 0' : d);
        p.setAttribute('fill', 'none');
        p.setAttribute('stroke', a.color);
        p.setAttribute('stroke-width', a.width);
        p.setAttribute('stroke-linecap', 'round');
        p.setAttribute('stroke-linejoin', 'round');
        p.setAttribute('class', 'ann'); p.dataset.i = i;
        overlay.appendChild(p);
        return;
      }
      if (!node || node.nodeType !== 3 || a.end <= a.start) return;
      const range = document.createRange();
      const len = node.length;
      range.setStart(node, Math.min(a.start, len));
      range.setEnd(node, Math.min(a.end, len));
      for (const r of range.getClientRects()) {
        if (r.width < 1) continue;
        const el = document.createElementNS(NS, 'rect');
        const x = r.left - cr.left, y = r.top - cr.top;
        el.setAttribute('x', x);
        el.setAttribute('class', 'ann'); el.dataset.i = i;
        el.setAttribute('width', r.width);
        el.setAttribute('fill', a.color);
        if (a.type === 'highlight') {
          el.setAttribute('y', y);
          el.setAttribute('height', r.height);
          el.setAttribute('opacity', '0.4');
        } else {
          el.setAttribute('y', y + r.height - a.width - 1);
          el.setAttribute('height', a.width);
        }
        overlay.appendChild(el);
      }
    });
  }
  new ResizeObserver(() => { if (!reader.classList.contains('hidden')) render(); }).observe(content);
  window.addEventListener('resize', () => { if (!reader.classList.contains('hidden')) render(); });

  /* ---------- Inicio: una pestaña nueva en la primera pantalla ---------- */
  const first = newTabObj();
  tabs.push(first);
  cur = first;
  annotations = first.annotations;
  loadCur();
  renderTabs();
})();
</script>
