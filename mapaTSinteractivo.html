<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tierra Santa · Ministerio de Jesús</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f4f4f2; --panel:#fff; --text:#222; --muted:#777; --line:#e6e6e6; --hover:#f5f5f5; --active:#fdeceA; --accent:#e8412c; --btn:#fafafa; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1b1b1a; --panel:#262625; --text:#eee; --muted:#aaa; --line:#3a3a38; --hover:#303030; --active:#4a2a25; --btn:#303030; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
  .app { display: flex; height: 100%; }
  aside { width: 280px; min-width: 260px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
  aside h1 { font-size: 18px; padding: 14px 16px 8px; }
  .tools { display: flex; gap: 8px; padding: 6px 16px 12px; border-bottom: 1px solid var(--line); }
  .tools input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--btn); color: var(--text); font-size: 14px; }
  .tools button { padding: 8px 10px; border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  ul { list-style: none; overflow-y: auto; flex: 1; }
  li { padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; align-items: center; gap: 10px; }
  li:hover { background: var(--hover); }
  li.active { background: var(--active); font-weight: 600; }
  li .dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; flex: none; }
  li.active .dot { background: var(--accent); }
  main { flex: 1; overflow: hidden; position: relative; padding-top: env(safe-area-inset-top, 0px); }
  .mapa { position: relative; width: 100%; line-height: 0; }
  .mapa img { width: 100%; height: auto; display: block; user-select: none; -webkit-user-drag: none; }
  .marker { position: absolute; transform: translate(-50%, -100%); pointer-events: none; animation: caer .35s ease-out; }
  .marker svg { width: 36px; height: 36px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); display:block; }
  .marker span { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); background: #222; color: #fff;
    font-size: 13px; line-height: 1; padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
  @keyframes caer { from { transform: translate(-50%, -140%); opacity: 0; } to { transform: translate(-50%, -100%); opacity: 1; } }

  .app { flex-direction: column; }
  .cols { display: flex; flex: 1; min-height: 0; }
  .rueda { background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .info { padding: 8px 16px 2px; font-size: 14px; min-height: 58px; }
  .info b { color: #1a73e8; }
  .info small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .wrap { position: relative; }
  .wrap::before { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 78px; margin-left: -39px; border: 2px solid #1a73e8; border-radius: 12px; pointer-events: none; z-index: 2; }
  .track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 8px 0; }
  .track::-webkit-scrollbar { display: none; }
  .sp { flex: none; }
  .mes { flex: none; width: 84px; scroll-snap-align: center; text-align: center; cursor: pointer; padding: 4px 0; opacity: .45; transition: opacity .15s, transform .15s; }
  .mes.sel { opacity: 1; transform: scale(1.08); }
  .mes .m { font-size: 15px; font-weight: 600; }
  .mes .a { font-size: 11px; color: var(--muted); }
  .mes.ini { border-left: 1px dashed var(--line); }

  .mapwrap { flex: 1; position: relative; min-width: 0; min-height: 0; display: flex; }
  .mapwrap main { flex: 1; min-width: 0; }
  .card { position: absolute; left: 12px; bottom: 12px; z-index: 5; width: min(340px, calc(100% - 24px)); max-height: 60%; overflow-y: auto;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-left: 4px solid #1a73e8; border-radius: 12px;
    padding: 12px 34px 12px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.25); font-size: 13.5px; line-height: 1.4; }
  .card[hidden] { display: none; }
  .card h3 { font-size: 14px; margin-bottom: 4px; }
  .card .sub { font-weight: 600; margin-bottom: 4px; }
  .card .cita { margin-top: 6px; color: #1a73e8; font-weight: 600; }
  .card .x { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
  @media (max-width: 700px) {
    .cols { flex-direction: column; }
    aside { width: 100%; height: 34%; border-right: 0; border-bottom: 1px solid var(--line); }
    main { flex: 1; min-height: 0; padding-top: 0; }
    .mapa { width: 160%; }
  }
  #map { width: 100%; height: 100%; background: #aad3df; }
  .leaflet-tooltip.nom { background: #222; color: #fff; border: 0; font-size: 13px; padding: 4px 8px; box-shadow: none; }
  .leaflet-tooltip.nom::before { display: none; }
  .pinicon { background: none; border: 0; }
  .pinicon svg { width: 36px; height: 36px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .card, .leaflet-top, .leaflet-bottom { z-index: 1000; }
  .cab { display: flex; align-items: center; justify-content: space-between; padding-right: 12px; }
  .plegar { border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
  aside.oculto { display: none; }
  .tabflot { position: absolute; top: 10px; left: 10px; z-index: 1000; border: 0; background: var(--panel); color: var(--text); padding: 9px 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.3); cursor: pointer; font-size: 14px; font-weight: 600; }
  .tabflot[hidden] { display: none; }
  .barra { width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; background: var(--panel); color: var(--text); padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .rueda.cerrada .cuerpo { display: none; }
  .card.grande { width: min(620px, calc(100% - 24px)); max-height: 80%; }
  .card .cita { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font: inherit; font-weight: 600; display: block; color: #1a73e8; }
  #texto { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
  #texto[hidden] { display: none; }
  #texto .ref { font-weight: 700; margin-top: 8px; }
  #texto .cap { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #texto p { margin: 4px 0 8px; }
  #texto sup { color: #1a73e8; margin-right: 2px; font-size: 10px; }
  #texto .pie { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .tabflot { background: #1a73e8; color: #fff; border: 2px solid #fff; padding: 11px 18px; font-size: 15px; border-radius: 14px; box-shadow: 0 3px 12px rgba(0,0,0,.45); }
  .rueda.cerrada .barra { background: #1a73e8; color: #fff; padding: 13px 16px; font-size: 15px; box-shadow: 0 -3px 12px rgba(0,0,0,.35); }
  .barra { border-top: 3px solid #1a73e8; }
  #texto .pie a { color: #1a73e8; }
  .pas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tabp { border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 12px; }
  .tabp.sel { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  #texto iframe { width: 100%; height: 340px; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: block; }
  #texto .abrir { display: inline-block; margin-top: 8px; font-size: 13px; color: #1a73e8; font-weight: 600; }
</style>
</head>
<body>
<div class="app">
<div class="cols">
  <aside>
    <div class="cab"><h1>Tierra Santa</h1><button class="plegar" id="plegarLista" title="Ocultar lugares">◀ Ocultar</button></div>
    <div class="tools">
      <input id="buscar" type="search" placeholder="Buscar lugar…">
      <button id="btnLimpiar">Limpiar</button>
    </div>
    <ul id="lista"></ul>
  </aside>
  <div class="mapwrap">
  <main id="main">
    <div id="map"></div>
  </main>
  <div class="card" id="card" hidden>
    <button class="x" id="cerrar" aria-label="Cerrar">×</button>
    <h3 id="ct"></h3><div class="sub" id="cs"></div><div id="cp"></div><button class="cita" id="cc" type="button"></button><div id="texto" hidden></div>
  </div>
  <button class="tabflot" id="abrirLista" type="button" hidden>☰ Lugares</button>
  </div>
</div>
<footer class="rueda" id="rueda">
  <button class="barra" id="barraRueda" type="button"><span>🕰 Rueda del ministerio público</span><span id="flecha">▾</span></button>
  <div class="cuerpo" id="cuerpoRueda">
    <div class="info" id="info"></div>
    <div class="wrap"><div class="track" id="track"></div></div>
  </div>
</footer>
</div>

<script>
  const PL = [["Tiro",33.2705,35.2038],["Panias",33.2480,35.6942],["Monfort",33.0494,35.2272],["Katzrin",32.9900,35.6911],["Safed",32.9646,35.4960],
["Corazín",32.9096,35.5517],["Cafarnaum",32.8805,35.5750],["Tabgha",32.8728,35.5483],["Betsaida",32.9097,35.6306],["Acre",32.9234,35.0818],
["Magdala",32.8261,35.5169],["Gergesa",32.8244,35.6580],["Haifa",32.7940,34.9896],["Cuernos Hattin",32.8029,35.4453],["Tiberías",32.7922,35.5312],
["Hippus",32.7792,35.6592],["Hamat Tiberías",32.7650,35.5360],["Seforis",32.7536,35.2793],["Caná",32.7467,35.3405],["Atlit",32.6892,34.9422],
["Rafana",32.7050,35.8740],["Monte Carmelo",32.7253,35.0475],["Nazaret",32.7019,35.2978],["Gadara",32.6547,35.6853],["Monte Tabor",32.6869,35.3906],
["Naín",32.6358,35.3503],["Belvior",32.5983,35.5311],["Beit Alfa",32.5167,35.4261],["Escitópolis",32.5040,35.4960],["Cesárea",32.5000,34.8917],
["Jenin",32.4600,35.3000],["Samaria",32.2766,35.1922],["Gerasa",32.2808,35.8993],["Sicar",32.2178,35.2878],["Monte Gerizim",32.2000,35.2700],
["Tel Aviv - Yafo",32.0536,34.7516],["Lod",31.9514,34.8953],["Efraín",31.9467,35.2833],["Monte Tentación",31.8765,35.4280],["Jericó",31.8700,35.4440],
["Arimatea",31.8550,35.2400],["Betabará",31.8372,35.5497],["Emaus",31.8394,34.9892],["San Jorge",31.8317,35.3939],["Betfagé",31.7795,35.2452],
["Betania",31.7710,35.2610],["Jerusalén",31.7780,35.2354],["Belén",31.7040,35.2065],["San Teodosio",31.7255,35.3250],["Campo Pastores",31.7066,35.2300],
["Mar Saba",31.7081,35.3340],["Ascalón",31.6667,34.5538],["Guvrin-Maresha",31.6061,34.8981]];
  const RES = {"Tiro": ["Ciudad fenicia de la costa. Jesús la pone como ejemplo de ciudad que habría creído si hubiera visto sus milagros, y en su región cura a la hija de la mujer sirofenicia. Pablo se detiene allí de regreso a Jerusalén.", "Mt 11,21-22; Mc 7,24-30; Hch 21,3-4", [["Mt 11,21-22", ["Matthew 11:21-22"]], ["Mc 7,24-30", ["Mark 7:24-30"]], ["Hch 21,3-4", ["Acts 21:3-4"]]]], "Panias": ["Cesarea de Filipo. Aquí Pedro confiesa que Jesús es el Mesías, Jesús le promete edificar su Iglesia sobre él y anuncia por primera vez su Pasión.", "Mt 16,13-20", [["Mt 16,13-20", ["Matthew 16:13-20"]]]], "Corazín": ["Ciudad junto al lago a la que Jesús reprocha su falta de conversión pese a los milagros que había visto.", "Mt 11,20-24; Lc 10,13-15", [["Mt 11,20-24", ["Matthew 11:20-24"]], ["Lc 10,13-15", ["Luke 10:13-15"]]]], "Cafarnaum": ["Base de Jesús en Galilea, «su ciudad». Allí enseña en la sinagoga, vive en la casa de Pedro, cura al siervo del centurión y pronuncia el discurso del Pan de Vida.", "Mt 4,13; Mc 1,21-34; Mt 8,5-13", [["Mt 4,13", ["Matthew 4:13"]], ["Mc 1,21-34", ["Mark 1:21-34"]], ["Mt 8,5-13", ["Matthew 8:5-13"]]]], "Tabgha": ["Lugar de la orilla del lago asociado por la tradición a la multiplicación de los panes y a la aparición del Resucitado, donde confía a Pedro el cuidado de su rebaño.", "Jn 21,1-17; Mt 14,13-21", [["Jn 21,1-17", ["John 21:1-17"]], ["Mt 14,13-21", ["Matthew 14:13-21"]]]], "Betsaida": ["Patria de Pedro, Andrés y Felipe. Jesús cura allí a un ciego y, en sus cercanías, multiplicó los panes para la multitud.", "Jn 1,44; Mc 8,22-26; Lc 9,10-17", [["Jn 1,44", ["John 1:44"]], ["Mc 8,22-26", ["Mark 8:22-26"]], ["Lc 9,10-17", ["Luke 9:10-17"]]]], "Acre": ["Antigua Tolemaida. Pablo se detiene un día con los hermanos al volver de su tercer viaje misionero.", "Hch 21,7", [["Hch 21,7", ["Acts 21:7"]]]], "Magdala": ["Patria de María Magdalena, discípula que siguió a Jesús desde Galilea y primera testigo de la Resurrección.", "Lc 8,1-3; Jn 20,11-18", [["Lc 8,1-3", ["Luke 8:1-3"]], ["Jn 20,11-18", ["John 20:11-18"]]]], "Gergesa": ["Orilla oriental del lago donde Jesús libera a un endemoniado y los espíritus impuros entran en una piara de cerdos.", "Mc 5,1-20", [["Mc 5,1-20", ["Mark 5:1-20"]]]], "Cuernos Hattin": ["Colina que la tradición asocia al lugar del Sermón de la montaña. Los Evangelios no nombran el monte; es una localización tradicional.", "Mt 5,1-12", [["Mt 5,1-12", ["Matthew 5:1-12"]]]], "Tiberías": ["Ciudad fundada por Herodes Antipas a orillas del lago, que da nombre al «mar de Tiberíades», escenario de la multiplicación de los panes y de la aparición del Resucitado.", "Jn 6,23; Jn 21,1", [["Jn 6,23", ["John 6:23"]], ["Jn 21,1", ["John 21:1"]]]], "Hippus": ["Ciudad de la Decápolis, región pagana donde Jesús cura al sordomudo y donde se extiende su fama. El Nuevo Testamento no nombra la ciudad, solo la región.", "Mc 7,31-37; Mt 4,25", [["Mc 7,31-37", ["Mark 7:31-37"]], ["Mt 4,25", ["Matthew 4:25"]]]], "Caná": ["Allí Jesús realiza su primer signo en una boda y cura a distancia al hijo de un funcionario real. Era también la patria de Natanael.", "Jn 2,1-11; Jn 4,46-54", [["Jn 2,1-11", ["John 2:1-11"]], ["Jn 4,46-54", ["John 4:46-54"]]]], "Nazaret": ["Patria de María y José, donde Jesús crece. En su sinagoga lee a Isaías y sus vecinos lo rechazan.", "Lc 1,26-27; Lc 4,16-30", [["Lc 1,26-27", ["Luke 1:26-27"]], ["Lc 4,16-30", ["Luke 4:16-30"]]]], "Gadara": ["Ciudad de la Decápolis cuyo territorio, según Mateo, es el escenario de la liberación de los endemoniados, llamados por eso «gadarenos».", "Mt 8,28-34", [["Mt 8,28-34", ["Matthew 8:28-34"]]]], "Monte Tabor": ["Según la tradición, el monte de la Transfiguración, donde Pedro, Santiago y Juan ven a Jesús glorificado junto a Moisés y Elías. El texto no nombra el monte.", "Mt 17,1-9", [["Mt 17,1-9", ["Matthew 17:1-9"]]]], "Naín": ["Aquí Jesús devuelve a la vida al hijo único de una viuda, signo de su compasión y de su poder sobre la muerte.", "Lc 7,11-17", [["Lc 7,11-17", ["Luke 7:11-17"]]]], "Cesárea": ["Cesarea Marítima, capital romana de Judea. Pedro bautiza allí al centurión Cornelio, primer pagano que recibe el Espíritu, y Felipe llega a ella evangelizando.", "Hch 10,1-48; Hch 8,40", [["Hch 10,1-48", ["Acts 10:1-48"]], ["Hch 8,40", ["Acts 8:40"]]]], "Samaria": ["Ciudad de la región samaritana donde Felipe predica tras la muerte de Esteban; Pedro y Juan bajan a imponer las manos a los nuevos creyentes.", "Hch 8,4-17", [["Hch 8,4-17", ["Acts 8:4-17"]]]], "Sicar": ["Junto al pozo de Jacob Jesús habla con la samaritana, se revela como Mesías y muchos samaritanos creen en él.", "Jn 4,4-42", [["Jn 4,4-42", ["John 4:4-42"]]]], "Monte Gerizim": ["Monte sagrado de los samaritanos, al que alude la samaritana. Jesús anuncia que llega la hora de adorar al Padre en espíritu y verdad.", "Jn 4,19-24", [["Jn 4,19-24", ["John 4:19-24"]]]], "Tel Aviv - Yafo": ["Yafo es la antigua Jope. Pedro resucita allí a Tabita y, hospedado en casa de Simón el curtidor, recibe la visión que abre el Evangelio a los paganos.", "Hch 9,36-43; Hch 10,9-16", [["Hch 9,36-43", ["Acts 9:36-43"]], ["Hch 10,9-16", ["Acts 10:9-16"]]]], "Lod": ["Antigua Lida, donde Pedro cura al paralítico Eneas y muchos se convierten al Señor.", "Hch 9,32-35", [["Hch 9,32-35", ["Acts 9:32-35"]]]], "Efraín": ["Pueblo del borde del desierto de Judea donde Jesús se retira con sus discípulos antes de su última Pascua.", "Jn 11,54", [["Jn 11,54", ["John 11:54"]]]], "Monte Tentación": ["Lugar que la tradición señala para los cuarenta días de ayuno y las tentaciones de Jesús en el desierto.", "Mt 4,1-11", [["Mt 4,1-11", ["Matthew 4:1-11"]]]], "Jericó": ["En esta ciudad Jesús cura al ciego Bartimeo y se hospeda en casa de Zaqueo. En el camino de Jerusalén a Jericó sitúa la parábola del buen samaritano.", "Mc 10,46-52; Lc 19,1-10; Lc 10,30-37", [["Mc 10,46-52", ["Mark 10:46-52"]], ["Lc 19,1-10", ["Luke 19:1-10"]], ["Lc 10,30-37", ["Luke 10:30-37"]]]], "Arimatea": ["Pueblo de José de Arimatea, discípulo que pidió a Pilato el cuerpo de Jesús y lo sepultó en su sepulcro nuevo. Su ubicación exacta es incierta.", "Mt 27,57-60; Jn 19,38-42", [["Mt 27,57-60", ["Matthew 27:57-60"]], ["Jn 19,38-42", ["John 19:38-42"]]]], "Betabará": ["Lugar del Bautismo de Jesús por Juan, al otro lado del Jordán. Allí encuentra a sus primeros discípulos y a él regresa más tarde.", "Jn 1,28-34; Jn 10,40-42", [["Jn 1,28-34", ["John 1:28-34"]], ["Jn 10,40-42", ["John 10:40-42"]]]], "Emaus": ["Camino de Emaús, dos discípulos reconocen al Resucitado al partir el pan. Su ubicación exacta es discutida.", "Lc 24,13-35", [["Lc 24,13-35", ["Luke 24:13-35"]]]], "Betfagé": ["En el monte de los Olivos, desde aquí Jesús envía a dos discípulos a buscar el pollino para su entrada en Jerusalén.", "Mt 21,1-11", [["Mt 21,1-11", ["Matthew 21:1-11"]]]], "Betania": ["Aldea de Marta, María y Lázaro, amigos de Jesús: aquí resucita a Lázaro y María lo unge seis días antes de la Pascua.", "Jn 11,1-44; Jn 12,1-8", [["Jn 11,1-44", ["John 11:1-44"]], ["Jn 12,1-8", ["John 12:1-8"]]]], "Jerusalén": ["Ciudad del Templo y escenario de la Pasión, muerte y Resurrección de Jesús. Allí nace la Iglesia en Pentecostés.", "Lc 9,51-53; Hch 2,1-4", [["Lc 9,51-53", ["Luke 9:51-53"]], ["Hch 2,1-4", ["Acts 2:1-4"]]]], "Belén": ["Ciudad de David, donde nace Jesús y a donde llegan los magos de Oriente.", "Lc 2,1-7; Mt 2,1-12", [["Lc 2,1-7", ["Luke 2:1-7"]], ["Mt 2,1-12", ["Matthew 2:1-12"]]]], "Campo Pastores": ["Lugar tradicional, junto a Belén, donde los ángeles anuncian a los pastores el nacimiento del Salvador.", "Lc 2,8-20", [["Lc 2,8-20", ["Luke 2:8-20"]]]]};
  const LUGARES = PL.map(([nombre, lat, lng]) => ({ nombre, lat, lng })).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

  const map = L.map('map', { zoomControl: false }).setView([32.1, 35.3], 8);

  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
  const sat = L.layerGroup([

  ]);
  osm.addTo(map);

  const MANUAL = {

  // Para ir de Galilea a Judea se sigue el valle del Jordán (Beit-Shean, Jericó), como hacían los judíos
  function viaPts(a, b) {
    const norte = l => l.lat > 32.45, sur = l => l.lat < 32.0;
    if (!((norte(a) && sur(b)) || (norte(b) && sur(a)))) return [];
    const s = norte(a) ? b : a;

  function arco(a, b) {
    const N = 24, dx = b.lng - a.lng, dy = b.lat - a.lat;

    const out = [];
    for (let i = 0; i <= N; i++) {

    const key = a.nombre + '|' + b.nombre;
    if (cacheRuta.has(key)) return cacheRuta.get(key);
    let pts = null;
    if (MANUAL[key]) pts = MANUAL[key];

  // Pinta las rutas (de la más antigua a la actual) con degradado de opacidad: actual = 100 %, 5 lugares antes = 0 %

      const d = [], tot = pts.reduce((s, p, j) => { if (!j) return 0; const x = map.distance(pts[j - 1], p); d.push(x); return s + x; }, 0) || 1;
      let acc = 0;
      for (let j = 0; j < pts.length - 1; j++) {
        const frac = (acc + d[j] / 2) / tot; acc += d[j];
        const op = Math.max(0, 1 - ((legs - k) - frac) / 5);

        L.polyline([pts[j], pts[j + 1]], { pane: 'lineas', color: '#e00000', weight: 4, opacity: op, lineCap: 'butt', interactive: false }).addTo(capaLinea);

    if (tick) return; tick = true;
    requestAnimationFrame(() => { tick = false;
      seleccionar(Math.min(M.length - 1, Math.max(0, Math.round(track.scrollLeft / IW)))); });
  });
  document.addEventListener('keydown', e => {
    if (e.target === buscar) return;
    if (e.key === 'ArrowRight') track.scrollTo({ left: Math.min(M.length - 1, actual + 1) * IW, behavior: 'smooth' });
    if (e.key === 'ArrowLeft') track.scrollTo({ left: Math.max(0, actual - 1) * IW, behavior: 'smooth' });
  });
  window.addEventListener('resize', ajustar);
  ajustar(); seleccionar(0);

  // ===== Texto bíblico: Biblia de Jerusalén (tu Biblia.html: Biblia.getPassage("Jn 3,16")) =====
  const BIBLIA = 'https://javierscervera-rgb.github.io/Herramientas/Biblia.html';
  const LIBROS = { Matthew: 'MT', Mark: 'MC', Luke: 'LC', John: 'JN', Acts: 'HCH' };
  let promBiblia = null, tokTexto = 0;

  // Carga la página de la Biblia en un iframe oculto y devuelve su objeto Biblia (solo si es del mismo origen)
  function apiBiblia() {
    if (promBiblia) return promBiblia;
    promBiblia = new Promise(res => {
      const fr = document.createElement('iframe');
      fr.src = BIBLIA;
      fr.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
      document.body.appendChild(fr);
      const t0 = Date.now();
      const fin = B => { if (!B) { fr.remove(); promBiblia = null; } res(B); };
      const intento = async () => {
        try {
          const B = fr.contentWindow && fr.contentWindow.Biblia;
          if (B && typeof B.getPassage === 'function') {
            const p = await B.getPassage('Jn 3,16');
            if (p) return fin(B);
          }
        } catch (e) { if (e && e.name === 'SecurityError') return fin(null); }
        if (Date.now() - t0 > 12000) return fin(null);
        setTimeout(intento, 300);
      };
      intento();
    });
    return promBiblia;
  }
  setTimeout(apiBiblia, 1500);

  // "Mt 5–7" -> capítulos sueltos; se quitan los paréntesis aclaratorios
  function consultas(etq) {
    const q = etq.replace(/\s*\(.*\)\s*$/, '');
    const m = q.match(/^(\S+)\s+(\d+)–(\d+)$/);
    if (!m) return [q];
    const out = [];
    for (let c = +m[2]; c <= +m[3]; c++) out.push(m[1] + ' ' + c);
    return out;
  }

  async function cargarTexto() {
    const cont = document.getElementById('texto');
    const tok = ++tokTexto;
    cont.textContent = 'Cargando texto…';
    const B = await apiBiblia();
    if (tok !== tokTexto) return;
    if (!B) return cargarMarco();
    try {
      const bloques = [];
      for (const [etq] of cardRefs) {
        const ps = [];
        for (const q of consultas(etq)) ps.push(await B.getPassage(q));
        bloques.push([etq, ps]);
      }
      if (tok !== tokTexto) return;
      cont.textContent = '';
      const el = (tag, cls, txt) => { const x = document.createElement(tag); if (cls) x.className = cls; if (txt) x.textContent = txt; return x; };
      bloques.forEach(([etq, ps]) => {
        cont.appendChild(el('div', 'ref', etq.replace(/\s*\(.*\)\s*$/, '')));
        ps.forEach(pa => {
          if (!pa) { cont.appendChild(el('div', 'cap', 'Pasaje no encontrado')); return; }
          if (ps.length > 1) cont.appendChild(el('div', 'cap', pa.reference));
          const par = el('p');
          pa.verses.forEach(v => {
            par.appendChild(el('sup', '', v.n));
            par.appendChild(document.createTextNode(String(v.text).replace(/\s+/g, ' ').trim() + ' '));
          });
          cont.appendChild(par);
        });
        const primero = ps.find(Boolean);
        if (primero && primero.url) {
          const a = el('a', 'abrir', 'Abrir en la Biblia de Jerusalén ↗');
          a.href = primero.url; a.target = '_blank'; a.rel = 'noopener';
          cont.appendChild(a);
        }
      });
      cont.appendChild(el('div', 'pie', 'Texto: Biblia de Jerusalén.'));
    } catch (e) { cargarMarco(); }
  }

  // Alternativa si la página del mapa no está en el mismo dominio que la Biblia: se muestra la página incrustada
  function urlBiblia(ref) {
    const m = ref.match(/^(\w+) (\d+)(?::(\d+))?/);
    return BIBLIA + '#/' + LIBROS[m[1]] + '/' + m[2] + '/' + (m[3] || 1);
  }
  function mostrarPasaje(k) {
    const cont = document.getElementById('texto');
    const url = urlBiblia(cardRefs[k][1][0]);
    cont.querySelectorAll('.tabp').forEach((x, j) => x.classList.toggle('sel', j === k));
    const hueco = cont.querySelector('.marco');
    hueco.textContent = '';
    const fr = document.createElement('iframe');
    fr.src = url; fr.title = cardRefs[k][0];
    hueco.appendChild(fr);
    cont.querySelector('a.abrir').href = url;
  }
  function cargarMarco() {
    const cont = document.getElementById('texto');
    cont.textContent = '';
    const pas = document.createElement('div'); pas.className = 'pas';
    cardRefs.forEach(([etq], k) => {
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'tabp'; x.textContent = etq;
      x.onclick = () => mostrarPasaje(k);
      pas.appendChild(x);
    });
    const marco = document.createElement('div'); marco.className = 'marco';
    const a = document.createElement('a');
    a.className = 'abrir'; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Abrir en la Biblia de Jerusalén ↗';
    cont.append(pas, marco, a);
    mostrarPasaje(0);
  }
  document.getElementById('cc').onclick = () => {
    const card = document.getElementById('card'), texto = document.getElementById('texto');
    const abierto = card.classList.toggle('grande');
    texto.hidden = !abierto;
    document.getElementById('cc').textContent = '📖 ' + cardCita + (abierto ? ' ▾' : ' ▸ ver texto');
    if (abierto) cargarTexto(); else tokTexto++;
  };

  // ===== Pestañas desplegables =====
  const aside = document.querySelector('aside'), abrirLista = document.getElementById('abrirLista');
  function mostrarLista(v) { aside.classList.toggle('oculto', !v); abrirLista.hidden = v; setTimeout(() => map.invalidateSize(), 50); }
  document.getElementById('plegarLista').onclick = () => mostrarLista(false);
  abrirLista.onclick = () => mostrarLista(true);
  const rueda = document.getElementById('rueda');
  document.getElementById('barraRueda').onclick = () => {
    const c = rueda.classList.toggle('cerrada');
    document.getElementById('flecha').textContent = c ? '▴' : '▾';
    setTimeout(() => { map.invalidateSize(); if (!c) { ajustar(); track.scrollLeft = actual * IW; } }, 50);
  };
</script>
</body>
